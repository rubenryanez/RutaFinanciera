/* ═══════════════ core/format.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Formato (es-CL)
   ============================================================ */

var Fmt = (function () {

  /* Porcentaje con coma decimal. Siempre 2 decimales. */
  function pct(v, opts) {
    opts = opts || {};
    if (v === null || v === undefined || isNaN(v)) return '—';
    var s = Math.abs(v).toFixed(2).replace('.', ',');
    var sign = v < 0 ? '−' : (opts.signed && v > 0 ? '+' : '');
    return sign + s + '%';
  }

  /* Número decimal genérico (volatilidad, valor cuota) */
  function num(v, decimals) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    var d = (decimals === undefined) ? 2 : decimals;
    return v.toLocaleString('es-CL', {
      minimumFractionDigits: d,
      maximumFractionDigits: d
    });
  }

  /* Valor cuota: 4 decimales, como el reporte */
  function cuota(v) {
    return num(v, 4);
  }

  /* Pesos chilenos */
  function clp(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    return '$' + Math.round(v).toLocaleString('es-CL');
  }

  /* UF */
  function uf(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    return num(v, 2) + ' UF';
  }

  /* Días con separador de miles */
  function dias(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    return v.toLocaleString('es-CL') + ' días';
  }

  /* Clase de signo para color.
     DECISIÓN: solo se colorea el negativo. Si toda cifra positiva va en
     verde, la tabla completa queda verde y el color deja de informar.
     Reservándolo al negativo, el ojo encuentra la excepción. */
  function signClass(v) {
    if (v === null || v === undefined || isNaN(v)) return '';
    if (v < 0) return 'neg';
    return '';
  }

  /* Escapado de texto para innerHTML */
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* Reemplaza un nodo conservando la posición de scroll.
     Al sustituir un bloque de detalle, el documento se acorta un
     instante y el navegador reajusta el scroll; esto lo restituye. */
  function swap(nodo, html) {
    var y = window.scrollY;
    nodo.outerHTML = html;
    /* Instantáneo: con scroll-behavior:smooth la restitución se
       animaría y produciría un salto visible. */
    try { window.scrollTo({ top: y, behavior: 'instant' }); }
    catch (e) { window.scrollTo(0, y); }
  }

  return {
    pct: pct, num: num, cuota: cuota, clp: clp, uf: uf,
    dias: dias, signClass: signClass, esc: esc, swap: swap
  };
})();


/* ═══════════════ core/state.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · APP_STATE
   ------------------------------------------------------------
   Única fuente de verdad. Cualquier módulo que cambie una
   selección escribe aquí; el resto reacciona.

   Persistencia: sessionStorage (NO localStorage).
   La herramienta se usa en sesiones con distintos casos;
   arrastrar estado entre sesiones genera errores.
   ============================================================ */

var AppState = (function () {

  var KEY = 'ruta_financiera_state_v1';

  var DEFAULT = {
    edad: null,
    etapa: null,
    objetivo: null,
    horizonte: null,
    vehiculo: null,
    serie: null,
    fondoId: null,
    simulacion: null,
    brecha: null,
    resultadoVisto: false,
    /* Capa complementaria: no sustituye a la Ruta principal.
       estrategia[capa] = { activa, vehiculo, serie, fondoId, simulacion } */
    estrategia: null,
    /* Capa desde la que el usuario salió a explorar fondos o simular */
    estrategiaFoco: null,
    rutaIniciadaEn: null
  };

  var state = clone(DEFAULT);
  var listeners = [];

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---- Persistencia ---- */

  function load() {
    try {
      var raw = sessionStorage.getItem(KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      Object.keys(DEFAULT).forEach(function (k) {
        if (parsed[k] !== undefined) state[k] = parsed[k];
      });
    } catch (e) {
      /* sessionStorage no disponible (por ejemplo, file:// en
         algunos navegadores con almacenamiento bloqueado).
         La herramienta sigue funcionando solo en memoria. */
      console.warn('[state] sessionStorage no disponible, se trabaja en memoria.', e);
    }
  }

  function save() {
    try {
      sessionStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) { /* silencioso: no bloquea el uso */ }
  }

  /* ---- Lectura ---- */

  function get(key) {
    return key ? state[key] : clone(state);
  }

  function has(key) {
    var v = state[key];
    return v !== null && v !== undefined && v !== '';
  }

  /* ---- Escritura ---- */

  function set(patch, meta) {
    var changed = [];
    Object.keys(patch).forEach(function (k) {
      if (!(k in DEFAULT)) {
        console.warn('[state] clave desconocida ignorada:', k);
        return;
      }
      if (JSON.stringify(state[k]) !== JSON.stringify(patch[k])) {
        state[k] = patch[k];
        changed.push(k);
      }
    });

    if (!state.rutaIniciadaEn && changed.length) {
      state.rutaIniciadaEn = new Date().toISOString();
      changed.push('rutaIniciadaEn');
    }

    if (changed.length) {
      save();
      notify(changed, meta || {});
    }
    return changed;
  }

  function reset() {
    state = clone(DEFAULT);
    save();
    notify(Object.keys(DEFAULT), { reset: true });
  }

  /* ---- Estrategia ---- */

  function capasActivas() {
    var e = state.estrategia;
    if (!e) return [];
    return STRATEGY_ORDER.filter(function (id) {
      return e[id] && e[id].activa;
    });
  }

  function capa(id) {
    return (state.estrategia && state.estrategia[id]) ? clone(state.estrategia[id]) : null;
  }

  function toggleCapa(id) {
    var def = STRATEGY_LAYERS[id];
    if (!def) return;

    var e = state.estrategia ? clone(state.estrategia) : {};

    if (e[id] && e[id].activa) {
      delete e[id];
    } else {
      e[id] = {
        activa: true,
        vehiculo: def.vehiculo,
        serie: def.serie,
        fondoId: null,
        simulacion: null
      };
    }

    set({ estrategia: Object.keys(e).length ? e : null });
  }

  /* Actualiza una capa existente sin tocar el resto */
  function setCapa(id, patch) {
    if (!state.estrategia || !state.estrategia[id]) return;
    var e = clone(state.estrategia);
    Object.keys(patch).forEach(function (k) { e[id][k] = patch[k]; });
    set({ estrategia: e });
  }

  /* ---- Suscripción ---- */

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      listeners = listeners.filter(function (l) { return l !== fn; });
    };
  }

  function notify(changed, meta) {
    listeners.forEach(function (fn) {
      try { fn(clone(state), changed, meta); }
      catch (e) { console.error('[state] error en suscriptor', e); }
    });
  }

  /* ---- Coherencia (informa, no corrige) ----
     Devuelve advertencias cuando la combinación de selecciones
     es inconsistente. NUNCA modifica el estado por su cuenta:
     la herramienta informa, el usuario decide. */

  function checkCoherence() {
    var w = [];

    if (state.serie && state.horizonte) {
      var sc = SERIES_CONFIG[state.serie];
      if (sc && sc.horizonte !== state.horizonte) {
        w.push({
          campo: 'serie',
          texto: sc.label + ' corresponde a horizonte ' +
                 HORIZON_CONFIG[sc.horizonte].nombre.toLowerCase() +
                 ' (' + sc.horizonteRef + '). Revisa la selección.'
        });
      }
    }

    if (state.fondoId && state.serie) {
      var f = FUND_CATALOG[state.fondoId];
      if (f && f.series.indexOf(state.serie) === -1) {
        w.push({
          campo: 'fondo',
          texto: f.nombre + ' no está disponible en ' +
                 SERIES_CONFIG[state.serie].label +
                 ' según el reporte al ' + DATA_META.date + '.'
        });
      }
    }

    if (state.objetivo && state.horizonte) {
      var oc = OBJECTIVE_CONFIG[state.objetivo];
      if (oc && oc.horizonteSugerido !== state.horizonte) {
        w.push({
          campo: 'horizonte',
          texto: 'El objetivo "' + oc.nombre + '" sugiere horizonte ' +
                 HORIZON_CONFIG[oc.horizonteSugerido].nombre.toLowerCase() +
                 '. La selección actual es distinta.'
        });
      }
    }

    return w;
  }

  load();

  return {
    get: get,
    has: has,
    set: set,
    reset: reset,
    capasActivas: capasActivas,
    capa: capa,
    toggleCapa: toggleCapa,
    setCapa: setCapa,
    subscribe: subscribe,
    checkCoherence: checkCoherence,
    _key: KEY
  };
})();


/* ═══════════════ core/data-access.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Acceso a datos
   ------------------------------------------------------------
   Toda consulta al catálogo y a las rentabilidades pasa por
   aquí. Los módulos de interfaz no leen RETURN_DATA ni
   FUND_CATALOG directamente.
   ============================================================ */

var Data = (function () {

  /* ---- Fondos ---- */

  function fund(id) {
    return FUND_CATALOG[id] || null;
  }

  /* Fondos disponibles en una serie, en orden de catálogo */
  function fundsBySeries(serie) {
    return FUND_ORDER
      .map(function (id) { return FUND_CATALOG[id]; })
      .filter(function (f) { return f && f.series.indexOf(serie) !== -1; });
  }

  /* Fondos de una serie agrupados por categoría.
     Devuelve [{ categoria, fondos: [] }] omitiendo categorías vacías. */
  function fundsGrouped(serie, horizonte) {
    var list = fundsBySeries(serie);
    if (horizonte) {
      list = list.filter(function (f) { return f.horizonte === horizonte; });
    }
    return CATEGORY_ORDER.map(function (catId) {
      return {
        categoria: FUND_CATEGORIES[catId],
        fondos: list.filter(function (f) { return f.categoria === catId; })
      };
    }).filter(function (g) { return g.fondos.length > 0; });
  }

  /* Categorías que existen en el catálogo pero no en esta serie.
     Permite informar la ausencia en lugar de ocultarla en silencio. */
  function missingCategories(serie) {
    var present = {};
    fundsBySeries(serie).forEach(function (f) { present[f.categoria] = true; });

    return CATEGORY_ORDER
      .filter(function (catId) {
        if (present[catId]) return false;
        return FUND_ORDER.some(function (id) {
          return FUND_CATALOG[id].categoria === catId;
        });
      })
      .map(function (catId) { return FUND_CATEGORIES[catId]; });
  }

  /* Fondos de una categoría dentro de una serie */
  function fundsInCategory(serie, catId, horizonte) {
    return fundsBySeries(serie).filter(function (f) {
      if (f.categoria !== catId) return false;
      if (horizonte && f.horizonte !== horizonte) return false;
      return true;
    });
  }

  /* Anclas de la escala de volatilidad: el menor y el mayor del
     universo comparable. Dan escala sin usar etiquetas de riesgo. */
  function volatilityAnchors(serie) {
    var list = fundsBySeries(serie)
      .map(function (f) {
        var r = returns(serie, f.id);
        return r ? { id: f.id, nombre: f.nombre, v: r.volatilidad } : null;
      })
      .filter(Boolean)
      .sort(function (a, b) { return a.v - b.v; });

    return { min: list[0] || null, max: list[list.length - 1] || null };
  }

  /* ¿La volatilidad publicada es 0,00? (C15) */
  function isZeroVolatility(serie, fondoId) {
    var r = returns(serie, fondoId);
    return !!r && r.volatilidad === 0;
  }

  /* ---- Rentabilidades ---- */

  function returns(serie, fondoId) {
    if (!RETURN_DATA[serie]) return null;
    return RETURN_DATA[serie][fondoId] || null;
  }

  /* Mismo fondo en todas las series donde existe.
     Base del bloque educativo "mismo fondo, distinta serie". */
  function acrossSeries(fondoId, campo) {
    var f = fund(fondoId);
    if (!f) return [];
    return f.series.map(function (s) {
      var r = returns(s, fondoId);
      return {
        serie: s,
        label: SERIES_CONFIG[s].label,
        valor: r ? r[campo || 'ultimoAno'] : null
      };
    });
  }

  /* ---- Escala de volatilidad ----
     Posición relativa dentro del universo comparable (misma serie).
     NO devuelve etiquetas categóricas: solo cifra y posición. */

  function volatilityScale(serie) {
    var vals = fundsBySeries(serie)
      .map(function (f) {
        var r = returns(serie, f.id);
        return r ? r.volatilidad : null;
      })
      .filter(function (v) { return v !== null; });

    return {
      min: Math.min.apply(null, vals),
      max: Math.max.apply(null, vals),
      count: vals.length
    };
  }

  /* Devuelve { valor, ratio, rank, total } — sin etiqueta de riesgo */
  function volatilityPosition(serie, fondoId) {
    var r = returns(serie, fondoId);
    if (!r) return null;

    var scale = volatilityScale(serie);
    var list = fundsBySeries(serie)
      .map(function (f) {
        var rr = returns(serie, f.id);
        return { id: f.id, v: rr ? rr.volatilidad : null };
      })
      .filter(function (x) { return x.v !== null; })
      .sort(function (a, b) { return a.v - b.v; });

    var rank = list.findIndex(function (x) { return x.id === fondoId; }) + 1;

    return {
      valor: r.volatilidad,
      ratio: scale.max > 0 ? (r.volatilidad / scale.max) : 0,
      rank: rank,
      total: list.length,
      min: scale.min,
      max: scale.max
    };
  }

  /* Color de la escala de volatilidad, por quintil.
     Uso exclusivo en barras y gráficos, nunca como etiqueta. */
  function volatilityColor(ratio) {
    if (ratio < 0.2) return 'var(--vol-1)';
    if (ratio < 0.4) return 'var(--vol-2)';
    if (ratio < 0.6) return 'var(--vol-3)';
    if (ratio < 0.8) return 'var(--vol-4)';
    return 'var(--vol-5)';
  }

  /* ---- Integridad ----
     Verifica que catálogo y rentabilidades estén alineados. */

  function integrityCheck() {
    var errors = [];
    var warnings = [];

    FUND_ORDER.forEach(function (id) {
      var f = FUND_CATALOG[id];
      if (!f) { errors.push('FUND_ORDER referencia id inexistente: ' + id); return; }
      if (!FUND_CATEGORIES[f.categoria]) {
        errors.push(f.nombre + ': categoría desconocida "' + f.categoria + '"');
      }
      if (!HORIZON_CONFIG[f.horizonte]) {
        errors.push(f.nombre + ': horizonte desconocido "' + f.horizonte + '"');
      }
      f.series.forEach(function (s) {
        if (!SERIES_CONFIG[s]) {
          errors.push(f.nombre + ': serie desconocida "' + s + '"');
          return;
        }
        if (!returns(s, id)) {
          errors.push(f.nombre + ' declara ' + s + ' pero no tiene datos en RETURN_DATA');
        }
      });
    });

    SERIES_ORDER.forEach(function (s) {
      if (!RETURN_DATA[s]) { errors.push('RETURN_DATA sin serie ' + s); return; }
      Object.keys(RETURN_DATA[s]).forEach(function (id) {
        var f = FUND_CATALOG[id];
        if (!f) {
          errors.push('RETURN_DATA.' + s + ' tiene fondo no catalogado: ' + id);
        } else if (f.series.indexOf(s) === -1) {
          errors.push(f.nombre + ' tiene datos en ' + s + ' pero no la declara en su catálogo');
        }
      });
    });

    /* Volatilidad 0,00 — inconsistencia de la fuente (C15) */
    SERIES_ORDER.forEach(function (s) {
      Object.keys(RETURN_DATA[s] || {}).forEach(function (id) {
        if (RETURN_DATA[s][id].volatilidad === 0) {
          warnings.push(FUND_CATALOG[id].nombre + ' · ' + SERIES_CONFIG[s].label +
                        ': volatilidad 0,00 en el reporte oficial (C15, sin resolver)');
        }
      });
    });

    return { errors: errors, warnings: warnings, ok: errors.length === 0 };
  }

  function counts() {
    var total = 0;
    SERIES_ORDER.forEach(function (s) {
      total += Object.keys(RETURN_DATA[s] || {}).length;
    });
    return {
      fondos: FUND_ORDER.length,
      series: SERIES_ORDER.length,
      categorias: CATEGORY_ORDER.length,
      registros: total
    };
  }

  return {
    fund: fund,
    fundsBySeries: fundsBySeries,
    fundsGrouped: fundsGrouped,
    fundsInCategory: fundsInCategory,
    missingCategories: missingCategories,
    returns: returns,
    acrossSeries: acrossSeries,
    volatilityScale: volatilityScale,
    volatilityPosition: volatilityPosition,
    volatilityAnchors: volatilityAnchors,
    volatilityColor: volatilityColor,
    isZeroVolatility: isZeroVolatility,
    integrityCheck: integrityCheck,
    counts: counts
  };
})();


/* ═══════════════ core/calc.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Cálculo
   ------------------------------------------------------------
   Capitalización mensual con aporte periódico.
   Ninguna función de este archivo decide un supuesto: el
   supuesto siempre llega como parámetro desde la interfaz.
   ============================================================ */

var Calc = (function () {

  /* Proyección mes a mes.
     capital: capital inicial
     aporte:  aporte mensual
     anios:   horizonte en años
     tasaAnual: supuesto anual en %, editable por el usuario

     Devuelve la serie anual y los totales. */
  function proyectar(capital, aporte, anios, tasaAnual) {
    capital = Number(capital) || 0;
    aporte = Number(aporte) || 0;
    anios = Math.max(1, Math.round(Number(anios) || 1));

    var t = (Number(tasaAnual) || 0) / 100;
    var tasaMes = Math.pow(1 + t, 1 / 12) - 1;
    var meses = anios * 12;

    var cap = capital;
    var serie = [{ anio: 0, total: capital, aportado: capital }];

    for (var i = 1; i <= meses; i++) {
      cap = cap * (1 + tasaMes) + aporte;
      if (i % 12 === 0) {
        serie.push({
          anio: i / 12,
          total: cap,
          aportado: capital + aporte * i
        });
      }
    }

    var aportado = capital + aporte * meses;

    return {
      serie: serie,
      aportado: aportado,
      final: cap,
      crecimiento: cap - aportado,
      /* Proporción del capital final que proviene del crecimiento
         compuesto y no del aporte de la persona. */
      pctCrecimiento: cap > 0 ? ((cap - aportado) / cap) * 100 : 0
    };
  }

  /* Tramo de costo de salida de la Serie P aplicable a un horizonte */
  function tramoSalida(anios) {
    var dias = Math.round((Number(anios) || 0) * 365);
    var tramos = SERIES_CONFIG.P.costoSalida;

    for (var i = 0; i < tramos.length; i++) {
      var t = tramos[i];
      if (t.hasta === null || dias <= t.hasta) {
        return { tramo: t, dias: dias };
      }
    }
    return { tramo: tramos[tramos.length - 1], dias: dias };
  }

  /* Brecha previsional. Todas las variables son ingresadas:
     no se asume tasa de reemplazo ni se calcula pensión. */
  function brecha(ingresoDeseado, pensionEstimada, anios) {
    var deseado = Number(ingresoDeseado) || 0;
    var pension = Number(pensionEstimada) || 0;
    var a = Math.max(0, Number(anios) || 0);

    var mensual = Math.max(0, deseado - pension);

    return {
      deseado: deseado,
      pension: pension,
      mensual: mensual,
      anios: a,
      /* Suma nominal del período, sin rentabilidad ni inflación */
      totalNominal: mensual * 12 * a,
      pctCubierto: deseado > 0 ? Math.min(100, (pension / deseado) * 100) : 0
    };
  }

  return {
    proyectar: proyectar,
    tramoSalida: tramoSalida,
    brecha: brecha
  };
})();


/* ═══════════════ core/router.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Router
   ------------------------------------------------------------
   DECISIÓN TÉCNICA: routing por hash, no History API.
   El proyecto debe funcionar abriendo index.html directamente
   (file://). History.pushState falla o queda inconsistente bajo
   file://; el hash funciona en cualquier contexto y conserva
   el botón atrás del navegador.

   Formato de ruta:  #/fondos            → { name:'fondos', params:[] }
                     #/fondos/cd_moderado → { name:'fondos', params:['cd_moderado'] }
   ============================================================ */

var Router = (function () {

  var routes = {};
  var notFound = null;
  var current = null;
  var beforeHooks = [];

  function parse() {
    var h = window.location.hash.replace(/^#\/?/, '');
    var parts = h.split('/').filter(function (p) { return p.length; });
    return {
      name: parts[0] || 'inicio',
      params: parts.slice(1),
      raw: h
    };
  }

  function register(name, handler) {
    routes[name] = handler;
  }

  function setNotFound(handler) {
    notFound = handler;
  }

  function before(fn) {
    beforeHooks.push(fn);
  }

  /* Duración de la salida antes de reemplazar el contenido.
     Con prefers-reduced-motion se omite por completo. */
  var OUT_MS = 100;

  function reduced() {
    return window.matchMedia &&
           window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  var pendiente = null;

  function resolve() {
    var route = parse();
    var handler = routes[route.name] || notFound;

    if (!handler) {
      console.warn('[router] ruta sin handler:', route.name);
      return;
    }

    current = route;
    beforeHooks.forEach(function (fn) { fn(route); });

    var outlet = document.getElementById('view');
    if (!outlet) { console.error('[router] falta #view'); return; }

    function pintar() {
      pendiente = null;
      outlet.classList.remove('view-out');
      outlet.innerHTML = '';
      handler(outlet, route.params, route);
      /* Instantáneo: el cambio de pantalla ya tiene su propia
         transición de opacidad; un scroll animado se superpondría. */
      try { window.scrollTo({ top: 0, behavior: 'instant' }); }
      catch (e) { window.scrollTo(0, 0); }
    }

    /* Si hay una transición en curso, se descarta: la navegación
       rápida entre módulos no debe encolar renders. */
    if (pendiente) { clearTimeout(pendiente); pendiente = null; }

    if (reduced()) { pintar(); return; }

    outlet.classList.add('view-out');
    pendiente = setTimeout(pintar, OUT_MS);
  }

  function go(path) {
    var target = path.charAt(0) === '#' ? path : '#/' + path.replace(/^\/+/, '');
    if (window.location.hash === target) {
      resolve();  /* re-render forzado si es la misma ruta */
    } else {
      window.location.hash = target;
    }
  }

  function getCurrent() {
    return current ? JSON.parse(JSON.stringify(current)) : null;
  }

  function start() {
    window.addEventListener('hashchange', resolve);
    if (!window.location.hash) {
      window.location.hash = '#/inicio';
    } else {
      resolve();
    }
  }

  return {
    register: register,
    setNotFound: setNotFound,
    before: before,
    go: go,
    start: start,
    getCurrent: getCurrent,
    parse: parse
  };
})();


/* ═══════════════ core/update.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Comprobación de versión publicada
   ------------------------------------------------------------
   Al reemplazar index.html en el servidor, el navegador y el CDN
   pueden seguir sirviendo la copia anterior. Esta comprobación
   consulta version.json —con parámetro anti-caché— y avisa
   cuando la versión publicada es más reciente que la cargada.

   No recarga por su cuenta: informa y deja la decisión al usuario,
   para no interrumpir una simulación a medio hacer.

   Sólo actúa sobre http/https. Abierto por doble clic (file://)
   no hay servidor que consultar y la comprobación se omite.
   ============================================================ */

var UpdateCheck = (function () {

  var INTERVALO_MIN = 10;      /* minutos entre comprobaciones */
  var ultima = 0;
  var avisado = false;

  function aplicable() {
    return (location.protocol === 'http:' || location.protocol === 'https:');
  }

  function banner(version) {
    if (avisado) return;
    avisado = true;

    var el = document.createElement('div');
    el.className = 'upd';
    el.setAttribute('role', 'status');
    el.innerHTML =
      '<span class="upd-t">Hay una versión más reciente disponible.</span>' +
      '<button type="button" class="upd-btn" id="upd-recargar">Actualizar</button>' +
      '<button type="button" class="upd-x" id="upd-cerrar" aria-label="Descartar">×</button>';
    document.body.appendChild(el);

    document.getElementById('upd-recargar').addEventListener('click', function () {
      /* Se fuerza la relectura desde el servidor, no desde caché. */
      var u = location.href.split('#')[0];
      var sep = u.indexOf('?') === -1 ? '?' : '&';
      location.replace(u + sep + 'v=' + encodeURIComponent(version) + location.hash);
    });

    document.getElementById('upd-cerrar').addEventListener('click', function () {
      el.remove();
    });
  }

  function comprobar(forzar) {
    if (!aplicable()) return;

    var ahora = Date.now();
    if (!forzar && ahora - ultima < INTERVALO_MIN * 60000) return;
    ultima = ahora;

    if (typeof fetch !== 'function') return;

    fetch('version.json?t=' + ahora, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.version) return;
        if (typeof APP_VERSION === 'undefined') return;
        /* La versión de referencia es la publicada: si difiere de la
           que se está ejecutando, hay algo más nuevo en el servidor. */
        if (data.version !== APP_VERSION) banner(data.version);
      })
      .catch(function () { /* sin conexión o sin version.json: se ignora */ });
  }

  function init() {
    if (!aplicable()) return;
    comprobar(true);
    /* Al volver a la pestaña se vuelve a comprobar, que es cuando
       resulta más probable que la publicación haya cambiado. */
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) comprobar(false);
    });
  }

  return { init: init, comprobar: comprobar };
})();

/* ═══════════════ ui/checkpoint.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · RouteCheckpoint
   ------------------------------------------------------------
   Muestra al final de un módulo qué quedó definido antes de
   avanzar. Informa; no bloquea.

   No usa window.confirm ni ventanas modales: se integra al pie
   de la pantalla. Tono sobrio, sin colores de alerta.
   ============================================================ */

var RouteCheckpoint = (function () {

  /* opts = {
       titulo:    encabezado, por defecto "Antes de continuar"
       items:     [{ k, v }]  · v nulo o vacío se muestra "Sin definir"
       mensaje:   línea explicativa
       acciones:  [{ label, href, id, primary }]
     }
     Las acciones con `href` navegan; las que llevan `id` las
     enlaza el módulo que invoca el componente. */

  function html(opts) {
    var items = (opts.items || []).map(function (i) {
      var vacio = !i.v;
      return '<div class="cp-item">' +
               '<div class="cp-k">' + Fmt.esc(i.k) + '</div>' +
               '<div class="cp-v' + (vacio ? ' is-empty' : '') + '">' +
                 Fmt.esc(vacio ? 'Sin definir' : i.v) + '</div>' +
             '</div>';
    }).join('');

    var acciones = (opts.acciones || []).map(function (a) {
      var cls = a.primary ? 'btn btn--primary' : 'btn btn--secondary';
      if (a.href) {
        return '<a class="' + cls + '" href="' + a.href + '"' +
               (a.id ? ' id="' + a.id + '"' : '') + '>' + Fmt.esc(a.label) + '</a>';
      }
      return '<button type="button" class="' + cls + '" id="' + (a.id || '') + '">' +
             Fmt.esc(a.label) + '</button>';
    }).join('');

    return '<section class="cp">' +
      '<div class="cp-t">' + Fmt.esc(opts.titulo || 'Antes de continuar') + '</div>' +
      (items ? '<div class="cp-items">' + items + '</div>' : '') +
      (opts.mensaje ? '<p class="cp-msg">' + Fmt.esc(opts.mensaje) + '</p>' : '') +
      (acciones ? '<div class="cp-acts">' + acciones + '</div>' : '') +
    '</section>';
  }

  /* Atajo: construye el bloque a partir de si todo está definido */
  function build(items, completo, textos) {
    return html({
      items: items,
      mensaje: completo ? textos.completo : textos.parcial,
      acciones: completo ? textos.accionesCompleto : textos.accionesParcial
    });
  }

  return { html: html, build: build };
})();


/* ═══════════════ ui/nav.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Navegación
   ------------------------------------------------------------
   Desktop: sidebar fijo de 240px con iconografía lineal,
   colapsable a icono. Tablet/móvil: drawer con scrim.
   ============================================================ */

var Nav = (function () {

  var GROUPS = [
    { k: null, items: [
      { route:'inicio', label:'Inicio', ico:'inicio' }
    ]},
    { k: 'Mi ruta', items: [
      { route:'diagnostico', label:'Diagnóstico', ico:'diagnostico' },
      { route:'soluciones',  label:'Soluciones',  ico:'soluciones' },
      { route:'estrategia',  label:'Estrategia',  ico:'estrategia' },
      { route:'ruta',        label:'Resumen de la Ruta', ico:'ruta' }
    ]},
    { k: 'Herramientas', items: [
      { route:'fondos',     label:'Fondos',     ico:'fondos' },
      { route:'educacion',  label:'Educación',  ico:'educacion' },
      { route:'simulador',  label:'Simulador',  ico:'simulador' },
      { route:'tributario', label:'Tributario', ico:'tributario' },
      { route:'brecha',     label:'Brecha Previsional', ico:'brecha' }
    ]}
  ];

  var ALL = GROUPS.reduce(function (a, g) { return a.concat(g.items); }, []);

  var PASOS = [
    { id:'diagnostico', label:'Diagnóstico', href:'#/diagnostico' },
    { id:'solucion',    label:'Solución',    href:'#/soluciones' },
    { id:'fondo',       label:'Fondo',       href:'#/fondos' },
    { id:'simulacion',  label:'Simulación',  href:'#/simulador' },
    { id:'resultado',   label:'Resultado',   href:'#/ruta' }
  ];

  /* Completitud derivada de APP_STATE. No bloquea la navegación. */
  function progreso() {
    var s = AppState.get();
    var sim = s.simulacion;
    return {
      diagnostico: !!(s.etapa && s.objetivo && s.horizonte),
      solucion:    !!(s.vehiculo && s.serie) || AppState.capasActivas().length > 0,
      fondo:       !!s.fondoId,
      simulacion:  !!(sim && sim.generadaEn && sim.final > 0),
      resultado:   !!s.resultadoVisto
    };
  }

  function progresoHTML() {
    var p = progreso();
    var hechos = PASOS.filter(function (x) { return p[x.id]; }).length;

    return '<div class="sb-prog" id="sb-prog">' +
      '<div class="sb-prog-k">Progreso · ' + hechos + ' de ' + PASOS.length + '</div>' +
      '<div class="sb-steps">' + PASOS.map(function (x) {
        var on = p[x.id];
        return '<a class="sb-step' + (on ? ' is-done' : '') + '" href="' + x.href + '" ' +
                 'title="' + Fmt.esc(x.label) + '">' +
                 '<span class="sb-mark" aria-hidden="true">' + (on ? '✓' : '') + '</span>' +
                 '<span>' + Fmt.esc(x.label) + '</span>' +
               '</a>';
      }).join('') + '</div>' +
    '</div>';
  }

  function refreshProgreso() {
    var el = document.getElementById('sb-prog');
    if (!el) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = progresoHTML();
    el.replaceWith(tmp.firstChild);
  }

  function itemsHTML(active) {
    return GROUPS.map(function (g) {
      var head = g.k ? '<div class="sb-gk">' + Fmt.esc(g.k) + '</div>' : '';
      var links = g.items.map(function (i) {
        var cls = 'sb-i' + (i.route === active ? ' is-active' : '');
        var aria = i.route === active ? ' aria-current="page"' : '';
        return '<a class="' + cls + '" href="#/' + i.route + '" data-nav="' + i.route + '" ' +
               'title="' + Fmt.esc(i.label) + '"' + aria + '>' +
               Icons.svg(i.ico) + '<span>' + Fmt.esc(i.label) + '</span></a>';
      }).join('');
      var prog = g.k === 'Mi ruta' ? progresoHTML() : '';
      return '<div class="sb-group">' + head + links + prog + '</div>';
    }).join('');
  }

  function render(active) {
    var sb = document.getElementById('sb');
    if (sb) {
      sb.innerHTML =
        '<div class="sb-brand">' +
          '<a href="#/inicio">' +
            Icons.isotipo(26) +
            '<span class="sb-brand-tx">' +
              '<span class="sb-brand-t">RUTA FINANCIERA</span>' +
              '<span class="sb-brand-s">Herramienta de Educación y Planificación Financiera</span>' +
            '</span>' +
          '</a>' +
        '</div>' +
        '<nav class="sb-nav" aria-label="Navegación principal">' + itemsHTML(active) + '</nav>' +
        '<div class="sb-foot">' +
          '<button type="button" class="sb-reset" id="sb-reset" title="Nueva ruta">' +
            Icons.svg('refresh', 16) + '<span>Nueva ruta</span></button>' +
          '<button type="button" class="sb-collapse" id="sb-collapse" ' +
            'aria-label="Contraer navegación" title="Contraer navegación">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
            'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M15 6l-6 6 6 6"/></svg>' +
          '</button>' +
        '</div>';

      document.getElementById('sb-reset').addEventListener('click', function () {
        AppState.reset();
        if (window.ScreenSimulador && ScreenSimulador.reset) ScreenSimulador.reset();
        if (window.ScreenSoluciones && ScreenSoluciones.reset) ScreenSoluciones.reset();
        if (window.ScreenBrecha && ScreenBrecha.reset) ScreenBrecha.reset();
        close();
        Router.go('inicio');
      });
      document.getElementById('sb-collapse').addEventListener('click', toggleMin);
    }

    var tb = document.getElementById('topbar');
    if (tb) {
      tb.innerHTML =
        '<button type="button" id="tb-menu" aria-label="Abrir navegación" aria-expanded="false">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
          'stroke-width="1.5" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>' +
        '</button>' +
        Icons.isotipo(22) +
        '<span class="topbar-t">RUTA FINANCIERA</span>';
      document.getElementById('tb-menu').addEventListener('click', open);
    }

    var scrim = document.getElementById('sb-scrim');
    if (scrim) scrim.addEventListener('click', close);
  }

  function open() {
    document.body.classList.add('sb-open');
    var b = document.getElementById('tb-menu');
    if (b) b.setAttribute('aria-expanded', 'true');
    /* El scroll del contenido de detrás queda bloqueado por CSS
       (body.sb-open{overflow:hidden}); aquí sólo se lleva el foco
       al primer destino para que el teclado funcione. */
    var primero = document.querySelector('.sb-i');
    if (primero) primero.focus({ preventScroll: true });
  }

  function close() {
    if (!document.body.classList.contains('sb-open')) return;
    document.body.classList.remove('sb-open');
    var b = document.getElementById('tb-menu');
    if (b) { b.setAttribute('aria-expanded', 'false'); b.focus({ preventScroll: true }); }
  }

  /* Escape cierra el drawer cuando hay teclado disponible */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') close();
  });

  function toggleMin() {
    var min = document.body.classList.toggle('sb-min');
    try { sessionStorage.setItem('rf_sb_min', min ? '1' : '0'); } catch (e) {}
    var b = document.getElementById('sb-collapse');
    if (b) b.setAttribute('aria-label', min ? 'Expandir navegación' : 'Contraer navegación');
  }

  function restore() {
    try {
      if (sessionStorage.getItem('rf_sb_min') === '1') document.body.classList.add('sb-min');
    } catch (e) {}
  }

  function setActive(route) {
    document.querySelectorAll('.sb-i').forEach(function (a) {
      var on = a.getAttribute('data-nav') === route;
      a.classList.toggle('is-active', on);
      if (on) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    close();
  }

  return { render: render, setActive: setActive, close: close, restore: restore,
           refreshProgreso: refreshProgreso, items: ALL };
})();


/* ═══════════════ ui/context-bar.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Barra de contexto persistente
   ------------------------------------------------------------
   Solo valores, separados por punto medio. Los rótulos
   ("Etapa:", "Objetivo:") se omiten: la jerarquía se resuelve
   con peso y color, no con etiquetas. El último elemento —el
   más específico— se destaca.

   Reglas:
   - No se dibuja si no hay ninguna selección.
   - Los campos vacíos no se dibujan.
   - No aparece en Inicio.
   - Cada valor navega al módulo donde se define.
   ============================================================ */

var ContextBar = (function () {

  var HIDE_ON = ['inicio'];

  function fields(s) {
    var out = [];

    if (s.etapa && STAGE_CONFIG[s.etapa])
      out.push({ v: STAGE_CONFIG[s.etapa].nombre, href: '#/diagnostico', k: 'Etapa' });

    if (s.objetivo && OBJECTIVE_CONFIG[s.objetivo])
      out.push({ v: OBJECTIVE_CONFIG[s.objetivo].nombre, href: '#/diagnostico', k: 'Objetivo' });

    if (s.horizonte && HORIZON_CONFIG[s.horizonte])
      out.push({ v: HORIZON_CONFIG[s.horizonte].referencia, href: '#/diagnostico', k: 'Horizonte' });

    if (s.vehiculo && VEHICLE_CONFIG[s.vehiculo])
      out.push({ v: VEHICLE_CONFIG[s.vehiculo].nombre, href: '#/soluciones', k: 'Vehículo' });

    if (s.serie && SERIES_CONFIG[s.serie])
      out.push({ v: SERIES_CONFIG[s.serie].label, href: '#/soluciones', k: 'Serie' });

    if (s.fondoId && FUND_CATALOG[s.fondoId])
      out.push({ v: FUND_CATALOG[s.fondoId].nombre, href: '#/fondos/' + s.fondoId, k: 'Fondo' });

    return out;
  }

  /* En pantallas estrechas la barra debe ocupar una sola línea.
     Se conservan los elementos que mejor sitúan el recorrido —etapa,
     horizonte y serie— y se omiten los secundarios. */
  var PRIORIDAD_MOVIL = ['Etapa', 'Horizonte', 'Serie'];

  function render(activeRoute) {
    var el = document.getElementById('ctx');
    if (!el) return;

    var items = fields(AppState.get());

    if (window.innerWidth <= 767) {
      var reducidos = items.filter(function (f) {
        return PRIORIDAD_MOVIL.indexOf(f.k) !== -1;
      });
      /* Si ninguno de los prioritarios está definido, se muestra el
         primero disponible antes que dejar la barra vacía. */
      items = reducidos.length ? reducidos : items.slice(0, 1);
    }

    if (!items.length || HIDE_ON.indexOf(activeRoute) !== -1) {
      el.hidden = true;
      el.innerHTML = '';
      return;
    }

    var html = items.map(function (f, i) {
      var sep = i > 0 ? '<span class="ctx-sep" aria-hidden="true">·</span>' : '';
      /* El rótulo va en title y aria-label: disponible para quien
         lo necesite, sin ocupar espacio visual. */
      return sep + '<a class="ctx-item" href="' + f.href + '" ' +
             'title="' + Fmt.esc(f.k) + '" ' +
             'aria-label="' + Fmt.esc(f.k) + ': ' + Fmt.esc(f.v) + '">' +
             Fmt.esc(f.v) + '</a>';
    }).join('');

    el.hidden = false;
    el.innerHTML =
      '<div class="ctx-items">' + html + '</div>' +
      '<div class="ctx-actions">' +
        '<button type="button" id="ctx-ruta">Ver ruta →</button>' +
        '<button type="button" class="ctx-reset" id="ctx-reset">Nueva ruta</button>' +
      '</div>';

    document.getElementById('ctx-ruta').addEventListener('click', function () {
      Router.go('ruta');
    });

    document.getElementById('ctx-reset').addEventListener('click', function () {
      AppState.reset();
      if (window.ScreenSimulador && ScreenSimulador.reset) ScreenSimulador.reset();
      if (window.ScreenSoluciones && ScreenSoluciones.reset) ScreenSoluciones.reset();
      Router.go('inicio');
    });
  }

  return { render: render, fields: fields };
})();


/* ═══════════════ ui/volatility.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Volatilidad
   ------------------------------------------------------------
   REGLA DEL PROYECTO: no existe traducción de volatilidad a
   etiqueta categórica. Este archivo no contiene, ni debe
   contener, cadenas del tipo "bajo", "moderado", "alto" ni
   "intermedia".

   Se muestra: la cifra, su posición relativa dentro del
   universo comparable, y una escala visual.
   ============================================================ */

var Volatility = (function () {

  /* Cifra, con la convención de C15 aplicada en un solo lugar */
  function figure(serie, fondoId) {
    var r = Data.returns(serie, fondoId);
    if (!r) return '—';

    var esCero = r.volatilidad === 0;
    var texto;

    if (esCero && VOLATILITY_ZERO.modo === 'umbral') {
      texto = VOLATILITY_ZERO.umbral;
    } else {
      texto = Fmt.num(r.volatilidad, 2);
    }

    if (esCero && VOLATILITY_ZERO.modo !== 'sinNota') {
      texto += '<sup class="vol-mark" title="' + Fmt.esc(VOLATILITY_ZERO.nota) + '">' +
               Fmt.esc(VOLATILITY_ZERO.marca) + '</sup>';
    }

    return texto;
  }

  /* Cifra + barra comparativa */
  function inline(serie, fondoId) {
    var pos = Data.volatilityPosition(serie, fondoId);
    if (!pos) return '—';

    var w = Math.max(2, Math.round(pos.ratio * 100));
    var color = Data.volatilityColor(pos.ratio);

    return '<span class="vol">' +
             '<span class="vol-num">' + figure(serie, fondoId) + '</span>' +
             '<span class="vol-bar" aria-hidden="true">' +
               '<span class="vol-fill" style="width:' + w + '%;background:' + color + '"></span>' +
             '</span>' +
           '</span>';
  }

  /* Posición relativa expresada en palabras, sin categorizar */
  function positionText(serie, fondoId) {
    var pos = Data.volatilityPosition(serie, fondoId);
    if (!pos) return '';

    return 'Posición ' + pos.rank + ' de ' + pos.total +
           ' dentro de la ' + SERIES_CONFIG[serie].label +
           ', ordenados de menor a mayor volatilidad.';
  }

  /* Comparador de tres anclas: el menor del universo, este fondo,
     el mayor del universo. Da escala sin etiquetar. */
  function anchors(serie, fondoId) {
    var a = Data.volatilityAnchors(serie);
    if (!a.min || !a.max) return '';

    var thisFund = Data.fund(fondoId);
    var thisR = Data.returns(serie, fondoId);
    if (!thisFund || !thisR) return '';

    var rows = [];
    function add(id, nombre, v, destacado) {
      rows.push({ id: id, nombre: nombre, v: v, destacado: destacado });
    }

    add(a.min.id, a.min.nombre, a.min.v, a.min.id === fondoId);
    if (fondoId !== a.min.id && fondoId !== a.max.id) {
      add(fondoId, thisFund.nombre, thisR.volatilidad, true);
    }
    add(a.max.id, a.max.nombre, a.max.v, a.max.id === fondoId);

    var max = a.max.v || 1;

    return '<div class="anchors">' + rows.map(function (r) {
      var ratio = r.v / max;
      var w = Math.max(2, Math.round(ratio * 100));
      var color = Data.volatilityColor(ratio);
      return '<div class="anchor' + (r.destacado ? ' is-current' : '') + '">' +
               '<span class="anchor-name">' + Fmt.esc(r.nombre) + '</span>' +
               '<span class="anchor-num num">' + figure(serie, r.id) + '</span>' +
               '<span class="anchor-bar" aria-hidden="true">' +
                 '<span class="anchor-fill" style="width:' + w + '%;background:' + color + '"></span>' +
               '</span>' +
             '</div>';
    }).join('') + '</div>';
  }

  /* Nota al pie de C15, solo si algún fondo mostrado la requiere */
  function zeroNote(serie, fondoIds) {
    if (VOLATILITY_ZERO.modo === 'sinNota') return '';

    var aplica = fondoIds.some(function (id) {
      return Data.isZeroVolatility(serie, id);
    });
    if (!aplica) return '';

    return '<p class="footnote">' +
             '<span class="vol-mark">' + Fmt.esc(VOLATILITY_ZERO.marca) + '</span> ' +
             Fmt.esc(VOLATILITY_ZERO.nota) +
           '</p>';
  }

  return {
    figure: figure,
    inline: inline,
    positionText: positionText,
    anchors: anchors,
    zeroNote: zeroNote
  };
})();


/* ═══════════════ ui/chart.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Gráfico
   ------------------------------------------------------------
   SVG generado en el propio proyecto, sin librerías externas.

   COMPATIBILIDAD WEB
   Los atributos de presentación de un SVG (stroke, fill) no
   resuelven var(--x) de forma fiable en todos los motores ni al
   servirse desde algunos entornos. Por eso las variables CSS se
   resuelven a HEX en JavaScript ANTES de construir el marcado,
   con respaldo literal si la variable no está disponible.
   ============================================================ */

var Chart = (function () {

  /* ── Resolución de color ── */

  function cssColor(variable, fallback) {
    try {
      var value = getComputedStyle(document.documentElement)
        .getPropertyValue(variable)
        .trim();
      return value || fallback;
    } catch (e) {
      return fallback;
    }
  }

  function palette() {
    return {
      navy:         cssColor('--navy', '#112240'),
      border:       cssColor('--border', '#ECEFF4'),
      borderStrong: cssColor('--border-strong', '#D8E0EA'),
      text3:        cssColor('--text-3', '#9AA5B6'),
      vol2:         cssColor('--vol-2', '#5B9BC4'),
      vol3:         cssColor('--vol-3', '#2F5FA8')
    };
  }

  /* Traduce el color declarado por el módulo a un HEX resuelto */
  function resolver(color, COLORS) {
    if (!color) return COLORS.navy;
    var m = String(color).match(/^var\(\s*(--[\w-]+)\s*\)$/);
    if (!m) return color;
    var mapa = {
      '--navy': COLORS.navy,
      '--border': COLORS.border,
      '--border-strong': COLORS.borderStrong,
      '--text-3': COLORS.text3,
      '--vol-2': COLORS.vol2,
      '--vol-3': COLORS.vol3
    };
    return mapa[m[1]] || cssColor(m[1], COLORS.navy);
  }

  /* ── Lienzo según ancho ── */

  function lienzo() {
    var w = (typeof window !== 'undefined') ? window.innerWidth : 1200;
    if (w <= 479)  return { W: 340, H: 240, M: { top: 14, right: 54, bottom: 26, left: 4 }, fs: 11, ticks: 3 };
    if (w <= 767)  return { W: 400, H: 260, M: { top: 14, right: 58, bottom: 28, left: 6 }, fs: 11, ticks: 4 };
    if (w <= 1023) return { W: 620, H: 300, M: { top: 16, right: 68, bottom: 30, left: 8 }, fs: 11, ticks: 6 };
    return { W: 760, H: 320, M: { top: 16, right: 76, bottom: 30, left: 8 }, fs: 11, ticks: 0 };
  }

  function nice(max) {
    if (!isFinite(max) || max <= 0) return 1;
    var exp = Math.pow(10, Math.floor(Math.log10(max)));
    var f = max / exp;
    var pasos = [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < pasos.length; i++) {
      if (f <= pasos[i] + 1e-9) return pasos[i] * exp;
    }
    return 10 * exp;
  }

  function abreviar(v) {
    if (!isFinite(v)) return '';
    if (v >= 1e9) return '$' + Fmt.num(v / 1e9, 1) + 'MM';
    if (v >= 1e6) return '$' + Fmt.num(v / 1e6, v / 1e6 < 10 ? 1 : 0) + 'M';
    if (v >= 1e3) return '$' + Math.round(v / 1e3) + 'k';
    return '$' + Math.round(v);
  }

  /* Redondeo defensivo: ningún atributo puede contener NaN */
  function n(v) {
    var x = Number(v);
    return isFinite(x) ? Math.round(x * 100) / 100 : 0;
  }

  var FALLBACK =
    '<p class="chart-fallback">No fue posible visualizar el gráfico. ' +
    'Los resultados numéricos permanecen disponibles.</p>';

  /* ── Generación ── */

  function proyeccion(series, aportado) {
    try {
      if (!aportado || !aportado.length || !series || !series.length) return FALLBACK;

      var COLORS = palette();
      var L = lienzo();
      var W = L.W, H = L.H, M = L.M, FS = L.fs;

      var anios = Number(aportado[aportado.length - 1].anio) || 1;

      var maxV = 0;
      series.forEach(function (s) {
        (s.puntos || []).forEach(function (p) {
          if (isFinite(p.total) && p.total > maxV) maxV = p.total;
        });
      });
      aportado.forEach(function (p) {
        if (isFinite(p.aportado) && p.aportado > maxV) maxV = p.aportado;
      });
      var top = nice(maxV * 1.08) || 1;

      var iw = W - M.left - M.right;
      var ih = H - M.top - M.bottom;

      function x(a) { return n(M.left + (Number(a) / anios) * iw); }
      function y(v) { return n(M.top + ih - (Number(v) / top) * ih); }

      /* Grilla horizontal y eje de valores */
      var lineas = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
        var v = top * f, yy = y(v);
        return '<line x1="' + n(M.left) + '" y1="' + yy + '" x2="' + n(M.left + iw) +
                 '" y2="' + yy + '" stroke="' + COLORS.border + '" stroke-width="1"/>' +
               '<text x="' + n(M.left + iw + 8) + '" y="' + n(yy + 4) + '" font-size="' + FS +
                 '" fill="' + COLORS.text3 + '" font-family="Manrope, sans-serif">' +
                 abreviar(v) + '</text>';
      }).join('');

      /* Área de capital aportado */
      var areaPts = aportado.map(function (p) { return x(p.anio) + ',' + y(p.aportado); });
      var area = 'M' + n(M.left) + ',' + y(0) + ' L' + areaPts.join(' L') +
                 ' L' + x(anios) + ',' + y(0) + ' Z';
      var lineaAportado = 'M' + areaPts.join(' L');

      /* Trayectorias */
      var paths = series.map(function (s) {
        if (!s.puntos || !s.puntos.length) return '';
        var d = 'M' + s.puntos.map(function (p) {
          return x(p.anio) + ',' + y(p.total);
        }).join(' L');
        return '<path d="' + d + '" fill="none" stroke="' + resolver(s.color, COLORS) + '" ' +
               'stroke-width="' + (s.discreta ? 1.5 : 2.5) + '" ' +
               (s.discreta ? 'opacity="0.55" ' : '') +
               'stroke-linejoin="round" stroke-linecap="round"' +
               (s.dash ? ' stroke-dasharray="' + s.dash + '"' : '') + '/>';
      }).join('');

      /* Eje de tiempo */
      var pasos = L.ticks
        ? Math.max(1, Math.ceil(anios / (L.ticks - 1)))
        : (anios <= 10 ? 1 : anios <= 20 ? 5 : 10);

      function tick(a, anchor) {
        return '<text x="' + x(a) + '" y="' + n(H - 7) + '" font-size="' + FS + '" fill="' +
               COLORS.text3 + '" text-anchor="' + anchor + '" font-family="Manrope, sans-serif">' +
               (a === 0 ? 'Hoy' : 'Año ' + a) + '</text>';
      }
      var ejeX = '';
      for (var a = 0; a <= anios - pasos * 0.5; a += pasos) {
        ejeX += tick(a, a === 0 ? 'start' : 'middle');
      }
      ejeX += tick(anios, 'end');

      var svg =
        '<svg class="chart-svg" xmlns="http://www.w3.org/2000/svg" ' +
          'width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" ' +
          'preserveAspectRatio="xMidYMid meet" role="img" ' +
          'aria-label="Proyección de capital a ' + anios + ' años">' +
          lineas +
          '<path d="' + area + '" fill="' + COLORS.border + '" fill-opacity="0.55"/>' +
          '<path d="' + lineaAportado + '" fill="none" stroke="' + COLORS.borderStrong +
            '" stroke-width="1.5"/>' +
          paths + ejeX +
        '</svg>';

      /* Ningún atributo puede quedar con NaN o undefined */
      if (svg.indexOf('NaN') !== -1 || svg.indexOf('undefined') !== -1) {
        console.warn('[chart] marcado inválido, se muestra el mensaje alternativo');
        return FALLBACK;
      }

      return svg;

    } catch (e) {
      console.error('[chart] error al generar el gráfico', e);
      return FALLBACK;
    }
  }

  /* ── Verificación tras insertar en el DOM ──
     Si el SVG no llegó a pintarse, se sustituye por el mensaje
     alternativo en lugar de dejar un hueco silencioso. */

  function verify(root) {
    var contenedores = (root || document).querySelectorAll('.chart-wrap');
    var resultados = [];

    contenedores.forEach(function (wrap) {
      var svg = wrap.querySelector('.chart-svg');
      var r = { ok: false, motivo: '' };

      if (!svg) {
        r.motivo = wrap.querySelector('.chart-fallback') ? 'fallback' : 'sin-svg';
        if (r.motivo === 'fallback') r.ok = true;
      } else {
        var box = svg.getBoundingClientRect();
        var paths = svg.querySelectorAll('path');
        var html = svg.outerHTML;

        if (box.width <= 0 || box.height <= 0) r.motivo = 'dimension-cero';
        else if (!paths.length) r.motivo = 'sin-paths';
        else if (html.indexOf('NaN') !== -1) r.motivo = 'nan';
        else if (html.indexOf('undefined') !== -1) r.motivo = 'undefined';
        else {
          var conStroke = 0;
          paths.forEach(function (p) {
            var st = p.getAttribute('stroke');
            if (st && st !== 'none' && st.indexOf('var(') === -1) conStroke++;
          });
          if (!conStroke) r.motivo = 'sin-stroke-valido';
          else r.ok = true;
        }

        if (!r.ok) {
          console.warn('[chart] ' + r.motivo + ' — se muestra el mensaje alternativo');
          svg.outerHTML = FALLBACK;
        }
      }
      resultados.push(r);
    });

    return resultados;
  }

  return { proyeccion: proyeccion, verify: verify, abreviar: abreviar, cssColor: cssColor };
})();

/* ═══════════════ modules/diagnostico.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Diagnóstico
   ------------------------------------------------------------
   V2: una sola pantalla con tres bloques.

   El campo de edad NO reconstruye el DOM en cada pulsación: sólo
   actualiza por asignación directa los nodos que dependen de él
   (el bloque de etapa identificada y la fila de cuatro etapas).
   Así se puede escribir 35, 50 o 62 sin perder el foco ni el
   cursor, y se puede borrar el campo por completo.
   ============================================================ */

var ScreenDiagnostico = (function () {

  var OBJ_LABEL = {
    liquidez:         'Liquidez / excedentes',
    proyecto_mediano: 'Inversión de mediano plazo',
    proyecto_largo:   'Proyecto futuro',
    educacion_hijos:  'Educación de hijos',
    patrimonial:      'Construcción patrimonial',
    jubilacion:       'Jubilación',
    proteccion:       'Protección patrimonial'
  };

  var OBJ_ORDER = [
    'liquidez', 'proyecto_mediano', 'proyecto_largo', 'educacion_hijos',
    'patrimonial', 'jubilacion', 'proteccion'
  ];

  var HOR_CARDS = [
    { id:'corto',      t:'Menos de 18 meses', s:'Corto plazo',            jub:false },
    { id:'mediano',    t:'18 a 36 meses',     s:'Mediano plazo',          jub:false },
    { id:'largo',      t:'Desde 5 años',      s:'Largo plazo',            jub:false },
    { id:'largo',      t:'Jubilación',        s:'Largo plazo previsional', jub:true }
  ];

  /* ═══ Fragmentos que se actualizan sin re-render total ═══ */

  function etapaHTML(etapa) {
    if (!etapa || !STAGE_CONFIG[etapa]) {
      return '<div class="t-small t-3">Ingresa una edad entre 18 y 110 años para ' +
             'identificar la etapa.</div>';
    }
    var s = STAGE_CONFIG[etapa];
    return '<div class="card-k">Etapa identificada</div>' +
           '<div class="detail-h" style="font-size:var(--fs-h1);margin-top:var(--s2)">' +
             Fmt.esc(s.nombre) + '</div>' +
           '<div class="t-small t-2" style="margin-top:var(--s2)">' + Fmt.esc(s.rango) +
             ' · ' + Fmt.esc(s.conceptoCentral) + '</div>';
  }

  function focosHTML(etapa) {
    if (!etapa || !STAGE_CONFIG[etapa] || !STAGE_CONFIG[etapa].focos) return '';
    var f = STAGE_CONFIG[etapa].focos;

    return '<div class="dg-focos">' +
      '<div class="t-label">Focos sugeridos para esta etapa</div>' +
      '<div class="focos">' + f.map(function (x) {
        return '<div class="foco">' +
                 '<div class="foco-t">' + Fmt.esc(x.titulo) + '</div>' +
                 '<div class="foco-d">' + Fmt.esc(x.descripcion) + '</div>' +
               '</div>';
      }).join('') + '</div>' +
      '<p class="t-small t-3" style="margin-top:var(--s4);max-width:70ch">La etapa ' +
        'financiera orienta los focos de planificación, pero no determina por sí sola un ' +
        'producto, serie o fondo.</p>' +
    '</div>';
  }

  function phasesHTML(etapa) {
    return STAGE_ORDER.map(function (id) {
      var s = STAGE_CONFIG[id];
      return '<div class="phase' + (id === etapa ? ' is-active' : '') + '">' +
               '<div class="phase-k">' + Fmt.esc(s.rango) + '</div>' +
               '<div class="phase-n">' + Fmt.esc(s.nombre) + '</div>' +
             '</div>';
    }).join('');
  }

  function objetivosHTML(actual) {
    return OBJ_ORDER.map(function (id) {
      var nombre = OBJ_LABEL[id];
      var cfg = OBJECTIVE_CONFIG[id];
      var h = cfg ? HORIZON_CONFIG[cfg.horizonteSugerido] : null;
      return '<button type="button" class="card-sel' + (id === actual ? ' is-active' : '') + '" ' +
               'data-objetivo="' + id + '" aria-pressed="' + (id === actual) + '">' +
               '<div class="card-t">' + Fmt.esc(nombre) + '</div>' +
               (h ? '<div class="card-s">' + Fmt.esc(h.nombre) + '</div>' : '') +
             '</button>';
    }).join('');
  }

  /* Contexto del objetivo elegido. Es información, no una selección:
     nada de esto se escribe en APP_STATE hasta que el usuario elija
     explícitamente un horizonte. */
  function sugerenciaHTML(objetivo) {
    if (!objetivo) return '';

    if (objetivo === 'jubilacion') {
      return '<div class="dg-sug">' +
        '<div class="sugerido">' +
          '<span class="sugerido-k">Horizonte relacionado</span>' +
          '<b>Largo plazo previsional</b>' +
        '</div>' +
        '<div class="sugerido">' +
          '<span class="sugerido-k">Estructuras a explorar posteriormente</span>' +
          '<b>APV · APV AP</b>' +
        '</div>' +
        '<p class="t-small t-3" style="margin-top:var(--s3)">El objetivo identifica un ' +
          'contexto. Las estructuras se definen más adelante en la Ruta.</p>' +
      '</div>';
    }

    var cfg = OBJECTIVE_CONFIG[objetivo];
    if (!cfg) return '';
    var h = HORIZON_CONFIG[cfg.horizonteSugerido];

    return '<div class="dg-sug">' +
      '<div class="sugerido">' +
        '<span class="sugerido-k">Sugerido por el objetivo</span>' +
        '<b>' + Fmt.esc(h.nombre) + '</b>' +
        '<span class="t-3">· ' + Fmt.esc(h.referencia) + '</span>' +
      '</div>' +
      '<p class="t-small t-3" style="margin-top:var(--s3)">Selecciona un horizonte en el ' +
        'paso 3 para incorporarlo a tu Ruta.</p>' +
    '</div>';
  }

  function horizontesHTML(actual, objetivo) {
    return HOR_CARDS.map(function (o, i) {
      var esJub = o.jub;
      var objJub = objetivo === 'jubilacion';
      var activo = (o.id === actual) && (esJub ? objJub : !(objJub && o.id === 'largo'));
      var series = esJub
        ? 'Serie APV · Serie APV AP'
        : HORIZON_CONFIG[o.id].series.map(function (s) { return SERIES_CONFIG[s].label; }).join(' · ');

      return '<button type="button" class="card-sel' + (activo ? ' is-active' : '') + '" ' +
               'data-hor="' + i + '" aria-pressed="' + activo + '">' +
               '<div class="card-k">' + Fmt.esc(o.s) + '</div>' +
               '<div class="card-t" style="margin-top:var(--s2)">' + Fmt.esc(o.t) + '</div>' +
               '<div class="card-d">' + Fmt.esc(series) + '</div>' +
             '</button>';
    }).join('');
  }

  /* ═══ Actualización quirúrgica ═══ */

  function refrescarEtapa(outlet) {
    var etapa = AppState.get('etapa');
    var box = outlet.querySelector('#dg-etapa');
    var row = outlet.querySelector('#dg-phases');
    var foc = outlet.querySelector('#dg-focos');
    if (box) box.innerHTML = etapaHTML(etapa);
    if (row) row.innerHTML = phasesHTML(etapa);
    if (foc) foc.innerHTML = focosHTML(etapa);
    refrescarCheckpoint(outlet);
  }

  function refrescarObjetivos(outlet) {
    var el = outlet.querySelector('#dg-obj');
    if (el) el.innerHTML = objetivosHTML(AppState.get('objetivo'));
    var sug = outlet.querySelector('#dg-sug');
    if (sug) sug.innerHTML = sugerenciaHTML(AppState.get('objetivo'));
    bindObjetivos(outlet);
    refrescarCheckpoint(outlet);
  }

  /* ── Checkpoint ── */

  function checkpointHTML() {
    var s = AppState.get();
    var completo = !!(s.etapa && s.objetivo && s.horizonte);

    var items = [
      { k: 'Etapa',     v: s.etapa ? STAGE_CONFIG[s.etapa].nombre : null },
      { k: 'Objetivo',  v: s.objetivo ? OBJ_LABEL[s.objetivo] : null },
      { k: 'Horizonte', v: s.horizonte ? HORIZON_CONFIG[s.horizonte].nombre : null }
    ];

    return RouteCheckpoint.html({
      items: items,
      mensaje: completo
        ? 'Tu diagnóstico está definido.'
        : 'Aún hay elementos sin definir. Puedes completarlos ahora o continuar con una ' +
          'Ruta parcial.',
      acciones: completo
        ? [{ label: 'Ver soluciones relacionadas →', href: '#/soluciones', primary: true }]
        : [{ label: 'Completar diagnóstico', id: 'cp-completar' },
           { label: 'Continuar sin definir →', href: '#/soluciones' }]
    });
  }

  function refrescarCheckpoint(outlet) {
    var el = outlet.querySelector('#dg-cp');
    if (!el) return;
    el.innerHTML = checkpointHTML();
    var btn = el.querySelector('#cp-completar');
    if (btn) {
      btn.addEventListener('click', function () {
        var s = AppState.get();
        var destino = !s.etapa ? '#in-edad' : (!s.objetivo ? '#dg-obj' : '#dg-hor');
        var nodo = outlet.querySelector(destino);
        if (nodo) {
          nodo.scrollIntoView({ block: 'center',
            behavior: reducido() ? 'auto' : 'smooth' });
          if (destino === '#in-edad') nodo.focus({ preventScroll: true });
        }
      });
    }
  }

  function reducido() {
    return window.matchMedia &&
           window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function refrescarHorizontes(outlet) {
    var el = outlet.querySelector('#dg-hor');
    if (el) el.innerHTML = horizontesHTML(AppState.get('horizonte'), AppState.get('objetivo'));
    bindHorizontes(outlet);
    refrescarCheckpoint(outlet);
  }

  /* ═══ Render ═══ */

  function render(outlet) {
    var edad = AppState.get('edad');

    outlet.innerHTML =
      '<div class="page">' +
        '<span class="t-eyebrow">Diagnóstico</span>' +
        '<h1 class="t-h1 head--wide">Dónde estoy, qué quiero lograr<br>y cuándo lo necesitaré</h1>' +

        /* ── 01 · ETAPA ── */
        '<section class="dg-block">' +
          '<div class="dg-num">01 · Etapa financiera</div>' +
          '<div class="dg-etapa-row">' +
            '<div class="field" style="max-width:150px">' +
              '<label for="in-edad">Edad</label>' +
              '<input type="text" id="in-edad" inputmode="numeric" autocomplete="off" ' +
                'maxlength="3" placeholder="—" value="' + (edad || '') + '">' +
              '<span class="field-hint">Entre ' + AGE_MIN + ' y ' + AGE_MAX + ' años</span>' +
            '</div>' +
            '<div id="dg-etapa" class="dg-etapa"></div>' +
          '</div>' +
          '<div class="phases" id="dg-phases"></div>' +
          '<div id="dg-focos"></div>' +
        '</section>' +

        /* ── 02 · OBJETIVO ── */
        '<section class="dg-block">' +
          '<div class="dg-num">02 · Objetivo</div>' +
          '<div class="cards cards--4" id="dg-obj"></div>' +
          '<div id="dg-sug"></div>' +
        '</section>' +

        /* ── 03 · HORIZONTE ── */
        '<section class="dg-block">' +
          '<div class="dg-num">03 · Horizonte</div>' +
          '<p class="t-small t-2" style="margin-top:var(--s2);max-width:60ch">' +
            'El horizonte es la variable central: determina qué soluciones corresponde ' +
            'conocer.</p>' +
          '<div class="cards cards--4" id="dg-hor"></div>' +
        '</section>' +

        '<div id="dg-cp"></div>' +
      '</div>';

    refrescarEtapa(outlet);
    refrescarObjetivos(outlet);
    refrescarHorizontes(outlet);
    refrescarCheckpoint(outlet);
    bindEdad(outlet);
  }

  /* ═══ Enlaces de eventos ═══ */

  function bindEdad(outlet) {
    var input = outlet.querySelector('#in-edad');
    if (!input) return;

    input.addEventListener('input', function () {
      /* Se limpia a dígitos conservando la posición del cursor */
      var limpio = input.value.replace(/\D/g, '').slice(0, 3);
      if (limpio !== input.value) {
        var pos = input.selectionStart - (input.value.length - limpio.length);
        input.value = limpio;
        try { input.setSelectionRange(pos, pos); } catch (e) {}
      }

      /* Campo vacío: se borra la etapa, sin bloquear la escritura */
      if (limpio === '') {
        if (AppState.has('edad') || AppState.has('etapa')) {
          AppState.set({ edad: null, etapa: null });
        }
        refrescarEtapa(outlet);
        return;
      }

      /* Sólo se valida cuando hay un número dentro del rango.
         Un valor intermedio como "3" mientras se escribe "35" no
         borra nada: simplemente aún no identifica etapa. */
      var v = parseInt(limpio, 10);
      var etapa = resolveStage(v);

      AppState.set({ edad: etapa ? v : null, etapa: etapa });
      refrescarEtapa(outlet);
    });
  }

  function bindObjetivos(outlet) {
    outlet.querySelectorAll('[data-objetivo]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        /* Sólo se registra el objetivo. El horizonte sugerido se
           muestra como contexto, pero no se escribe en APP_STATE
           hasta que el usuario lo seleccione en el paso 3. Lo mismo
           vale para vehículo y serie, que se definen en Soluciones. */
        AppState.set({ objetivo: btn.getAttribute('data-objetivo') });
        refrescarObjetivos(outlet);
        refrescarHorizontes(outlet);
      });
    });
  }

  function bindHorizontes(outlet) {
    outlet.querySelectorAll('[data-hor]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var o = HOR_CARDS[parseInt(btn.getAttribute('data-hor'), 10)];

        /* El horizonte sí es una elección explícita del usuario.
           Vehículo y serie NO se derivan aquí: se definen cuando el
           usuario selecciona una solución. */
        var patch = { horizonte: o.id };
        if (o.jub) patch.objetivo = 'jubilacion';
        AppState.set(patch);
        refrescarObjetivos(outlet);
        refrescarHorizontes(outlet);
      });
    });
  }

  return { render: render };
})();


/* ═══════════════ modules/soluciones.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Mapa de Soluciones
   ------------------------------------------------------------
   V2: grilla 2×2 y un único detalle abierto bajo ella.
   ============================================================ */

var ScreenSoluciones = (function () {

  var VIAS = {
    corto: {
      id:'corto', k:'Corto plazo', serie:'A', titulo:'Serie A', sub:'Menos de 18 meses',
      resumen:'Liquidez · Preservación', horizonte:'corto',
      cats:['renta_fija_nacional','renta_fija_internacional'],
      fondos:['cd_conservador']
    },
    mediano: {
      id:'mediano', k:'Mediano plazo', serie:'P', titulo:'Serie P', sub:'18 a 36 meses',
      resumen:'Permanencia · Diversificación', horizonte:'mediano',
      cats:[], fondos:['cd_moderado','cd_balanceado']
    },
    largo: {
      id:'largo', k:'Proyectos', serie:'F', titulo:'CUI · Serie F', sub:'Desde 5 años',
      resumen:'Ahorro · Protección', horizonte:'largo',
      cats:['renta_variable_nacional','renta_variable_latam','renta_variable_internacional'],
      fondos:['cd_crecimiento','cd_agresivo','ca_moderada_dolar','ca_agresiva_dolar'],
      objetivos:'Educación de hijos · Proyectos futuros · Construcción patrimonial'
    },
    jubilacion: {
      id:'jubilacion', k:'Jubilación', serie:'APV', titulo:'APV · APV AP', sub:'Largo plazo',
      resumen:'Pensión · Beneficios tributarios', horizonte:'largo',
      cats:[], fondos:[]
    }
  };

  var ORDEN = ['corto','mediano','largo','jubilacion'];
  var abierto = null;

  /* Sin contexto no hay tarjeta seleccionada: Serie A dejaba de ser
     una vista inicial para parecer una elección del usuario. */
  function viaPorContexto() {
    var h = AppState.get('horizonte');
    var o = AppState.get('objetivo');
    if (o === 'jubilacion') return 'jubilacion';
    if (h === 'corto') return 'corto';
    if (h === 'mediano') return 'mediano';
    if (h === 'largo') return 'largo';
    return null;
  }

  /* ¿La vía abierta proviene del horizonte de la Ruta o de un clic? */
  var abiertoPorUsuario = false;

  function cards(sel) {
    return ORDEN.map(function (id) {
      var v = VIAS[id];
      return '<button type="button" class="card-sel' + (id === sel ? ' is-active' : '') + '" ' +
               'data-via="' + id + '" aria-pressed="' + (id === sel) + '">' +
               '<div class="card-k">' + Fmt.esc(v.k) + '</div>' +
               '<div class="card-t card-t--big">' + Fmt.esc(v.titulo) + '</div>' +
               '<div class="card-s">' + Fmt.esc(v.sub) + '</div>' +
               '<div class="card-d">' + Fmt.esc(v.resumen) + '</div>' +
             '</button>';
    }).join('');
  }

  function alternativas(v) {
    var items = [];
    v.cats.forEach(function (c) {
      items.push({ nombre: FUND_CATEGORIES[c].nombre, href: null });
    });
    v.fondos.forEach(function (fid) {
      var f = FUND_CATALOG[fid];
      if (!f) return;
      var ok = f.series.indexOf(v.serie) !== -1;
      items.push({ nombre: f.nombre, href: ok ? '#/fondos/' + fid : null });
    });
    if (!items.length) return '';

    return '<div class="detail-sec">' +
             '<div class="t-label">Alternativas asociadas</div>' +
             '<div class="band-list">' + items.map(function (i) {
               return i.href
                 ? '<a href="' + i.href + '">' + Fmt.esc(i.nombre) + '</a>'
                 : '<span>' + Fmt.esc(i.nombre) + '</span>';
             }).join('') + '</div>' +
           '</div>';
  }

  function timelineP() {
    var tramos = SERIES_CONFIG.P.costoSalida;
    var colores = ['var(--vol-5)','var(--vol-3)','var(--vol-2)','var(--pos)'];
    return '<div class="detail-sec">' +
             '<div class="t-label">Costo de salida según permanencia</div>' +
             '<div class="timeline-track" style="margin-top:var(--s3)">' +
               tramos.map(function (t, i) {
                 var rango = t.hasta === null ? t.desde + '+ días' : t.desde + '–' + t.hasta + ' días';
                 return '<div class="timeline-seg" style="border-top-color:' + colores[i] + '">' +
                          '<div class="timeline-p num" style="color:' + colores[i] + '">' +
                            Fmt.esc(t.label) + '</div>' +
                          '<div class="timeline-d">' + Fmt.esc(rango) +
                            (t.nota ? '<br>' + Fmt.esc(t.nota) : '') + '</div>' +
                        '</div>';
               }).join('') +
             '</div>' +
             '<p class="t-small t-2" style="margin-top:var(--s3)">Horizonte mínimo ' +
               'recomendado: 18 meses. A partir del día 541 no aplica costo de salida.</p>' +
           '</div>';
  }

  function excepcionGold() {
    var p = PRODUCT_CONFIG.inversion_gold;
    return '<div class="detail-sec">' +
             '<div class="t-label">Excepción de producto</div>' +
             '<div class="exception-flow">' +
               '<span>' + Fmt.esc(p.nombre) + '</span>' +
               '<span class="sep">→</span>' +
               '<em>Vehículo</em> <span>CUI</span>' +
               '<span class="sep">→</span>' +
               '<em>Serie</em> <span>Serie A</span>' +
             '</div>' +
             '<p class="t-small t-2" style="margin-top:var(--s3)">' +
               Fmt.esc(p.notaExcepcion) + '</p>' +
           '</div>';
  }

  function bloqueApv() {
    return '<div class="detail-sec">' +
             '<div class="t-label">APV AP · Estructura preferente</div>' +
             '<div class="stat-row">' +
               '<div><div class="stat-k">Ingreso comercial de referencia</div>' +
                 '<div class="stat-v">Desde 600 UF</div></div>' +
             '</div>' +
             '<div class="band-list" style="margin-top:var(--s5)">' +
               '<a href="#/tributario">Régimen A · bonificación fiscal 15%</a>' +
               '<a href="#/tributario">Régimen B · rebaja de base imponible</a>' +
               '<a href="#/tributario">Depósito Convenido · hasta 900 UF</a>' +
               '<a href="#/brecha">Brecha previsional</a>' +
             '</div>' +
           '</div>';
  }

  function detalle(id) {
    var v = VIAS[id];
    var sc = SERIES_CONFIG[v.serie];

    var extras = '';
    if (id === 'mediano') extras = timelineP();
    if (id === 'largo') extras = excepcionGold();
    if (id === 'jubilacion') extras = bloqueApv();

    var costo = '';
    if (id === 'corto') {
      costo = '<p class="t-small t-2" style="margin-top:var(--s3)">' +
              Fmt.esc(sc.costoSalidaNota) + '</p>';
    }

    var objetivos = v.objetivos
      ? '<p class="t-small t-2" style="margin-top:var(--s3)"><b>Objetivos relacionados:</b> ' +
        Fmt.esc(v.objetivos) + '</p>'
      : '';

    var conceptos = sc.conceptos.map(function (c) {
      return '<li>' + Fmt.esc(c) + '</li>';
    }).join('');

    return '<div class="detail" id="sol-detail">' +
      '<div class="detail-grid">' +

        '<div>' +
          '<div class="card-k">' + Fmt.esc(v.k) + '</div>' +
          '<div class="detail-h">' + Fmt.esc(v.titulo) + '</div>' +
          '<div class="detail-sub">' + Fmt.esc(v.sub) + ' · ' +
            Fmt.esc(VEHICLE_CONFIG[sc.vehiculo].nombre) + '</div>' +
          '<ul class="ul-clean" style="margin-top:var(--s5)">' + conceptos + '</ul>' +
          costo + objetivos +
          '<div class="band-actions">' +
            '<a class="link-arrow" href="#/fondos" data-ir="' + v.serie + '">Ver fondos</a>' +
            '<a class="link-arrow" href="#/simulador" data-ir="' + v.serie + '">Simular</a>' +
          '</div>' +
        '</div>' +

        '<div>' + alternativas(v) + extras + '</div>' +

      '</div>' +
    '</div>';
  }

  function checkpointHTML() {
    var s = AppState.get();
    var definida = !!(s.vehiculo && s.serie);

    return RouteCheckpoint.html({
      items: [
        { k: 'Solución explorada', v: s.vehiculo ? VEHICLE_CONFIG[s.vehiculo].nombre : null },
        { k: 'Serie',              v: s.serie ? SERIES_CONFIG[s.serie].label : null }
      ],
      mensaje: definida
        ? 'Tu solución está definida.'
        : 'No has definido una solución. Puedes seleccionar una ahora o continuar ' +
          'directamente a Fondos.',
      acciones: definida
        ? [{ label: 'Continuar a Fondos →', href: '#/fondos', primary: true }]
        : [{ label: 'Definir solución', id: 'cp-definir' },
           { label: 'Continuar sin definir →', href: '#/fondos' }]
    });
  }

  function refrescarCheckpoint(outlet) {
    var el = outlet.querySelector('#sol-cp');
    if (!el) return;
    el.innerHTML = checkpointHTML();
    var btn = el.querySelector('#cp-definir');
    if (btn) {
      btn.addEventListener('click', function () {
        var nodo = outlet.querySelector('#sol-cards');
        if (nodo) nodo.scrollIntoView({ block: 'center',
          behavior: (window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth' });
      });
    }
  }

  function reset() { abierto = null; abiertoPorUsuario = false; }

  function render(outlet) {
    /* Si la Ruta se reinició, la vía abierta por el usuario ya no
       corresponde a ninguna selección vigente: se recalcula. */
    if (abiertoPorUsuario && !AppState.get('serie')) reset();

    if (!abierto) {
      abierto = viaPorContexto();
      abiertoPorUsuario = false;
    }

    /* Cuando la vía se abre por el horizonte de la Ruta se rotula
       como relación, no como selección. */
    var porContexto = abierto && !abiertoPorUsuario && AppState.get('horizonte');
    var relacion = porContexto
      ? '<p class="vista-nota"><b>Relacionada con el horizonte definido en tu Ruta.</b> ' +
        'Puedes explorar cualquier otra vía.</p>'
      : '';

    var cuerpo = abierto
      ? relacion + detalle(abierto)
      : '<p class="empty-sel">Selecciona una solución para explorar su estructura.</p>';

    outlet.innerHTML =
      '<div class="page">' +
        '<span class="t-eyebrow">Mapa de soluciones</span>' +
        '<h1 class="t-h1 head--wide">Soluciones según horizonte</h1>' +
        '<p class="t-read head-lead">Cuatro vías ordenadas por plazo. Selecciona una para ver ' +
          'su estructura, condiciones y alternativas asociadas.</p>' +

        '<div class="cards cards--4" id="sol-cards">' + cards(abierto) + '</div>' +

        cuerpo +

        '<div class="combo">' +
          '<span class="t-eyebrow">Una persona, distintos objetivos</span>' +
          '<div class="combo-h">Las soluciones también<br>pueden complementarse</div>' +
          '<p class="t-read combo-t">Liquidez, proyectos y jubilación pueden coexistir dentro ' +
            'de una misma planificación. Organiza estas necesidades según su horizonte y ' +
            'función.</p>' +
          '<div class="combo-cta">' +
            '<a class="btn btn--primary" href="#/estrategia">Construir estrategia →</a>' +
          '</div>' +
        '</div>' +

        '<p class="note">Esta asociación entre horizonte y solución es una estructura ' +
          'educativa. No constituye una recomendación automática ni una garantía de ' +
          'idoneidad. Los costos de administración dependen de la serie y del fondo.</p>' +

        '<div id="sol-cp"></div>' +
      '</div>';

    bind(outlet);
    refrescarCheckpoint(outlet);
  }

  function bind(outlet) {
    outlet.querySelectorAll('[data-via]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        abierto = btn.getAttribute('data-via');
        abiertoPorUsuario = true;

        /* Selección explícita: aquí sí se incorporan vehículo y serie
           a la Ruta. */
        var v = VIAS[abierto];
        AppState.set({ serie: v.serie, vehiculo: SERIES_CONFIG[v.serie].vehiculo });

        render(outlet);
      });
    });

    outlet.querySelectorAll('[data-ir]').forEach(function (a) {
      a.addEventListener('click', function () {
        var s = a.getAttribute('data-ir');
        AppState.set({ serie: s, vehiculo: SERIES_CONFIG[s].vehiculo });
      });
    });
  }

  return { render: render, reset: reset };
})();


/* ═══════════════ modules/estrategia.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Estrategia Financiera
   ------------------------------------------------------------
   Organiza necesidades financieras según la función que cumple
   cada solución. Selección múltiple: las cuatro capas son
   independientes.

   No es una asignación de cartera. No hay porcentajes, montos,
   ni jerarquía entre capas. No es una recomendación.
