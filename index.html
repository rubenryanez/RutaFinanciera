    outlet.innerHTML =
      '<div class="page">' +
        '<span class="t-eyebrow">Beneficios tributarios</span>' +
        '<h1 class="t-h1 head--wide">Beneficios y tratamientos tributarios</h1>' +
        '<p class="t-read head-lead">Seis instrumentos comparables. Selecciona uno para ver ' +
          'su desarrollo, base legal y fuente.</p>' +

        '<div class="cards cards--3" id="tax-cards">' + cards(abierto, vehiculo) + '</div>' +

        detalle(abierto) +

        '<div class="section section--rule">' +
          '<h2 class="t-h2">Art. 57 y Art. 107 son regímenes distintos</h2>' +
          '<p class="t-read head-lead">' + Fmt.esc(TAX_META.distincion) + '</p>' +
        '</div>' +

        '<div class="sources">' +
          '<div class="t-label">Fuentes normativas</div>' +
          '<ul>' + TAX_META.fuentes.map(function (f) {
            return '<li>' + Fmt.esc(f) + '</li>';
          }).join('') + '</ul>' +
        '</div>' +

        '<p class="note">' + Fmt.esc(TAX_META.encuadre) + '</p>' +

        checkpointHTML() +
      '</div>';

    bind(outlet, vehiculo);
  }

  /* Sólo se reemplazan las tarjetas y el detalle: la página no se
     reconstruye entera y la posición de scroll se conserva. */
  function bind(outlet, vehiculo) {
    outlet.querySelectorAll('[data-tax]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        abierto = btn.getAttribute('data-tax');
        revisados[abierto] = true;

        var cp = outlet.querySelector('.cp');
        if (cp) cp.outerHTML = checkpointHTML();

        var grid = outlet.querySelector('#tax-cards');
        grid.innerHTML = cards(abierto, vehiculo);

        Fmt.swap(outlet.querySelector('#tax-detail'), detalle(abierto));

        bind(outlet, vehiculo);
      });
    });
  }

  return { render: render };
})();


/* ═══════════════ modules/resumen.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Tu Ruta Financiera
   ------------------------------------------------------------
   Pantalla de cierre. Sintetiza el recorrido realizado.
   No es una recomendación: describe lo explorado.
   ============================================================ */

var ScreenResumen = (function () {

  /* Celdas de una sección, con "Sin definir" cuando no hay dato.
     Nunca se rellena automáticamente un valor no elegido. */
  function celdas(lista) {
    return '<div class="rt-start">' + lista.map(function (c) {
      return '<div class="rt-cell">' +
               '<div class="ref-k">' + Fmt.esc(c.k) + '</div>' +
               '<div class="rt-cell-v' + (c.v ? '' : ' empty') + '">' +
                 (c.v ? Fmt.esc(c.v) : '<a href="' + c.href + '">Sin definir</a>') +
               '</div>' +
             '</div>';
    }).join('') + '</div>';
  }

  /* ── 01 · Punto de partida · DEFINIDO POR EL USUARIO ── */
  function puntoPartida(s) {
    return '<section class="rt-sec">' +
      '<div class="rt-k">01 · Punto de partida</div>' +
      '<div class="rt-origen">Definido por ti</div>' +
      celdas([
        { k:'Etapa financiera', v: s.etapa ? STAGE_CONFIG[s.etapa].nombre : null, href:'#/diagnostico' },
        { k:'Objetivo',         v: s.objetivo ? OBJECTIVE_CONFIG[s.objetivo].nombre : null, href:'#/diagnostico' },
        { k:'Horizonte',        v: s.horizonte
            ? HORIZON_CONFIG[s.horizonte].nombre + ' · ' + HORIZON_CONFIG[s.horizonte].referencia
            : null, href:'#/diagnostico' }
      ]) +
    '</section>';
  }

  /* ── Estrategia construida ── */
  function estrategia() {
    var activas = AppState.capasActivas();
    if (!activas.length) return '';

    /* Lectura rápida: las cuatro necesidades, marcadas o no */
    var quick = STRATEGY_ORDER.map(function (id) {
      var on = activas.indexOf(id) !== -1;
      return '<span class="est-q' + (on ? ' is-on' : '') + '">' +
               '<span class="est-q-m">' + (on ? '✓' : '') + '</span>' +
               Fmt.esc(STRATEGY_LAYERS[id].k) +
             '</span>';
    }).join('');

    var detalle = activas.map(function (id, i) {
      var L = STRATEGY_LAYERS[id];
      var capa = AppState.capa(id);
      var sc = SERIES_CONFIG[capa.serie] || SERIES_CONFIG[L.serie];
      var veh = VEHICLE_CONFIG[capa.vehiculo] || VEHICLE_CONFIG[L.vehiculo];

      var filas = [
        { k: 'Función',   v: L.funcion },
        { k: 'Horizonte', v: L.horizonte }
      ];

      if (capa.fondoId && FUND_CATALOG[capa.fondoId]) {
        filas.push({ k: 'Fondo explorado', v: FUND_CATALOG[capa.fondoId].nombre });
      }
      if (capa.simulacion && capa.simulacion.final > 0) {
        if (capa.simulacion.aporte > 0) {
          filas.push({ k: 'Aporte mensual simulado', v: Fmt.clp(capa.simulacion.aporte) });
        }
        filas.push({ k: 'Capital proyectado', v: Fmt.clp(capa.simulacion.final) });
      }

      /* Consideración tributaria de la capa */
      var tax = TAX_ORDER.filter(function (t) {
        return TAX_CONFIG[t].vehiculos.indexOf(capa.vehiculo) !== -1;
      }).map(function (t) { return TAX_CONFIG[t].nombre; });

      if (tax.length) {
        filas.push({ k: 'Consideraciones tributarias', v: tax.join(' · ') });
      }

      var titulo = (id === 'jubilacion')
        ? veh.nombre + ' · Serie APV / APV AP'
        : veh.nombre + ' · ' + sc.label;

      return '<div class="rt-capa">' +
        '<div class="rt-capa-k">' + (i + 1 < 10 ? '0' : '') + (i + 1) + ' · ' +
          Fmt.esc(L.resumenK.toUpperCase()) + '</div>' +
        '<div class="rt-capa-t">' + Fmt.esc(titulo) + '</div>' +
        '<div class="rt-capa-grid">' + filas.map(function (f) {
          return '<div><div class="ref-k">' + Fmt.esc(f.k) + '</div>' +
                 '<div class="rt-capa-v">' + Fmt.esc(f.v) + '</div></div>';
        }).join('') + '</div>' +
      '</div>';
    }).join('');

    return '<section class="rt-sec rt-estrategia">' +
      '<div class="rt-k">Estrategia construida</div>' +
      '<div class="rt-origen">Explorado durante la Ruta</div>' +
      '<p class="t-small t-2" style="margin-top:var(--s2)">Necesidades financieras ' +
        'consideradas durante la Ruta.</p>' +
      '<div class="est-quick">' + quick + '</div>' +
      '<div class="rt-capas">' + detalle + '</div>' +
      '<p style="margin-top:var(--s4)"><a class="link-arrow" href="#/estrategia">' +
        'Revisar estrategia</a> <a class="link-arrow" href="#/tributario" ' +
        'style="margin-left:var(--s5)">Ver detalle tributario</a></p>' +
    '</section>';
  }

  /* ── 02 · Solución relacionada ── */
  function solucion(s) {
    if (!s.serie) {
      return '<section class="rt-sec">' +
        '<div class="rt-k">02 · Solución relacionada</div>' +
        '<p class="t-read t-2" style="margin-top:var(--s4)">No se seleccionó una solución. ' +
          '<a href="#/soluciones">Ver soluciones</a></p>' +
      '</section>';
    }

    var sc = SERIES_CONFIG[s.serie];
    var veh = VEHICLE_CONFIG[sc.vehiculo];
    var h = s.horizonte ? HORIZON_CONFIG[s.horizonte] : null;

    var contexto = h
      ? 'El horizonte seleccionado se relaciona con soluciones orientadas a ' +
        (h.id === 'corto' ? 'liquidez y administración de excedentes'
         : h.id === 'mediano' ? 'posicionamiento de mediano plazo con permanencia'
         : 'proyectos de largo plazo') +
        '. En esta Ruta se exploró ' + veh.nombre + ' bajo ' + sc.label + '.'
      : 'En esta Ruta se exploró ' + veh.nombre + ' bajo ' + sc.label + '.';

    return '<section class="rt-sec">' +
      '<div class="rt-k">02 · Solución relacionada</div>' +
      '<div class="rt-origen">Explorado durante la Ruta</div>' +
      '<div class="rt-sol">' +
        '<div>' +
          '<div class="rt-h">' + Fmt.esc(veh.nombre) + '</div>' +
          '<div class="rt-sub">' + Fmt.esc(sc.label) + '</div>' +
        '</div>' +
        '<div>' +
          '<div class="ref-k">Conceptos</div>' +
          '<div class="rt-concepts">' + Fmt.esc(sc.conceptos.slice(0, 4).join(' · ')) + '</div>' +
        '</div>' +
      '</div>' +
      '<p class="t-body t-2 rt-ctx">' + Fmt.esc(contexto) + '</p>' +
    '</section>';
  }

  /* ── 03 · Alternativa explorada ── */
  function alternativa(s) {
    if (!s.fondoId || !FUND_CATALOG[s.fondoId]) {
      return '<section class="rt-sec">' +
        '<div class="rt-k">03 · Alternativa explorada</div>' +
        '<p class="t-read t-2" style="margin-top:var(--s4)">No se exploró un fondo ' +
          'específico. <a href="#/fondos">Ver fondos</a></p>' +
      '</section>';
    }

    var f = FUND_CATALOG[s.fondoId];
    var serie = (s.serie && f.series.indexOf(s.serie) !== -1) ? s.serie : f.series[0];
    var r = Data.returns(serie, s.fondoId);

    return '<section class="rt-sec">' +
      '<div class="rt-k">03 · Alternativa explorada</div>' +
      '<div class="rt-origen">Explorado durante la Ruta</div>' +
      '<div class="rt-h" style="margin-top:var(--s4)">' + Fmt.esc(f.nombre) + '</div>' +
      '<div class="rt-sub">Fondo explorado durante la Ruta</div>' +
      '<div class="rt-fund">' +
        '<div><div class="ref-k">Serie</div><div class="rt-fv">' + Fmt.esc(SERIES_CONFIG[serie].label) + '</div></div>' +
        '<div><div class="ref-k">Categoría</div><div class="rt-fv">' + Fmt.esc(FUND_CATEGORIES[f.categoria].nombre) + '</div></div>' +
        '<div><div class="ref-k">Moneda</div><div class="rt-fv">' + Fmt.esc(f.moneda) + '</div></div>' +
        '<div><div class="ref-k">Último año</div><div class="rt-fv num">' + Fmt.pct(r.ultimoAno) + '</div></div>' +
        '<div><div class="ref-k">Volatilidad</div><div class="rt-fv num">' + Volatility.figure(serie, s.fondoId) + '</div></div>' +
      '</div>' +
      '<p class="t-small t-3" style="margin-top:var(--s3)">Datos al ' + Fmt.esc(DATA_META.date) + '</p>' +
    '</section>';
  }

  /* ── 04 · Simulación ── */
  function simulacion(sim) {
    if (!sim || !sim.generadaEn || !(sim.final > 0)) {
      return '<section class="rt-sec">' +
        '<div class="rt-k">04 · Simulación</div>' +
        '<div class="rt-empty">' +
          '<div class="t-h3">Simulación no realizada</div>' +
          '<a class="link-arrow" href="#/simulador">Realizar simulación</a>' +
        '</div>' +
      '</section>';
    }

    var p = Calc.proyectar(sim.capital, sim.aporte, sim.anios, sim.supuesto);

    var hist = sim.usandoHistorico
      ? '<p class="t-small t-3" style="margin-top:var(--s3)">Referencia histórica utilizada ' +
        'como supuesto. Un período de doce meses no representa el comportamiento de largo ' +
        'plazo.</p>'
      : '';

    return '<section class="rt-sec rt-sec--main">' +
      '<div class="rt-k">04 · Simulación</div>' +
      '<div class="rt-origen">Calculado a partir de tus supuestos</div>' +
      '<div class="res-big num">' + Fmt.clp(sim.final) + '</div>' +
      '<div class="res-cap">Capital proyectado</div>' +

      '<div class="res-metrics">' +
        '<div><div class="ref-k">Capital aportado</div>' +
          '<div class="res-m num">' + Fmt.clp(sim.aportado) + '</div></div>' +
        '<div><div class="ref-k">Crecimiento estimado</div>' +
          '<div class="res-m num">' + Fmt.clp(sim.crecimiento) + '</div></div>' +
        '<div><div class="ref-k">Horizonte</div>' +
          '<div class="res-m num">' + sim.anios + (sim.anios === 1 ? ' año' : ' años') + '</div></div>' +
        '<div><div class="ref-k">Supuesto utilizado</div>' +
          '<div class="res-m num">' + Fmt.num(sim.supuesto, 1) + '% anual</div></div>' +
      '</div>' +

      '<div class="chart-wrap rt-chart">' +
        Chart.proyeccion([{ nombre:'Capital proyectado', puntos:p.serie, color:'var(--navy)' }], p.serie) +
      '</div>' +
      hist +
      '<p class="t-small t-3" style="margin-top:var(--s3)">' +
        Fmt.esc(SIMULATION_CONFIG.avisos.general) + '</p>' +
    '</section>';
  }

  /* ── 05 · Brecha previsional ── */
  function brecha(s) {
    var br = s.brecha;
    if (!br || !br.calculadaEn) return '';
    if (s.objetivo !== 'jubilacion' && s.vehiculo !== 'apv') return '';

    return '<section class="rt-sec">' +
      '<div class="rt-k">05 · Brecha previsional</div>' +
      '<div class="rt-origen">Calculado a partir de los datos ingresados</div>' +
      '<div class="res-big num" style="font-size:var(--fs-num-xl)">' + Fmt.clp(br.mensual) + '</div>' +
      '<div class="res-cap">Brecha mensual estimada</div>' +
      '<p class="t-small t-2" style="margin-top:var(--s3)">Con ' + br.anios +
        ' años restantes, según los valores ingresados. ' +
        '<a href="#/brecha">Revisar</a></p>' +
    '</section>';
  }

  /* ── 06 · Consideración tributaria ── */
  function tributario(s) {
    if (!s.vehiculo) return '';

    var ids = TAX_ORDER.filter(function (id) {
      return TAX_CONFIG[id].vehiculos.indexOf(s.vehiculo) !== -1;
    });
    if (!ids.length) return '';

    var notas = {
      cui: 'Aplicable bajo los requisitos legales correspondientes al rescate total.',
      art57: 'Aplicable al mayor valor en el rescate, bajo los requisitos del artículo.',
      art107: 'Información general: aplica sólo a instrumentos que cumplen los requisitos legales.',
      apv_a: 'Se opta por el régimen al contratar el plan APV.',
      apv_b: 'Se opta por el régimen al contratar el plan APV.',
      deposito_convenido: 'Requiere acuerdo escrito entre trabajador y empleador.'
    };

    return '<section class="rt-sec">' +
      '<div class="rt-k">06 · Consideración tributaria</div>' +
      '<div class="rt-origen">Contenido relacionado con el vehículo explorado</div>' +
      '<div class="rt-tax">' + ids.map(function (id) {
        var t = TAX_CONFIG[id];
        return '<div class="rt-tax-i">' +
                 '<div class="t-h3">' + Fmt.esc(t.nombre) + '</div>' +
                 '<div class="rt-tax-v">' + Fmt.esc(t.card.n) + '</div>' +
                 '<div class="t-small t-2">' + Fmt.esc(notas[id] || '') + '</div>' +
               '</div>';
      }).join('') + '</div>' +
      '<p style="margin-top:var(--s4)"><a class="link-arrow" href="#/tributario">' +
        'Ver detalle tributario</a></p>' +
    '</section>';
  }

  /* ── 07 · Conceptos relevantes ── */
  function conceptos(s) {
    var ids = [];
    if (s.horizonte) ids.push('horizonte');
    if (s.horizonte === 'largo') ids.push('interes_compuesto', 'diversificacion', 'volatilidad');
    else if (s.horizonte === 'mediano') ids.push('volatilidad', 'diversificacion', 'liquidez');
    else ids.push('liquidez', 'volatilidad', 'rentabilidad');

    var vistos = {};
    ids = ids.filter(function (i) {
      if (vistos[i] || !CONCEPT_CONFIG[i]) return false;
      vistos[i] = true; return true;
    }).slice(0, 4);

    if (!ids.length) return '';

    return '<section class="rt-sec">' +
      '<div class="rt-k">07 · Conceptos relevantes</div>' +
      '<div class="rt-concepts" style="margin-top:var(--s4)">' +
        ids.map(function (i) { return Fmt.esc(CONCEPT_CONFIG[i].nombre); }).join(' · ') +
      '</div>' +
      '<p style="margin-top:var(--s4)"><a class="link-arrow" href="#/educacion">' +
        'Revisar conceptos</a></p>' +
    '</section>';
  }

  /* ── 08 · Otras alternativas ── */
  function otras(s) {
    if (!s.serie) return '';

    var lista = Data.fundsBySeries(s.serie).filter(function (f) {
      if (s.horizonte && f.horizonte !== s.horizonte) return false;
      return f.id !== s.fondoId;
    }).slice(0, 3);

    if (!lista.length) return '';

    return '<section class="rt-sec rt-sec--sec">' +
      '<div class="rt-k">08 · Otras alternativas</div>' +
      '<div class="fund-list" style="margin-top:var(--s4)">' + lista.map(function (f) {
        var r = Data.returns(s.serie, f.id);
        return '<a class="fund-row" href="#/fondos/' + f.id + '">' +
                 '<span class="fund-name">' + Fmt.esc(f.nombre) + '</span>' +
                 '<span class="fund-meta">' + Fmt.esc(f.moneda) + ' · ' +
                   Fmt.esc(FUND_CATEGORIES[f.categoria].nombre) + '</span>' +
                 '<span class="fund-ret"><span class="fund-ret-v num">' + Fmt.pct(r.ultimoAno) +
                   '</span><span class="fund-ret-k">Último año</span></span>' +
                 '<span class="fund-vol">' + Volatility.inline(s.serie, f.id) +
                   '<span class="fund-ret-k">Volatilidad</span></span>' +
               '</a>';
      }).join('') + '</div>' +
      '<p style="margin-top:var(--s4)"><a class="link-arrow" href="#/fondos">' +
        'Ver todas las alternativas</a></p>' +
    '</section>';
  }

  /* ── Render ── */

  function render(outlet) {
    var s = AppState.get();
    /* Una estrategia construida es por sí sola un recorrido válido,
       aunque no se haya completado el diagnóstico. */
    var vacio = !s.etapa && !s.objetivo && !s.horizonte && !s.serie && !s.fondoId &&
                AppState.capasActivas().length === 0;

    if (vacio) {
      outlet.innerHTML =
        '<div class="page page--read">' +
          '<span class="t-eyebrow">Tu Ruta Financiera</span>' +
          '<h1 class="t-h1 head">Todavía no hay recorrido</h1>' +
          '<p class="t-read head-lead">Esta pantalla reúne el recorrido realizado. Aún no ' +
            'hay decisiones registradas.</p>' +
          '<div class="empty"><div class="actions">' +
            '<a class="btn btn--primary" href="#/diagnostico">Iniciar Ruta Financiera →</a>' +
            '<a class="link-arrow" href="#/fondos">Explorar fondos</a>' +
          '</div></div>' +
        '</div>';
      return;
    }

    if (!s.resultadoVisto) AppState.set({ resultadoVisto: true });

    var fecha = new Date().toLocaleDateString('es-CL', {
      day: '2-digit', month: 'long', year: 'numeric'
    });

    outlet.innerHTML =
      '<div class="page rt-page">' +
        '<div class="rt-head">' +
          '<span class="t-eyebrow">Resultado de la Ruta</span>' +
          '<h1 class="t-h1">Tu Ruta Financiera</h1>' +
          '<p class="t-read head-lead">Síntesis del recorrido realizado.</p>' +
          '<p class="t-small t-3 rt-fecha">Sesión del ' + Fmt.esc(fecha) +
            ' · Datos de fondos al ' + Fmt.esc(DATA_META.date) + '</p>' +
          '<p class="t-small t-3 rt-leyenda">Cada sección indica su procedencia: ' +
            '<b>definido por ti</b>, <b>explorado durante la Ruta</b> o <b>calculado</b> a ' +
            'partir de los datos que ingresaste.</p>' +
        '</div>' +

        puntoPartida(s) +
        estrategia() +
        solucion(s) +
        alternativa(s) +
        simulacion(s.simulacion) +
        brecha(s) +
        tributario(s) +
        conceptos(s) +
        otras(s) +

        '<div class="rt-actions">' +
          '<button type="button" class="btn btn--primary" id="rt-print">Imprimir resumen</button>' +
          '<a class="btn btn--secondary" href="#/diagnostico">Modificar diagnóstico</a>' +
          '<a class="btn btn--secondary" href="#/simulador">Modificar simulación</a>' +
          '<a class="btn btn--secondary" href="#/fondos">Explorar otro fondo</a>' +
          '<button type="button" class="link-arrow" id="rt-reset">Nueva ruta</button>' +
        '</div>' +

        '<p class="note rt-disc">Esta síntesis reúne la información consultada durante el ' +
          'recorrido. No constituye una recomendación de inversión, ni perfilamiento formal, ' +
          'ni asesoría financiera, previsional o tributaria. ' +
          Fmt.esc(DATA_META.disclaimer) + '</p>' +
      '</div>';

    /* El gráfico se comprueba una vez insertado en el DOM. */
    Chart.verify(outlet);

    outlet.querySelector('#rt-print').addEventListener('click', function () { window.print(); });
    outlet.querySelector('#rt-reset').addEventListener('click', function () {
      AppState.reset();
      if (window.ScreenSimulador && ScreenSimulador.reset) ScreenSimulador.reset();
        if (window.ScreenSoluciones && ScreenSoluciones.reset) ScreenSoluciones.reset();
      if (window.ScreenBrecha && ScreenBrecha.reset) ScreenBrecha.reset();
      Router.go('inicio');
    });
  }

  return { render: render };
})();


/* ═══════════════ app.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Arranque
   ============================================================ */

(function () {

  function checkData() {
    var chk = Data.integrityCheck();
    var c = Data.counts();

    console.log('%c RUTA FINANCIERA ', 'background:#112240;color:#fff;font-weight:700');
    console.log('Datos al ' + DATA_META.date + ' · fuente: ' + DATA_META.source);
    console.log('Fondos: ' + c.fondos + ' · Series: ' + c.series +
                ' · Categorías: ' + c.categorias + ' · Registros: ' + c.registros);

    if (chk.errors.length) {
      console.error('Integridad: ' + chk.errors.length + ' error(es)');
      chk.errors.forEach(function (e) { console.error('  · ' + e); });
    } else {
      console.log('Integridad: catálogo y rentabilidades alineados.');
    }
    if (chk.warnings.length) {
      console.warn('Avisos de fuente: ' + chk.warnings.length);
      chk.warnings.forEach(function (w) { console.warn('  · ' + w); });
    }
  }

  var ROUTES = {
    inicio:      function (o, p, r) { ScreenInicio.render(o, p, r); },
    diagnostico: function (o, p, r) {
      /* Compatibilidad: #/diagnostico/etapa|objetivo|horizonte eran
         tres pantallas en V1. Ahora redirigen a la pantalla única. */
      if (p && p.length) { Router.go('diagnostico'); return; }
      ScreenDiagnostico.render(o, p, r);
    },
    soluciones:  function (o, p, r) { ScreenSoluciones.render(o, p, r); },
    estrategia:  function (o, p, r) { ScreenEstrategia.render(o, p, r); },
    fondos:      function (o, p, r) { ScreenFondos.render(o, p, r); },
    educacion:   function (o, p, r) { ScreenEducacion.render(o, p, r); },
    simulador:   function (o, p, r) { ScreenSimulador.render(o, p, r); },
    brecha:      function (o, p, r) { ScreenBrecha.render(o, p, r); },
    tributario:  function (o, p, r) { ScreenTributario.render(o, p, r); },
    ruta:        function (o, p, r) { ScreenResumen.render(o, p, r); }
  };

  function registerRoutes() {
    Object.keys(ROUTES).forEach(function (name) {
      Router.register(name, ROUTES[name]);
    });

    Router.setNotFound(function (outlet, params, route) {
      outlet.innerHTML =
        '<div class="page page--read">' +
          '<span class="t-eyebrow">Ruta no encontrada</span>' +
          '<h1 class="t-h1 head">' + Fmt.esc(route.raw || '') + '</h1>' +
          '<p class="t-read head-lead">Esta dirección no corresponde a ningún módulo.</p>' +
          '<div class="empty"><div class="actions">' +
            '<a class="btn btn--secondary" href="#/inicio">Volver al inicio</a>' +
          '</div></div>' +
        '</div>';
    });

    /* Título de pestaña por módulo */
    var TITULOS = {
      inicio: null,
      diagnostico: 'Diagnóstico',
      soluciones: 'Soluciones',
      estrategia: 'Estrategia',
      fondos: 'Fondos',
      educacion: 'Educación',
      simulador: 'Simulador',
      brecha: 'Brecha Previsional',
      tributario: 'Tributario',
      ruta: 'Tu Ruta Financiera'
    };
    var BASE = 'Ruta Financiera · Educación y Planificación Financiera';

    Router.before(function (route) {
      var t = TITULOS[route.name];
      document.title = t ? (t + ' · Ruta Financiera') : BASE;
      Nav.setActive(route.name);
      ContextBar.render(route.name);
      Nav.refreshProgreso();
      document.body.setAttribute('data-screen', route.name);
    });
  }

  function bindState() {
    AppState.subscribe(function (state, changed) {
      var route = Router.getCurrent();
      ContextBar.render(route ? route.name : 'inicio');
      Nav.refreshProgreso();
    });
  }

  /* La barra de contexto cambia de contenido entre móvil y escritorio;
     se recalcula al rotar el dispositivo o redimensionar. */
  function bindViewport() {
    var t = null;
    function refrescar() {
      clearTimeout(t);
      t = setTimeout(function () {
        var route = Router.getCurrent();
        ContextBar.render(route ? route.name : 'inicio');
      }, 120);
    }
    window.addEventListener('resize', refrescar);
    window.addEventListener('orientationchange', refrescar);
  }

  function init() {
    checkData();
    Nav.restore();
    Nav.render('inicio');
    registerRoutes();
    bindState();
    bindViewport();
    Router.start();
    if (window.UpdateCheck) UpdateCheck.init();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
