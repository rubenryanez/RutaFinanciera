   ============================================================ */

var ScreenEstrategia = (function () {

  function tarjeta(id, activa) {
    var L = STRATEGY_LAYERS[id];
    var sc = SERIES_CONFIG[L.serie];
    var veh = VEHICLE_CONFIG[L.vehiculo];

    var etiquetaSerie = (id === 'jubilacion')
      ? 'APV · APV AP'
      : veh.nombre + ' · ' + sc.label;

    var nota = L.nota
      ? '<div class="cap-nota">' + Fmt.esc(L.nota) + '</div>'
      : '';

    return '<div class="cap' + (activa ? ' is-on' : '') + '" id="cap-' + id + '">' +
      '<div class="cap-head">' +
        '<div class="card-k">' + Fmt.esc(L.k) + '</div>' +
        (activa ? '<span class="cap-check" aria-hidden="true">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" ' +
                    'stroke="currentColor" stroke-width="2.2" stroke-linecap="round" ' +
                    'stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>' +
                  '</span>' : '') +
      '</div>' +
      '<div class="cap-t">' + Fmt.esc(L.titulo) + '</div>' +
      '<div class="cap-veh">' + Fmt.esc(etiquetaSerie) + '</div>' +

      '<div class="cap-meta">' +
        '<div class="ref-k">Horizonte</div>' +
        '<div class="cap-hz">' + Fmt.esc(L.horizonte) + '</div>' +
      '</div>' +

      '<div class="cap-conc">' + Fmt.esc(L.conceptos.join(' · ')) + '</div>' +
      '<p class="cap-desc">' + Fmt.esc(L.descripcion) + '</p>' +
      nota +

      '<button type="button" class="cap-btn' + (activa ? ' is-on' : '') + '" ' +
        'data-capa="' + id + '" aria-pressed="' + activa + '">' +
        (activa ? '✓ Incorporado' : '+ Incorporar a la estrategia') +
      '</button>' +
    '</div>';
  }

  /* ── Panel "Tu estrategia" ── */

  function panel(activas) {
    if (!activas.length) return '';

    var bloques = activas.map(function (id, i) {
      var L = STRATEGY_LAYERS[id];
      var capa = AppState.capa(id);
      var sc = SERIES_CONFIG[capa.serie] || SERIES_CONFIG[L.serie];
      var veh = VEHICLE_CONFIG[capa.vehiculo] || VEHICLE_CONFIG[L.vehiculo];

      var fondo = capa.fondoId && FUND_CATALOG[capa.fondoId]
        ? '<div class="est-fondo"><div class="ref-k">Fondo explorado</div>' +
          '<div class="est-fv">' + Fmt.esc(FUND_CATALOG[capa.fondoId].nombre) + '</div></div>'
        : '';

      var sim = capa.simulacion && capa.simulacion.final > 0
        ? '<div class="est-fondo"><div class="ref-k">Capital proyectado</div>' +
          '<div class="est-fv num">' + Fmt.clp(capa.simulacion.final) + '</div></div>'
        : '';

      return '<div class="est-b">' +
        '<div class="est-i">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</div>' +
        '<div class="est-body">' +
          '<div class="est-k">' + Fmt.esc(L.resumenK) + '</div>' +
          '<div class="est-veh">' + Fmt.esc(veh.nombre) + '</div>' +
          '<div class="est-serie">' + Fmt.esc(id === 'jubilacion' ? 'Serie APV · APV AP' : sc.label) +
            ' · ' + Fmt.esc(L.horizonteCorto) + '</div>' +
          fondo + sim +
          '<div class="est-acts">' +
            '<button type="button" class="link-arrow" data-explorar="' + id + '">Explorar fondos</button>' +
            '<button type="button" class="link-arrow" data-simular="' + id + '">Simular esta necesidad</button>' +
            '<button type="button" class="est-quitar" data-capa="' + id + '">Quitar</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="section section--rule" id="est-panel">' +
      '<h2 class="t-h2">Tu estrategia</h2>' +
      '<p class="t-small t-2" style="margin-top:var(--s2);max-width:62ch">' +
        activas.length + (activas.length === 1 ? ' necesidad incorporada' : ' necesidades incorporadas') +
        '. Cada capa cumple una función distinta y tiene su propio horizonte. ' +
        'No se asignan porcentajes ni montos entre ellas.</p>' +
      '<div class="est-track">' + bloques + '</div>' +
    '</div>';
  }

  /* ── Render ── */

  function render(outlet) {
    var activas = AppState.capasActivas();

    var cards = STRATEGY_ORDER.map(function (id) {
      return tarjeta(id, activas.indexOf(id) !== -1);
    }).join('');

    outlet.innerHTML =
      '<div class="page">' +
        '<span class="t-eyebrow">Planificación</span>' +
        '<h1 class="t-h1 head--wide">Construye una estrategia financiera</h1>' +
        '<p class="t-read head-lead">Distintos objetivos pueden requerir diferentes ' +
          'horizontes y estructuras. Organiza las necesidades financieras según la función ' +
          'que cumple cada solución.</p>' +

        '<div class="caps">' + cards + '</div>' +

        panel(activas) +

        '<p class="note">Esta pantalla organiza necesidades y estructuras según su ' +
          'horizonte y función. No constituye una asignación de cartera, una distribución ' +
          'de inversión ni una recomendación. Los costos de administración dependen de la ' +
          'serie y del fondo.</p>' +

        '<div class="next">' +
          '<a href="#/fondos">' +
            '<span class="next-k">Continuar</span>' +
            '<span class="next-t">Explorar fondos</span>' +
            '<span class="next-d">Ver las alternativas disponibles en cada serie</span>' +
          '</a>' +
          '<a href="#/ruta">' +
            '<span class="next-k">Cerrar</span>' +
            '<span class="next-t">Tu Ruta Financiera</span>' +
            '<span class="next-d">Reunir el recorrido y la estrategia construida</span>' +
          '</a>' +
        '</div>' +
      '</div>';

    bind(outlet);
  }

  function bind(outlet) {
    outlet.querySelectorAll('[data-capa]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var y = window.scrollY;
        AppState.toggleCapa(btn.getAttribute('data-capa'));
        render(outlet);
        try { window.scrollTo({ top: y, behavior: 'instant' }); }
        catch (e) { window.scrollTo(0, y); }
      });
    });

    /* Explorar fondos: preselecciona la serie de la capa y deja
       constancia de desde qué capa se salió. */
    outlet.querySelectorAll('[data-explorar]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-explorar');
        var L = STRATEGY_LAYERS[id];
        AppState.set({
          serie: L.serie,
          vehiculo: L.vehiculo,
          estrategiaFoco: id
        });
        Router.go('fondos');
      });
    });

    /* Simular: hereda serie y, si existe, el fondo de la capa. */
    outlet.querySelectorAll('[data-simular]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-simular');
        var L = STRATEGY_LAYERS[id];
        var capa = AppState.capa(id);

        var patch = { serie: L.serie, vehiculo: L.vehiculo, estrategiaFoco: id };
        if (capa && capa.fondoId) patch.fondoId = capa.fondoId;
        AppState.set(patch);

        if (window.ScreenSimulador && ScreenSimulador.reset) ScreenSimulador.reset();
        Router.go('simulador');
      });
    });
  }

  return { render: render };
})();


/* ═══════════════ modules/fondos.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Fondos y Rentabilidades
   ------------------------------------------------------------
   Nivel 1 · Vista general por categoría (no una tabla gigante)
   Nivel 2 · Ficha individual de fondo

   Reglas del módulo:
   - La fecha de corte y la advertencia están siempre en pantalla.
   - Toda cifra lleva su período visible. Nunca un porcentaje suelto.
   - El filtro de horizonte es visible y desactivable en un clic.
     El contexto prioriza; nunca oculta de forma irreversible.
   - El horizonte se expresa como ASOCIACIÓN, nunca como aptitud.
   ============================================================ */

var ScreenFondos = (function () {

  /* Filtro de horizonte: local al módulo. No se escribe en
     APP_STATE porque es una preferencia de vista, no una
     decisión de la ruta. */
  var filtroHorizonte = null;
  var filtroInicializado = false;

  /* ─────────────────────────────────────────
     Piezas compartidas
     ───────────────────────────────────────── */

  /* Serie mostrada. Si el usuario no ha definido ninguna, Serie A
     actúa como VISTA INICIAL de consulta: se muestra, pero no se
     escribe en APP_STATE. Sólo al cambiarla queda incorporada. */
  var SERIE_VISTA = 'A';

  function serieActiva() {
    var s = AppState.get('serie');
    return (s && SERIES_CONFIG[s]) ? s : SERIE_VISTA;
  }

  function serieEsVista() {
    var s = AppState.get('serie');
    return !(s && SERIES_CONFIG[s]);
  }

  function stamp() {
    return '<div class="data-stamp">' +
             '<b>' + Fmt.esc(DATA_META.stamp) + '</b>' +
             '<span>Fuente: ' + Fmt.esc(DATA_META.source) + '</span>' +
           '</div>';
  }

  function disclaimer(extra) {
    return '<p class="note">' + Fmt.esc(DATA_META.disclaimer) +
           (extra ? ' ' + Fmt.esc(extra) : '') + '</p>';
  }

  function serieSelector(activa, disponibles, handlerAttr) {
    var lista = disponibles || SERIES_ORDER;
    var btns = lista.map(function (s) {
      var cls = 'seg-btn' + (s === activa ? ' is-active' : '');
      return '<button type="button" class="' + cls + '" ' + handlerAttr + '="' + s + '" ' +
             'aria-pressed="' + (s === activa) + '">' +
             Fmt.esc(SERIES_CONFIG[s].short) + '</button>';
    }).join('');

    return '<div class="seg" role="group" aria-label="Serie">' +
             '<span class="seg-label">Serie</span>' + btns +
           '</div>';
  }

  function serieDescripcion(serie) {
    var sc = SERIES_CONFIG[serie];
    var partes = [
      '<b>' + Fmt.esc(sc.label) + '</b>',
      Fmt.esc(VEHICLE_CONFIG[sc.vehiculo].nombre),
      'Horizonte de referencia: ' + Fmt.esc(sc.horizonteRef)
    ];
    if (sc.costoSalidaNota) partes.push(Fmt.esc(sc.costoSalidaNota));
    return '<p class="t-small t-2">' + partes.join(' · ') + '</p>';
  }

  /* ─────────────────────────────────────────
     NIVEL 1 · Vista general
     ───────────────────────────────────────── */

  function filtroHTML() {
    var opciones = [{ id: null, nombre: 'Todos' }].concat(
      HORIZON_ORDER.map(function (h) { return HORIZON_CONFIG[h]; })
    );

    var btns = opciones.map(function (o) {
      var activo = (filtroHorizonte === o.id) || (!filtroHorizonte && o.id === null);
      return '<button type="button" class="seg-btn' + (activo ? ' is-active' : '') + '" ' +
             'data-horizonte="' + (o.id === null ? '' : o.id) + '" ' +
             'aria-pressed="' + activo + '">' + Fmt.esc(o.nombre) + '</button>';
    }).join('');

    var aviso = '';
    var ctxH = AppState.get('horizonte');
    if (filtroHorizonte && ctxH && filtroHorizonte === ctxH) {
      aviso = '<p class="t-small t-2 filtro-aviso">' +
                'Filtrado por el horizonte de tu ruta. ' +
                '<button type="button" class="btn--text" data-horizonte="">Ver todos los fondos</button>' +
              '</p>';
    }

    return '<div class="seg" role="group" aria-label="Horizonte">' +
             '<span class="seg-label">Horizonte</span>' + btns +
           '</div>' + aviso;
  }

  function fundRow(serie, f) {
    var r = Data.returns(serie, f.id);
    if (!r) return '';

    return '<a class="fund-row" href="#/fondos/' + f.id + '">' +
             '<span class="fund-name">' + Fmt.esc(f.nombre) + '</span>' +
             '<span class="fund-meta">' +
               Fmt.esc(f.moneda) + ' · ' +
               Fmt.esc(HORIZON_CONFIG[f.horizonte].nombre) +
             '</span>' +
             '<span class="fund-ret">' +
               '<span class="fund-ret-v num ' + Fmt.signClass(r.ultimoAno) + '">' +
                 Fmt.pct(r.ultimoAno) + '</span>' +
               '<span class="fund-ret-k">Último año</span>' +
             '</span>' +
             '<span class="fund-vol">' +
               Volatility.inline(serie, f.id) +
               '<span class="fund-ret-k">Volatilidad</span>' +
             '</span>' +
           '</a>';
  }

  function categoryBlock(serie, catId) {
    var cat = FUND_CATEGORIES[catId];
    var fondos = Data.fundsInCategory(serie, catId, filtroHorizonte);
    if (!fondos.length) return '';

    return '<section class="cat">' +
             '<div class="cat-head">' +
               '<h2 class="t-h2">' + Fmt.esc(cat.nombre) + '</h2>' +
               '<span class="t-small t-3">' + fondos.length +
                 (fondos.length === 1 ? ' fondo' : ' fondos') + '</span>' +
             '</div>' +
             '<p class="t-small t-2 cat-desc">' + Fmt.esc(cat.descripcion) + '</p>' +
             '<div class="fund-list">' +
               fondos.map(function (f) { return fundRow(serie, f); }).join('') +
             '</div>' +
           '</section>';
  }

  function ausenciasHTML(serie) {
    var avisos = [];

    /* Categorías que no existen en esta serie según el reporte */
    var missing = Data.missingCategories(serie);
    if (missing.length) {
      avisos.push(missing.map(function (c) { return c.nombre; }).join(', ') +
                  ' no figura en ' + SERIES_CONFIG[serie].label +
                  ' según el reporte al ' + DATA_META.date + '.');
    }

    /* Categorías ocultas por el filtro, no por ausencia de datos.
       Se informa para que el filtro nunca oculte en silencio. */
    if (filtroHorizonte) {
      var ocultas = CATEGORY_ORDER.filter(function (catId) {
        return Data.fundsInCategory(serie, catId).length > 0 &&
               Data.fundsInCategory(serie, catId, filtroHorizonte).length === 0;
      }).map(function (catId) { return FUND_CATEGORIES[catId].nombre; });

      if (ocultas.length) {
        avisos.push(ocultas.join(', ') + ' no aparece con el filtro de horizonte ' +
                    HORIZON_CONFIG[filtroHorizonte].nombre.toLowerCase() +
                    ' aplicado, pero sí existe en esta serie.');
      }
    }

    if (!avisos.length) return '';
    return '<p class="t-small t-2 ausencias">' +
           avisos.map(function (a) { return Fmt.esc(a); }).join('<br>') + '</p>';
  }

  function renderVistaGeneral(outlet) {
    var serie = serieActiva();

    /* Preselección por contexto, una sola vez */
    if (!filtroInicializado) {
      var ctxH = AppState.get('horizonte');
      if (ctxH && HORIZON_CONFIG[ctxH]) filtroHorizonte = ctxH;
      filtroInicializado = true;
    }

    var bloques = CATEGORY_ORDER
      .map(function (catId) { return categoryBlock(serie, catId); })
      .join('');

    var visibles = Data.fundsBySeries(serie).filter(function (f) {
      return !filtroHorizonte || f.horizonte === filtroHorizonte;
    });

    var vacio = visibles.length === 0
      ? '<p class="t-read t-2" style="margin-top:var(--s6)">' +
          'Ningún fondo de esta serie está asociado a ese horizonte. ' +
          '<button type="button" class="btn--text" data-horizonte="">Ver todos los fondos</button>' +
        '</p>'
      : '';

    outlet.innerHTML =
      '<div class="page">' +
        '<div class="t-label">Fondos y Rentabilidades</div>' +
        '<h1 class="t-h1 head--wide">Explora fondos y rentabilidades</h1>' +
        '<p class="t-read head-lead">Selecciona una serie para ver sus alternativas por ' +
          'categoría. Cada fondo abre su ficha con rentabilidad, volatilidad y horizonte.</p>' +

        '<div style="margin-top:var(--s5)">' + stamp() + '</div>' +

        '<div class="controls">' +
          serieSelector(serie, null, 'data-serie') +
          filtroHTML() +
        '</div>' +

        '<div style="margin-top:var(--s4)">' + serieDescripcion(serie) +
          (serieEsVista()
            ? '<p class="vista-nota"><b>Vista inicial: ' +
              Fmt.esc(SERIES_CONFIG[serie].label) + '.</b> Aún no has incorporado una serie ' +
              'a tu Ruta; cambia el selector para hacerlo.</p>'
            : '') +
        '</div>' +

        vacio +
        '<div class="cats">' + bloques + '</div>' +

        ausenciasHTML(serie) +
        Volatility.zeroNote(serie, visibles.map(function (f) { return f.id; })) +

        disclaimer('El horizonte asociado corresponde a una clasificación educativa ' +
                   'y no constituye una recomendación automática ni una garantía de idoneidad.') +

        '<div id="fon-cp"></div>' +
      '</div>';

    bindVistaGeneral(outlet);
    refrescarCheckpoint(outlet);
  }

  function checkpointHTML() {
    var s = AppState.get();
    var serie = s.serie && SERIES_CONFIG[s.serie] ? SERIES_CONFIG[s.serie].label : null;
    var fondo = s.fondoId && FUND_CATALOG[s.fondoId] ? FUND_CATALOG[s.fondoId].nombre : null;

    return RouteCheckpoint.html({
      items: [
        { k: 'Serie consultada', v: serie },
        { k: 'Fondo explorado',  v: fondo }
      ],
      mensaje: fondo
        ? 'Has explorado un fondo. Puedes usarlo como referencia histórica en el simulador.'
        : 'No has explorado un fondo específico. Puedes continuar al simulador utilizando ' +
          'un supuesto manual.',
      acciones: fondo
        ? [{ label: 'Continuar al Simulador →', href: '#/simulador', primary: true }]
        : [{ label: 'Seleccionar fondo', id: 'cp-fondo' },
           { label: 'Continuar sin fondo →', href: '#/simulador' }]
    });
  }

  function refrescarCheckpoint(outlet) {
    var el = outlet.querySelector('#fon-cp');
    if (!el) return;
    el.innerHTML = checkpointHTML();
    var btn = el.querySelector('#cp-fondo');
    if (btn) {
      btn.addEventListener('click', function () {
        var nodo = outlet.querySelector('.fund-list');
        if (nodo) nodo.scrollIntoView({ block: 'start',
          behavior: (window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth' });
      });
    }
  }

  function bindVistaGeneral(outlet) {
    outlet.querySelectorAll('[data-serie]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var s = btn.getAttribute('data-serie');
        AppState.set({ serie: s, vehiculo: SERIES_CONFIG[s].vehiculo });
        renderVistaGeneral(outlet);
      });
    });

    outlet.querySelectorAll('[data-horizonte]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var h = btn.getAttribute('data-horizonte');
        filtroHorizonte = h || null;
        renderVistaGeneral(outlet);
      });
    });
  }

  /* ─────────────────────────────────────────
     NIVEL 2 · Ficha individual
     ───────────────────────────────────────── */

  function breadcrumb(f) {
    return '<nav class="breadcrumb" aria-label="Ruta de navegación">' +
             '<a href="#/fondos">Fondos</a>' +
             '<span aria-hidden="true">/</span>' +
             '<a href="#/fondos">' + Fmt.esc(FUND_CATEGORIES[f.categoria].nombre) + '</a>' +
             '<span aria-hidden="true">/</span>' +
             '<span aria-current="page">' + Fmt.esc(f.nombre) + '</span>' +
           '</nav>';
  }

  function bloqueRentabilidad(serie, f) {
    var r = Data.returns(serie, f.id);

    var filas = RETURN_PERIODS.map(function (p) {
      var v = r[p.key];
      return '<tr>' +
               '<td>' + Fmt.esc(p.label) + '</td>' +
               '<td class="n ' + Fmt.signClass(v) + '">' + Fmt.pct(v) + '</td>' +
             '</tr>';
    }).join('');

    return '<section class="ficha-block">' +
             '<h2 class="t-h2">Rentabilidad</h2>' +
             '<p class="t-small t-2 ficha-lead">' +
               'Rentabilidades nominales de ' + Fmt.esc(SERIES_CONFIG[serie].label) +
               ' al ' + Fmt.esc(DATA_META.date) +
               '. Cada cifra corresponde al período indicado.' +
             '</p>' +
             '<div class="table-wrap ficha-tbl">' +
               '<table class="tbl">' +
                 '<thead><tr><th>Período</th><th class="n">Rentabilidad</th></tr></thead>' +
                 '<tbody>' + filas + '</tbody>' +
               '</table>' +
             '</div>' +
             /* Sólo se muestra si la tabla realmente desborda; la clase
                se añade tras medir, no por suposición. */
             '<div class="scroll-hint" hidden id="ficha-hint">Desliza para ver más →</div>' +
             '<p class="t-small t-3" style="margin-top:var(--s4)">' +
               'Valor cuota: <span class="num">' + Fmt.cuota(r.valorCuota) + '</span>' +
             '</p>' +
           '</section>';
  }

  function bloqueVolatilidad(serie, f) {
    return '<section class="ficha-block">' +
             '<h2 class="t-h2">Volatilidad</h2>' +
             '<div class="vol-headline">' +
               '<span class="vol-big num">' + Volatility.figure(serie, f.id) + '</span>' +
               '<span class="t-small t-2">' +
                 Fmt.esc(Volatility.positionText(serie, f.id)) + '</span>' +
             '</div>' +
             '<p class="t-small t-2" style="margin-top:var(--s5)">' +
               'Escala del universo comparable en ' +
               Fmt.esc(SERIES_CONFIG[serie].label) + ':' +
             '</p>' +
             Volatility.anchors(serie, f.id) +
             Volatility.zeroNote(serie, [f.id]) +
           '</section>';
  }

  function bloqueTecnico(serie, f) {
    if (f.duration === undefined) return '';

    return '<section class="ficha-block">' +
             '<h2 class="t-h2">Ficha técnica</h2>' +
             '<div class="pairs">' +
               '<div class="pair">' +
                 '<span class="t-label">Duration</span>' +
                 '<span class="pair-v num">' + Fmt.dias(f.duration) + '</span>' +
               '</div>' +
               '<div class="pair">' +
                 '<span class="t-label">Exposición UF</span>' +
                 '<span class="pair-v num">' + Fmt.num(f.pctUF, 2) + '%</span>' +
               '</div>' +
             '</div>' +
             '<p class="t-small t-3" style="margin-top:var(--s4)">' +
               'Datos publicados en el reporte al ' + Fmt.esc(DATA_META.date) +
               ' para los fondos de Renta Fija Nacional.' +
             '</p>' +
           '</section>';
  }

  function bloqueSeries(serie, f) {
    var filas = Data.acrossSeries(f.id, 'ultimoAno');
    if (filas.length < 2) return '';

    var base = filas.filter(function (x) { return x.serie === serie; })[0];
    var baseV = base ? base.valor : null;

    /* Se muestra la diferencia en puntos porcentuales frente a la serie
       activa, no una barra. Con valores próximos entre sí (por ejemplo
       4,55% a 5,55%), una barra escalada desde cero las dibuja
       prácticamente idénticas y deja de informar. La diferencia es
       justamente lo que este bloque debe enseñar. */
    var rows = filas.map(function (x) {
      var actual = x.serie === serie;
      var delta = (baseV !== null && x.valor !== null) ? (x.valor - baseV) : null;

      var deltaHTML = actual
        ? '<span class="serie-row-d t-3">serie activa</span>'
        : '<span class="serie-row-d num ' + Fmt.signClass(delta) + '">' +
            (delta > 0 ? '+' : delta < 0 ? '−' : '') +
            Fmt.num(Math.abs(delta), 2) + ' pp' +
          '</span>';

      return '<div class="serie-row' + (actual ? ' is-current' : '') + '">' +
               '<span class="serie-row-k">' + Fmt.esc(x.label) + '</span>' +
               '<span class="serie-row-v num ' + Fmt.signClass(x.valor) + '">' +
                 Fmt.pct(x.valor) + '</span>' +
               deltaHTML +
             '</div>';
    }).join('');

    return '<section class="ficha-block">' +
             '<h2 class="t-h2">El mismo fondo, distinta serie</h2>' +
             '<p class="t-small t-2 ficha-lead">' +
               'La serie no cambia dónde invierte el fondo: cambia las condiciones bajo ' +
               'las que se accede a él. Rentabilidad del último año al ' +
               Fmt.esc(DATA_META.date) + ', y diferencia en puntos porcentuales frente a ' +
               Fmt.esc(SERIES_CONFIG[serie].label) + '.' +
             '</p>' +
             '<div class="serie-compare">' + rows + '</div>' +
           '</section>';
  }

  function bloqueHorizonte(serie, f) {
    var h = HORIZON_CONFIG[f.horizonte];

    return '<section class="ficha-block">' +
             '<h2 class="t-h2">Relación con el horizonte</h2>' +
             '<p class="t-read t-2" style="margin-top:var(--s3)">' +
               'Este fondo está asociado al horizonte <b>' +
               Fmt.esc(h.nombre.toLowerCase()) + '</b> (' + Fmt.esc(h.referencia) +
               ') dentro de la clasificación educativa de la herramienta.' +
             '</p>' +
             '<p class="t-small t-3" style="margin-top:var(--s3)">' +
               'Es una asociación por horizonte, no una afirmación de idoneidad para ' +
               'una persona determinada.' +
             '</p>' +
             '<p style="margin-top:var(--s4)">' +
               '<a class="btn--text" href="#/soluciones">Ver el mapa de soluciones →</a>' +
             '</p>' +
           '</section>';
  }

  function renderFicha(outlet, fondoId) {
    var f = Data.fund(fondoId);
    if (!f) { renderNoEncontrado(outlet, fondoId); return; }

    /* Serie: la del contexto si el fondo existe en ella; si no,
       la primera en la que sí existe, informando el cambio. */
    var serieCtx = serieActiva();
    var serie = serieCtx;
    var cambioSerie = false;
    if (f.series.indexOf(serie) === -1) {
      serie = f.series[0];
      cambioSerie = true;
    }

    /* Abrir una ficha fija el fondo en la ruta. Es reversible:
       el elemento del contexto es editable y "Nueva ruta" lo limpia. */
    AppState.set({ fondoId: fondoId });

    var avisoSerie = cambioSerie
      ? '<p class="aviso">' + Fmt.esc(f.nombre) + ' no está disponible en ' +
        Fmt.esc(SERIES_CONFIG[serieCtx].label) + ' según el reporte al ' +
        Fmt.esc(DATA_META.date) + '. Se muestra ' +
        Fmt.esc(SERIES_CONFIG[serie].label) + '.</p>'
      : '';

    /* Sólo aparece si el usuario llegó desde una capa de Estrategia.
       Fuera de ese flujo, la selección de fondos no cambia. */
    var foco = AppState.get('estrategiaFoco');
    var asociar = '';
    if (foco && STRATEGY_LAYERS[foco]) {
      var capa = AppState.capa(foco);
      if (capa) {
        var yaEs = capa.fondoId === fondoId;
        asociar =
          '<div class="cap-assoc">' +
            '<span class="cap-assoc-t">' +
              (yaEs
                ? 'Fondo incorporado a <b>' + Fmt.esc(STRATEGY_LAYERS[foco].resumenK) + '</b>'
                : 'Incorporar este fondo a: <b>' + Fmt.esc(STRATEGY_LAYERS[foco].resumenK) + '</b>') +
            '</span>' +
            '<button type="button" id="cap-assoc-btn" class="' + (yaEs ? 'is-on' : '') + '">' +
              (yaEs ? 'Quitar de la capa' : 'Incorporar →') +
            '</button>' +
          '</div>';
      }
    }

    var avisoUSD = f.moneda === 'USD'
      ? '<p class="aviso">Las rentabilidades de este fondo están expresadas en dólares. ' +
        'Un resultado en pesos incorpora además la variación del tipo de cambio.</p>'
      : '';

    outlet.innerHTML =
      '<div class="page">' +
        breadcrumb(f) +

        '<div class="ficha-head">' +
          '<div class="ficha-id">' +
            '<div class="t-label">' +
              Fmt.esc(FUND_CATEGORIES[f.categoria].nombre) + '</div>' +
            '<h1 class="t-h1" style="margin-top:var(--s2)">' + Fmt.esc(f.nombre) + '</h1>' +
            '<p class="t-small t-2" style="margin-top:var(--s3)">' +
              Fmt.esc(f.moneda) + ' · Horizonte asociado: ' +
              Fmt.esc(HORIZON_CONFIG[f.horizonte].nombre) +
            '</p>' +
          '</div>' +
          '<div class="ficha-serie">' +
            serieSelector(serie, f.series, 'data-ficha-serie') +
            '<p class="t-small t-3" style="margin-top:var(--s3)">' +
              'Series en las que este fondo figura en el reporte.' +
            '</p>' +
          '</div>' +
        '</div>' +

        avisoSerie + avisoUSD + asociar +

        '<div style="margin-top:var(--s5)">' + stamp() + '</div>' +

        bloqueRentabilidad(serie, f) +
        bloqueVolatilidad(serie, f) +
        bloqueTecnico(serie, f) +
        bloqueSeries(serie, f) +
        bloqueHorizonte(serie, f) +

        disclaimer() +

        '<div class="next">' +
          '<a href="#/simulador">' +
            '<span class="next-k">Continuar</span>' +
            '<span class="next-t">Simular este fondo</span>' +
            '<span class="next-d">Con un supuesto editable, distinto de la ' +
              'rentabilidad histórica</span>' +
          '</a>' +
          '<a href="#/fondos">' +
            '<span class="next-k">Volver</span>' +
            '<span class="next-t">Otros fondos de ' +
              Fmt.esc(FUND_CATEGORIES[f.categoria].nombre) + '</span>' +
            '<span class="next-d">Ver la lista completa por categoría</span>' +
          '</a>' +
        '</div>' +
      '</div>';

    /* Indicación de desplazamiento: sólo si hay desborde real */
    var wrap = outlet.querySelector('.ficha-tbl');
    var hint = outlet.querySelector('#ficha-hint');
    if (wrap && hint) {
      hint.hidden = wrap.scrollWidth <= wrap.clientWidth + 1;
    }

    var assocBtn = outlet.querySelector('#cap-assoc-btn');
    if (assocBtn) {
      assocBtn.addEventListener('click', function () {
        var capaActual = AppState.capa(foco);
        AppState.setCapa(foco, {
          fondoId: (capaActual && capaActual.fondoId === fondoId) ? null : fondoId
        });
        renderFicha(outlet, fondoId);
      });
    }

    outlet.querySelectorAll('[data-ficha-serie]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var s = btn.getAttribute('data-ficha-serie');
        AppState.set({ serie: s, vehiculo: SERIES_CONFIG[s].vehiculo });
        renderFicha(outlet, fondoId);
      });
    });
  }

  function renderNoEncontrado(outlet, id) {
    outlet.innerHTML =
      '<div class="page page--read">' +
        '<div class="t-label">Fondo no encontrado</div>' +
        '<h1 class="t-h1" style="margin-top:var(--s3)">' + Fmt.esc(id || '') + '</h1>' +
        '<p class="t-read t-2" style="margin-top:var(--s4)">' +
          'Este identificador no corresponde a ningún fondo del reporte al ' +
          Fmt.esc(DATA_META.date) + '.' +
        '</p>' +
        '<div style="margin-top:var(--s6)">' +
          '<a class="btn btn--secondary" href="#/fondos">Ver todos los fondos</a>' +
        '</div>' +
      '</div>';
  }

  /* ─────────────────────────────────────────
     Entrada del módulo
     ───────────────────────────────────────── */

  function render(outlet, params) {
    if (params && params.length) {
      renderFicha(outlet, params[0]);
    } else {
      renderVistaGeneral(outlet);
    }
  }

  return { render: render };
})();


/* ═══════════════ modules/educacion.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Educación de Inversiones
   ------------------------------------------------------------
   V2: ocho tarjetas, un solo concepto desplegado bajo la grilla.
   Las cifras se leen de RETURN_DATA en tiempo de render.

   Prohibido: guiones comerciales, cómo explicarlo, qué decirle,
   perfil ideal, argumentos de venta.
   ============================================================ */

var ScreenEducacion = (function () {

  var SERIE_REF = 'A';
  var abierto = 'horizonte';

  /* ═══ Evidencia ═══ */

  function fila(nombre, valor, ratio, color) {
    var w = Math.max(2, Math.round((ratio || 0) * 100));
    return '<div class="ev-row">' +
             '<span class="ev-row-k">' + Fmt.esc(nombre) + '</span>' +
             '<span class="ev-row-v">' + valor + '</span>' +
             '<span class="ev-bar" aria-hidden="true">' +
               '<span style="width:' + w + '%;background:' + (color || 'var(--navy)') + '"></span>' +
             '</span>' +
           '</div>';
  }

  function nota(txt) {
    return '<p class="t-small t-3" style="margin-top:var(--s3)">' + Fmt.esc(txt) + '</p>';
  }

  var EV = {

    horizontes: function () {
      return '<div class="edu-evidence">' + HORIZON_ORDER.map(function (id) {
        var h = HORIZON_CONFIG[id];
        var series = h.series.map(function (s) { return SERIES_CONFIG[s].label; }).join(' · ');
        return '<div class="ev-row" style="grid-template-columns:minmax(0,1fr) auto">' +
                 '<span class="ev-row-k"><b>' + Fmt.esc(h.nombre) + '</b> · ' +
                   Fmt.esc(h.referencia) + '</span>' +
                 '<span class="t-small t-2">' + Fmt.esc(series) + '</span>' +
               '</div>';
      }).join('') + '</div>';
    },

    dispersion: function () {
      var a = Data.volatilityAnchors(SERIE_REF);
      if (!a.min || !a.max) return '';
      return '<div class="edu-evidence">' +
        fila(a.min.nombre, Fmt.num(a.min.v, 2), a.min.v / a.max.v, 'var(--vol-1)') +
        fila(a.max.nombre, Fmt.num(a.max.v, 2), 1, 'var(--vol-5)') +
      '</div>' +
      nota('Volatilidad en ' + SERIES_CONFIG[SERIE_REF].label + ' al ' + DATA_META.date +
           '. Entre ambos extremos se ordenan los demás fondos disponibles.');
    },

    escalera: function () {
      var ids = CONCEPT_EVIDENCE.escalera;
      var vals = ids.map(function (id) {
        var r = Data.returns(SERIE_REF, id);
        return r ? r.ultimoAno : 0;
      });
      var max = Math.max.apply(null, vals) || 1;
      return '<div class="edu-evidence">' + ids.map(function (id, i) {
        return fila(FUND_CATALOG[id].nombre, Fmt.pct(vals[i]), vals[i] / max, 'var(--navy)');
      }).join('') + '</div>' +
      nota('Último año en ' + SERIES_CONFIG[SERIE_REF].label + ' al ' + DATA_META.date +
           '. Las rentabilidades pasadas no garantizan rentabilidades futuras.');
    },

    volatilidad: function () {
      var a = Data.volatilityAnchors(SERIE_REF);
      var medio = 'cd_moderado';
      var rm = Data.returns(SERIE_REF, medio);
      var max = a.max.v || 1;
      var eu = Data.returns(SERIE_REF, 'lv_europa');

      return '<div class="edu-evidence">' +
        fila(a.min.nombre, Fmt.num(a.min.v, 2), a.min.v / max, 'var(--vol-1)') +
        fila(FUND_CATALOG[medio].nombre, Fmt.num(rm.volatilidad, 2), rm.volatilidad / max, 'var(--vol-3)') +
        fila(a.max.nombre, Fmt.num(a.max.v, 2), 1, 'var(--vol-5)') +
      '</div>' +
      '<p class="t-small t-2" style="margin-top:var(--s4);max-width:62ch">Mayor volatilidad ' +
        'no implica mayor rentabilidad. LV Europa registra volatilidad <b>' +
        Fmt.num(eu.volatilidad, 2) + '</b> y una rentabilidad del último año de <b>' +
        Fmt.pct(eu.ultimoAno) + '</b>, mientras que ' + Fmt.esc(FUND_CATALOG[medio].nombre) +
        ', con volatilidad <b>' + Fmt.num(rm.volatilidad, 2) + '</b>, registra <b>' +
        Fmt.pct(rm.ultimoAno) + '</b>.</p>';
    },

    liquidez: function () {
      var filas = SERIES_CONFIG.P.costoSalida.map(function (t) {
        var rango = t.hasta === null ? t.desde + '+ días' : t.desde + '–' + t.hasta + ' días';
        return '<div class="ev-row" style="grid-template-columns:minmax(0,1fr) auto">' +
                 '<span class="ev-row-k">' + Fmt.esc(rango) + '</span>' +
                 '<span class="ev-row-v">' + Fmt.esc(t.label) + '</span>' +
               '</div>';
      }).join('');
      return '<p class="t-body t-2"><b>Serie A:</b> ' +
               Fmt.esc(SERIES_CONFIG.A.costoSalidaNota) + '</p>' +
             '<p class="t-body t-2" style="margin-top:var(--s3)"><b>Serie P:</b> ' +
               Fmt.esc(SERIES_CONFIG.P.costoSalidaNota) + '</p>' +
             '<div class="edu-evidence">' + filas + '</div>';
    },

    geografia: function () {
      var datos = CONCEPT_EVIDENCE.geografia.map(function (id) {
        var r = Data.returns(SERIE_REF, id);
        return { nombre: FUND_CATALOG[id].nombre, v: r ? r.ultimoAno : 0 };
      });
      var max = Math.max.apply(null, datos.map(function (d) { return Math.abs(d.v); })) || 1;
      return '<div class="edu-evidence">' + datos.map(function (d) {
        return fila(d.nombre, Fmt.pct(d.v), Math.abs(d.v) / max, 'var(--vol-3)');
      }).join('') + '</div>' +
      nota('Mismo período, mismos doce meses, mercados distintos. Último año en ' +
           SERIES_CONFIG[SERIE_REF].label + ' al ' + DATA_META.date + '.');
    },

    uf: function () {
      return '<div class="edu-evidence">' + CONCEPT_EVIDENCE.uf.map(function (id) {
        var f = FUND_CATALOG[id];
        return '<div class="ev-row" style="grid-template-columns:minmax(0,1fr) 90px 120px">' +
                 '<span class="ev-row-k">' + Fmt.esc(f.nombre) + '</span>' +
                 '<span class="ev-row-v">' + Fmt.num(f.pctUF, 2) + '%</span>' +
                 '<span class="t-small t-3">' + Fmt.dias(f.duration) + '</span>' +
               '</div>';
      }).join('') + '</div>' +
      nota('Exposición a UF y duration publicadas en el reporte al ' + DATA_META.date +
           '. Una mayor exposición a UF vincula el valor del fondo a la variación del IPC.');
    },

    compuesto: function () {
      var sup = SIMULATION_CONFIG.supuestoInicial;
      var capital = 1000000;
      var filas = [5, 10, 20, 30].map(function (a) {
        var r = Calc.proyectar(capital, 0, a, sup);
        return '<div class="ev-row" style="grid-template-columns:minmax(0,1fr) auto">' +
                 '<span class="ev-row-k">' + a + ' años</span>' +
                 '<span class="ev-row-v">' + Fmt.clp(r.final) + '</span>' +
               '</div>';
      }).join('');
      return '<p class="t-body t-2">' + Fmt.clp(capital) + ' sin aportes adicionales, con un ' +
               'supuesto de <b>' + Fmt.num(sup, 1) + '% anual</b>:</p>' +
             '<div class="edu-evidence">' + filas + '</div>' +
             nota('Supuesto ilustrativo editable. No proviene del reporte de rentabilidades ' +
                  'ni corresponde a ningún fondo en particular. El capital no se duplica al ' +
                  'doble de tiempo: el efecto se acelera.') +
             '<p style="margin-top:var(--s4)"><a class="link-arrow" href="#/simulador">' +
               'Probarlo en el simulador</a></p>';
    }
  };

  /* ═══ Vista ═══ */

  function cards(sel) {
    return CONCEPT_ORDER.map(function (id) {
      var c = CONCEPT_CONFIG[id];
      return '<button type="button" class="card-sel' + (id === sel ? ' is-active' : '') + '" ' +
               'data-concepto="' + id + '" aria-pressed="' + (id === sel) + '">' +
               '<div class="card-t">' + Fmt.esc(c.nombre) + '</div>' +
             '</button>';
    }).join('');
  }

  function detalle(id) {
    var c = CONCEPT_CONFIG[id];
    var ev = EV[c.evidencia] ? EV[c.evidencia]() : '';

    return '<div class="detail" id="edu-detail">' +
      '<div class="detail-grid">' +

        '<div>' +
          '<div class="card-k">Concepto</div>' +
          '<div class="detail-h">' + Fmt.esc(c.nombre) + '</div>' +
          '<p class="t-read detail-lead">' + Fmt.esc(c.definicion) + '</p>' +
          '<div class="detail-sec">' +
            '<div class="t-label">Relación con la Ruta</div>' +
            '<p class="t-body t-2" style="margin-top:var(--s2);max-width:58ch">' +
              Fmt.esc(c.ruta) + '</p>' +
            '<p class="t-small t-3" style="margin-top:var(--s3)">Objetivo → Horizonte → ' +
              'Solución</p>' +
          '</div>' +
        '</div>' +

        '<div>' +
          '<div class="t-label">Evidencia con nuestros fondos</div>' +
          '<div style="margin-top:var(--s3)">' + ev + '</div>' +
        '</div>' +

      '</div>' +
    '</div>';
  }

  function render(outlet, params) {
    if (params && params[0] && CONCEPT_CONFIG[params[0]]) abierto = params[0];

    outlet.innerHTML =
      '<div class="page">' +
        '<span class="t-eyebrow">Educación financiera</span>' +
        '<h1 class="t-h1 head--wide">Conceptos para comprender una inversión</h1>' +
        '<p class="t-read head-lead">Selecciona un concepto para ver su definición y cómo ' +
          'se observa en nuestros fondos al ' + Fmt.esc(DATA_META.date) + '.</p>' +

        '<div class="cards cards--4" id="edu-cards">' + cards(abierto) + '</div>' +

        detalle(abierto) +

        '<p class="note">' + Fmt.esc(DATA_META.disclaimer) + '</p>' +

        '<div class="next">' +
          '<a href="#/fondos">' +
            '<span class="next-k">Continuar</span>' +
            '<span class="next-t">Fondos y Rentabilidades</span>' +
            '<span class="next-d">Ver estos conceptos aplicados a cada alternativa</span>' +
          '</a>' +
        '</div>' +
      '</div>';

    bind(outlet);
  }

  function bind(outlet) {
    outlet.querySelectorAll('[data-concepto]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        abierto = btn.getAttribute('data-concepto');
        outlet.querySelector('#edu-cards').innerHTML = cards(abierto);
        Fmt.swap(outlet.querySelector('#edu-detail'), detalle(abierto));
        bind(outlet);
      });
    });
  }

  return { render: render };
})();


/* ═══════════════ modules/simulador.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Simulador de Inversión
   ------------------------------------------------------------
   Separación entre CONFIGURACIÓN (lo que el usuario ingresa) y
   SIMULACIÓN GENERADA (resultado confirmado por una acción).

   El simulador NO calcula ni persiste al entrar a la pantalla.
   Sólo al presionar "Generar simulación" o "Actualizar
   simulación". Si la configuración cambia después de generar,
   el resultado anterior se conserva marcado como desactualizado,
   para que una cifra parcial no se lea como resultado final.
   ============================================================ */

var ScreenSimulador = (function () {

  var CFG = null;        /* configuración en pantalla */
  var RES = null;        /* resultado generado (o null) */
  var dirty = false;     /* hay cambios sin simular */
  var generando = false;

  function init() {
    var g = AppState.get('simulacion');
    var d = SIMULATION_CONFIG.defaults;
    var esc = SIMULATION_CONFIG.escenarios;

    CFG = {
      capital: g ? g.capital : d.capital,
      aporte:  g ? g.aporte  : d.aporte,
      anios:   g ? g.anios   : d.anios,
      supuesto: g ? g.supuesto : SIMULATION_CONFIG.supuestoInicial,
      usandoHistorico: g ? !!g.usandoHistorico : false,
      conservador: esc[0].supuesto,
      intermedio:  esc[1].supuesto
    };

    /* Una simulación previa se conserva sólo si fue generada */
    RES = (g && g.generadaEn && g.final > 0) ? {
      aportado: g.aportado, final: g.final, crecimiento: g.crecimiento,
      anios: g.anios, supuesto: g.supuesto,
      usandoHistorico: !!g.usandoHistorico,
      serie: g.serie, fondoId: g.fondoId,
      capital: g.capital, aporte: g.aporte,
      generadaEn: g.generadaEn,
      serieDatos: null
    } : null;

    if (RES) RES.serieDatos = Calc.proyectar(RES.capital, RES.aporte, RES.anios, RES.supuesto).serie;
    dirty = false;
  }

  function reset() { CFG = null; RES = null; dirty = false; }

  /* Permite que otro módulo (Brecha) traspase configuración sin
     generar un resultado: la simulación sigue exigiendo su acción. */
  function seed(cfg) {
    if (!CFG) init();
    Object.keys(cfg).forEach(function (k) { CFG[k] = cfg[k]; });
    CFG.usandoHistorico = false;
    if (RES) dirty = true;
  }

  function serieActiva() {
    var s = AppState.get('serie');
    return (s && SERIES_CONFIG[s]) ? s : 'A';
  }

  /* El fondo sólo alimenta la REFERENCIA HISTÓRICA. La simulación
     funciona sin fondo, con un supuesto manual. Nunca se toma el
     primero de la lista: eso haría parecer elegido algo que el
     usuario no eligió. */
  function fondoActivo(serie) {
    var f = AppState.get('fondoId');
    if (f && FUND_CATALOG[f] && FUND_CATALOG[f].series.indexOf(serie) !== -1) return f;
    return null;
  }

  /* ═══ Generación ═══ */

  function generar(outlet) {
    var serie = serieActiva();
    var fondoId = fondoActivo(serie);
    var p = Calc.proyectar(CFG.capital, CFG.aporte, CFG.anios, CFG.supuesto);

    RES = {
      capital: CFG.capital, aporte: CFG.aporte, anios: CFG.anios,
      supuesto: CFG.supuesto, usandoHistorico: CFG.usandoHistorico,
      serie: serie, fondoId: fondoId,
      aportado: p.aportado, final: p.final, crecimiento: p.crecimiento,
      pctCrecimiento: p.pctCrecimiento,
      serieDatos: p.serie,
      generadaEn: new Date().toISOString()
    };
    dirty = false;

    /* Si la simulación se abrió desde una capa de Estrategia, se
       guarda también allí, además del comportamiento normal. */
    var foco = AppState.get('estrategiaFoco');
    if (foco && AppState.capa(foco)) {
      AppState.setCapa(foco, {
        fondoId: RES.fondoId,
        simulacion: {
          capital: RES.capital, aporte: RES.aporte, anios: RES.anios,
          supuesto: RES.supuesto, aportado: RES.aportado,
          crecimiento: RES.crecimiento, final: RES.final,
          generadaEn: RES.generadaEn
        }
      });
    }

    /* Persistencia sólo aquí */
    AppState.set({
      simulacion: {
        capital: RES.capital, aporte: RES.aporte, anios: RES.anios,
        serie: RES.serie, fondoId: RES.fondoId,
        supuesto: RES.supuesto, usandoHistorico: RES.usandoHistorico,
        aportado: RES.aportado, crecimiento: RES.crecimiento, final: RES.final,
        generadaEn: RES.generadaEn
      }
    });

    render(outlet);
  }

  function marcarSucio(outlet) {
    if (RES && !dirty) { dirty = true; render(outlet); }
  }

  /* ═══ Fragmentos ═══ */

  function panelReferencia(serie, fondoId) {
    if (!fondoId) {
      return '<div class="panel-ref">' +
        '<div class="panel-k">Referencia histórica</div>' +
        '<p class="t-small t-2" style="margin-top:var(--s4);max-width:52ch">No se ha ' +
          'seleccionado un fondo. Puedes generar una simulación mediante un supuesto manual ' +
          'o seleccionar un fondo para consultar su referencia histórica.</p>' +
      '</div>';
    }
    var f = FUND_CATALOG[fondoId];
    var r = Data.returns(serie, fondoId);

    return '<div class="panel-ref">' +
      '<div class="panel-k">Referencia histórica · no es una proyección</div>' +
      '<div class="ref-grid">' +
        '<div><div class="ref-k">Fondo</div><div class="ref-v">' + Fmt.esc(f.nombre) + '</div></div>' +
        '<div><div class="ref-k">Último año</div><div class="ref-v big num">' + Fmt.pct(r.ultimoAno) + '</div></div>' +
        '<div><div class="ref-k">Volatilidad</div><div class="ref-v big num">' + Volatility.figure(serie, fondoId) + '</div></div>' +
      '</div>' +
      '<p class="t-small t-3" style="margin-top:var(--s4)">Datos al ' + Fmt.esc(DATA_META.date) + '</p>' +
      '<p style="margin-top:var(--s4)">' +
        '<button type="button" class="link-arrow" id="btn-hist">Usar referencia histórica</button>' +
      '</p>' +
    '</div>';
  }

  function panelSupuesto() {
    var aviso = CFG.usandoHistorico
      ? '<p class="aviso">' + Fmt.esc(SIMULATION_CONFIG.avisos.historico) + '</p>'
      : '<p class="t-small t-3" style="margin-top:var(--s4)">' +
        Fmt.esc(SIMULATION_CONFIG.avisos.supuestoInicial) + '</p>';

    return '<div class="panel-sup">' +
      '<div class="panel-k">Supuesto de simulación</div>' +
      '<div class="scen-in" style="margin-top:var(--s5)">' +
        '<input type="number" id="sup-sel" step="0.1" inputmode="decimal" ' +
          'min="' + SIMULATION_CONFIG.limites.supuestoMin + '" ' +
          'max="' + SIMULATION_CONFIG.limites.supuestoMax + '" ' +
          'value="' + CFG.supuesto + '" aria-label="Rentabilidad anual supuesta">' +
        '<span>% anual</span>' +
      '</div>' + aviso +
    '</div>';
  }

  function barraAccion() {
    if (!RES) {
      return '<div class="act-bar">' +
        '<button type="button" class="btn btn--primary" id="btn-gen">' +
          (generando ? 'Generando…' : 'Generar simulación') + '</button>' +
        '<span class="t-small t-3">Los resultados se muestran al generar la simulación.</span>' +
      '</div>';
    }
    if (dirty) {
      return '<div class="act-bar act-bar--dirty">' +
        '<button type="button" class="btn btn--primary" id="btn-gen">' +
          (generando ? 'Actualizando…' : 'Actualizar simulación') + '</button>' +
        '<span class="dirty-tag">Hay cambios sin simular.</span>' +
      '</div>';
    }
    return '<div class="act-bar">' +
      '<button type="button" class="btn btn--secondary" id="btn-gen">' +
        (generando ? 'Actualizando…' : 'Volver a generar') + '</button>' +
      '<span class="t-small t-3">Simulación generada con la configuración actual.</span>' +
    '</div>';
  }

  function resultado() {
    if (!RES) {
      return '<div class="empty-res">' +
        '<div class="t-label">Resultado de la simulación</div>' +
        '<p class="t-read t-2" style="margin-top:var(--s3);max-width:52ch">' +
          'Define la configuración y genera la simulación para ver la proyección.</p>' +
      '</div>';
    }

    var hist = RES.usandoHistorico
      ? '<p class="aviso">Referencia histórica utilizada como supuesto. ' +
        Fmt.esc(SIMULATION_CONFIG.avisos.historico) + '</p>'
      : '';

    var desac = dirty
      ? '<p class="aviso">Este resultado corresponde a la configuración anterior. ' +
        'Actualiza la simulación para reflejar los cambios.</p>'
      : '';

    return '<div class="res-main' + (dirty ? ' is-stale' : '') + '">' +
      '<div class="t-label">Resultado de la simulación</div>' +
      '<div class="res-big num">' + Fmt.clp(RES.final) + '</div>' +
      '<div class="res-cap">Capital proyectado</div>' +

      '<div class="res-metrics">' +
        '<div><div class="ref-k">Capital aportado</div>' +
          '<div class="res-m num">' + Fmt.clp(RES.aportado) + '</div></div>' +
        '<div><div class="ref-k">Crecimiento estimado</div>' +
          '<div class="res-m num">' + Fmt.clp(RES.crecimiento) + '</div></div>' +
        '<div><div class="ref-k">Horizonte</div>' +
          '<div class="res-m num">' + RES.anios + (RES.anios === 1 ? ' año' : ' años') + '</div></div>' +
      '</div>' +

      '<p class="t-small t-2" style="margin-top:var(--s5)">Supuesto utilizado: <b>' +
        Fmt.num(RES.supuesto, 1) + '% anual</b></p>' +
      hist + desac +
    '</div>';
  }

  function sensibilidad() {
    if (!RES) return '';

    var defs = [
      { id:'conservador', n:'Conservador', s:CFG.conservador, color:'var(--vol-2)' },
      { id:'intermedio',  n:'Intermedio',  s:CFG.intermedio,  color:'var(--vol-3)' },
      { id:'seleccionado',n:'Supuesto utilizado', s:RES.supuesto, color:'var(--navy)' }
    ];

    var cards = defs.map(function (d) {
      var p = Calc.proyectar(RES.capital, RES.aporte, RES.anios, d.s);
      var editable = d.id !== 'seleccionado';
      return '<div class="sens" style="border-top-color:' + d.color + '">' +
        '<div class="sens-n">' + Fmt.esc(d.n) + '</div>' +
        '<div class="scen-in">' +
          '<input type="number" step="0.1" inputmode="decimal" ' +
            'data-sens="' + d.id + '" value="' + d.s + '"' +
            (editable ? '' : ' disabled') + ' aria-label="Supuesto ' + Fmt.esc(d.n) + '">' +
          '<span>%</span>' +
        '</div>' +
        '<div class="sens-v num">' + Fmt.clp(p.final) + '</div>' +
        '<div class="t-small t-3">Capital proyectado</div>' +
      '</div>';
    }).join('');

    return '<div class="section section--rule">' +
      '<h2 class="t-h2">Sensibilidad a distintos supuestos</h2>' +
      '<p class="t-small t-2" style="margin-top:var(--s2);max-width:58ch">Cómo cambia el ' +
        'capital proyectado al variar únicamente el supuesto de rentabilidad. ' +
        Fmt.esc(SIMULATION_CONFIG.etiqueta) + '.</p>' +
      '<div class="sens-grid">' + cards + '</div>' +
    '</div>';
  }

  function grafico() {
    if (!RES) return '';

    var series = [{
      nombre: 'Capital proyectado',
      puntos: RES.serieDatos,
      color: 'var(--navy)',
      dash: null
    }];

    [{ s: CFG.conservador, c:'var(--vol-2)' }, { s: CFG.intermedio, c:'var(--vol-3)' }]
      .forEach(function (x) {
        series.push({
          nombre: 'Escenario',
          puntos: Calc.proyectar(RES.capital, RES.aporte, RES.anios, x.s).serie,
          color: x.c,
          dash: '4 5',
          discreta: true
        });
      });

    return '<div class="section">' +
      '<h2 class="t-h2">Evolución estimada del capital</h2>' +
      '<div class="chart-wrap">' +
        '<div class="chart-legend">' +
          '<span><i style="background:var(--border);height:10px;border:1px solid var(--border-strong)"></i>Aportes realizados</span>' +
          '<span><i style="background:var(--navy)"></i>Capital proyectado</span>' +
          '<span><i style="background:var(--vol-3)"></i>Otros supuestos</span>' +
        '</div>' +
        Chart.proyeccion(series, RES.serieDatos) +
      '</div>' +
      '<p class="t-small t-2" style="margin-top:var(--s4);max-width:70ch">Del capital ' +
        'proyectado, <b>' + Fmt.clp(RES.aportado) + '</b> corresponden a aportes y <b>' +
        Fmt.clp(RES.crecimiento) + '</b> al crecimiento estimado bajo el supuesto ' +
        'utilizado.</p>' +
    '</div>';
  }

  function cta() {
    if (RES) {
      return RouteCheckpoint.html({
        items: [
          { k: 'Capital proyectado', v: Fmt.clp(RES.final) },
          { k: 'Horizonte',          v: RES.anios + (RES.anios === 1 ? ' año' : ' años') },
          { k: 'Supuesto',           v: Fmt.num(RES.supuesto, 1) + '% anual' }
        ],
        mensaje: 'Simulación generada.',
        acciones: [
          { label: 'Continuar a Tributario →', href: '#/tributario', primary: true },
          { label: 'Finalizar Ruta', href: '#/ruta' }
        ]
      });
    }

    return RouteCheckpoint.html({
      items: [{ k: 'Simulación', v: null }],
      mensaje: 'Aún no has generado una simulación. Puedes hacerlo ahora o continuar sin ' +
               'simulación.',
      acciones: [
        { label: 'Generar simulación', id: 'cp-generar' },
        { label: 'Continuar sin simular →', href: '#/tributario' }
      ]
    });
  }

  /* Indica que la simulación pertenece a una capa de Estrategia */
  function focoHTML() {
    var foco = AppState.get('estrategiaFoco');
    if (!foco || !STRATEGY_LAYERS[foco] || !AppState.capa(foco)) return '';
    return '<p class="aviso" style="border-left-color:var(--navy)">Simulando la capa <b>' +
      Fmt.esc(STRATEGY_LAYERS[foco].resumenK) + '</b> de tu estrategia. El resultado se ' +
      'guardará también en esa capa. <button type="button" class="link-arrow" ' +
      'id="foco-salir" style="margin-left:var(--s3)">Salir de la capa</button></p>';
  }

  /* ═══ Render ═══ */

  function render(outlet) {
    if (!CFG) init();

    var serie = serieActiva();
    var fondoId = fondoActivo(serie);
    var f = fondoId ? FUND_CATALOG[fondoId] : null;

    var avisos = '';
    if (serie === 'P') {
      var t = Calc.tramoSalida(CFG.anios);
      avisos += '<p class="aviso">Serie P · con un horizonte de ' + CFG.anios +
        (CFG.anios === 1 ? ' año' : ' años') + ' (' + Fmt.num(t.dias, 0) + ' días), el tramo ' +
        'de costo de salida aplicable es ' + Fmt.esc(t.tramo.label) +
        (t.tramo.nota ? ' ' + t.tramo.nota : '') + '.</p>';
    }
    if (serie === 'F' && CFG.anios < 5) {
      avisos += '<p class="aviso">' + Fmt.esc(SIMULATION_CONFIG.avisos.serieF) + '</p>';
    }
    if (f && f.moneda === 'USD') {
      avisos += '<p class="aviso">' + Fmt.esc(SIMULATION_CONFIG.avisos.usd) + '</p>';
    }

    var fondos = '<option value=""' + (fondoId ? '' : ' selected') + '>Selecciona un fondo</option>' +
      Data.fundsBySeries(serie).map(function (x) {
        return '<option value="' + x.id + '"' + (x.id === fondoId ? ' selected' : '') + '>' +
               Fmt.esc(x.nombre) + '</option>';
      }).join('');
    var series = SERIES_ORDER.map(function (s) {
      return '<option value="' + s + '"' + (s === serie ? ' selected' : '') + '>' +
             Fmt.esc(SERIES_CONFIG[s].label) + '</option>';
    }).join('');

    outlet.innerHTML =
      '<div class="page">' +
        '<span class="t-eyebrow">Simulador</span>' +
        '<h1 class="t-h1 head--wide">Proyecta el crecimiento de una inversión</h1>' +
        '<p class="t-read head-lead">Define el capital, los aportes, el plazo y un supuesto ' +
          'de rentabilidad para visualizar una proyección.</p>' +
        focoHTML() +

        /* El orden en móvil (capital · aporte · horizonte · serie ·
           fondo · supuesto) se resuelve con `order` en mobile.css;
           aquí las clases f-* identifican cada campo. */
        '<div class="section sim-config">' +
          '<div class="t-label">Configuración</div>' +
          '<div class="fields" style="margin-top:var(--s5)">' +
            '<div class="field f-cap"><label for="in-cap">Capital inicial</label>' +
              '<input type="text" id="in-cap" inputmode="numeric" value="' +
                Number(CFG.capital).toLocaleString('es-CL') + '">' +
              '<span class="field-hint">Pesos chilenos</span></div>' +
            '<div class="field f-ap"><label for="in-ap">Aporte mensual</label>' +
              '<input type="text" id="in-ap" inputmode="numeric" value="' +
                Number(CFG.aporte).toLocaleString('es-CL') + '">' +
              '<span class="field-hint">Opcional</span></div>' +
            '<div class="field f-serie"><label for="in-serie">Serie</label>' +
              '<select id="in-serie">' + series + '</select>' +
              '<span class="field-hint">Determina los fondos disponibles</span></div>' +
            '<div class="field f-fondo"><label for="in-fondo">Fondo</label>' +
              '<select id="in-fondo">' + fondos + '</select>' +
              '<span class="field-hint">Opcional · sólo para la referencia histórica</span></div>' +
          '</div>' +

          '<div class="field f-anios" style="margin-top:var(--s7);max-width:520px">' +
            '<label for="in-anios">Horizonte · <span class="num">' + CFG.anios +
              (CFG.anios === 1 ? ' año' : ' años') + '</span></label>' +
            '<input type="range" id="in-anios" min="' + SIMULATION_CONFIG.limites.aniosMin +
              '" max="' + SIMULATION_CONFIG.limites.aniosMax + '" value="' + CFG.anios + '">' +
          '</div>' +
        '</div>' +

        '<div class="sim-panels">' + panelReferencia(serie, fondoId) + panelSupuesto() + '</div>' +

        avisos +
        barraAccion() +
        resultado() +
        sensibilidad() +
        grafico() +
        cta() +

        '<p class="note">' + Fmt.esc(SIMULATION_CONFIG.avisos.general) + '</p>' +
      '</div>';

    bind(outlet, serie, fondoId);

    /* El gráfico se comprueba una vez insertado en el DOM. */
    if (RES) Chart.verify(outlet);
  }

  function bind(outlet, serie, fondoId) {
    function num(el) { return parseInt(String(el.value).replace(/\D/g, ''), 10) || 0; }

    ['in-cap', 'in-ap'].forEach(function (id) {
      var el = outlet.querySelector('#' + id);
      el.addEventListener('input', function () {
        var v = num(el);
        el.value = v ? v.toLocaleString('es-CL') : '';
        if (id === 'in-cap') CFG.capital = v; else CFG.aporte = v;
      });
      el.addEventListener('change', function () {
        setTimeout(function () { marcarSucio(outlet); }, 0);
      });
    });

    var anios = outlet.querySelector('#in-anios');
    anios.addEventListener('input', function () {
      CFG.anios = parseInt(anios.value, 10);
      var lbl = outlet.querySelector('label[for="in-anios"] .num');
      if (lbl) lbl.textContent = CFG.anios + (CFG.anios === 1 ? ' año' : ' años');
    });
    anios.addEventListener('change', function () { marcarSucio(outlet); });

    outlet.querySelector('#in-serie').addEventListener('change', function (e) {
      var s = e.target.value;
      AppState.set({ serie: s, vehiculo: SERIES_CONFIG[s].vehiculo });
      CFG.usandoHistorico = false;
      dirty = !!RES;
      render(outlet);
    });

    outlet.querySelector('#in-fondo').addEventListener('change', function (e) {
      AppState.set({ fondoId: e.target.value || null });
      CFG.usandoHistorico = false;
      dirty = !!RES;
      render(outlet);
    });

    var sup = outlet.querySelector('#sup-sel');
    sup.addEventListener('change', function () {
      CFG.supuesto = parseFloat(sup.value) || 0;
      CFG.usandoHistorico = false;
      setTimeout(function () {
        if (RES) { dirty = true; }
        render(outlet);
      }, 0);
    });

    outlet.querySelectorAll('[data-sens]').forEach(function (el) {
      el.addEventListener('change', function () {
        var id = el.getAttribute('data-sens');
        CFG[id] = parseFloat(el.value) || 0;
        setTimeout(function () { render(outlet); }, 0);
      });
    });

    var hist = outlet.querySelector('#btn-hist');
    if (hist) {
      hist.addEventListener('click', function () {
        var r = Data.returns(serie, fondoId);
        if (!r) return;
        CFG.supuesto = r.ultimoAno;
        CFG.usandoHistorico = true;
        if (RES) dirty = true;
        render(outlet);
      });
    }

    var salir = outlet.querySelector('#foco-salir');
    if (salir) {
      salir.addEventListener('click', function () {
        AppState.set({ estrategiaFoco: null });
        render(outlet);
      });
    }

    var cpGen = outlet.querySelector('#cp-generar');
    if (cpGen) {
      cpGen.addEventListener('click', function () {
        var b = outlet.querySelector('#btn-gen');
        if (b) {
          b.scrollIntoView({ block: 'center',
            behavior: (window.matchMedia &&
              window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth' });
          b.click();
        }
      });
    }

    var gen = outlet.querySelector('#btn-gen');
    if (gen) {
      gen.addEventListener('click', function () {
        if (generando) return;
        generando = true;
        gen.textContent = RES ? 'Actualizando…' : 'Generando…';
        gen.disabled = true;
        /* Microinteracción breve: comunica que el resultado se
           produjo a partir de los inputs. No simula proceso pesado. */
        setTimeout(function () {
          generando = false;
          generar(outlet);
        }, 260);
      });
    }
  }

  return { render: render, reset: reset, seed: seed };
})();


/* ═══════════════ modules/brecha.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Brecha Previsional
   ------------------------------------------------------------
   No se asume tasa de reemplazo. No se calcula la pensión.
   Todas las variables son ingresadas.

   El cálculo requiere una acción explícita: mientras se escribe
   no se presenta un resultado definitivo, y si los datos cambian
   después de calcular, el resultado anterior queda marcado como
   desactualizado.
   ============================================================ */

var ScreenBrecha = (function () {

  var B = null;       /* configuración en pantalla */
  var CALC = null;    /* resultado calculado */
  var dirty = false;
  var calculando = false;

  function reset() { B = null; CALC = null; dirty = false; }

  function init() {
    var g = AppState.get('brecha');
    var edad = AppState.get('edad');

    B = {
      ingresoActual:   g ? g.ingresoActual   : 1500000,
      ingresoDeseado:  g ? g.ingresoDeseado  : 1200000,
      pensionEstimada: g ? g.pensionEstimada : 450000,
      anios:           g ? g.anios : (edad ? Math.max(1, 65 - edad) : 20),
      aporteApv:       g ? g.aporteApv : 0
    };

    /* Sólo se restaura si fue calculada explícitamente */
    CALC = (g && g.calculadaEn)
      ? Calc.brecha(g.ingresoDeseado, g.pensionEstimada, g.anios)
      : null;
    dirty = false;
  }

  function calcular(outlet) {
    CALC = Calc.brecha(B.ingresoDeseado, B.pensionEstimada, B.anios);
    dirty = false;

    AppState.set({
      brecha: {
        ingresoActual: B.ingresoActual,
        ingresoDeseado: B.ingresoDeseado,
        pensionEstimada: B.pensionEstimada,
        anios: B.anios,
        aporteApv: B.aporteApv,
        mensual: CALC.mensual,
        totalNominal: CALC.totalNominal,
        calculadaEn: new Date().toISOString()
      }
    });

    render(outlet);
  }

  function marcarSucio(outlet) {
    if (CALC && !dirty) { dirty = true; render(outlet); }
  }

  /* ═══ Fragmentos ═══ */

  function campo(id, label, valor, hint) {
    return '<div class="field">' +
             '<label for="' + id + '">' + Fmt.esc(label) + '</label>' +
             '<input type="text" id="' + id + '" inputmode="numeric" value="' +
               Number(valor).toLocaleString('es-CL') + '">' +
             (hint ? '<span class="field-hint">' + Fmt.esc(hint) + '</span>' : '') +
           '</div>';
  }

  function configuracion() {
    return '<div class="section">' +
      '<div class="t-label">Configuración</div>' +
      '<div class="fields" style="margin-top:var(--s5)">' +
        campo('br-actual',  'Ingreso actual', B.ingresoActual, 'Mensual, referencial') +
        campo('br-deseado', 'Ingreso deseado en jubilación', B.ingresoDeseado, 'Mensual') +
        campo('br-pension', 'Pensión estimada', B.pensionEstimada, 'Dato ingresado') +
        campo('br-apv',     'Aporte APV mensual', B.aporteApv, 'Opcional') +
      '</div>' +
      '<div class="field f-anios" style="margin-top:var(--s7);max-width:520px">' +
        '<label for="br-anios">Años restantes hasta la jubilación · ' +
          '<span class="num">' + B.anios + '</span></label>' +
        '<input type="range" id="br-anios" min="1" max="45" value="' + B.anios + '">' +
      '</div>' +
    '</div>';
  }

  function barraAccion() {
    if (!CALC) {
      return '<div class="act-bar">' +
        '<button type="button" class="btn btn--primary" id="btn-calc">' +
          (calculando ? 'Calculando…' : 'Calcular brecha') + '</button>' +
        '<span class="t-small t-3">El resultado se muestra al calcular.</span>' +
      '</div>';
    }
    if (dirty) {
      return '<div class="act-bar act-bar--dirty">' +
        '<button type="button" class="btn btn--primary" id="btn-calc">' +
          (calculando ? 'Actualizando…' : 'Actualizar brecha') + '</button>' +
        '<span class="dirty-tag">Hay cambios sin calcular.</span>' +
      '</div>';
    }
    return '<div class="act-bar">' +
      '<button type="button" class="btn btn--secondary" id="btn-calc">' +
        (calculando ? 'Actualizando…' : 'Volver a calcular') + '</button>' +
      '<span class="t-small t-3">Brecha calculada con los datos actuales.</span>' +
    '</div>';
  }

  function resultado() {
    if (!CALC) {
      return '<div class="empty-res">' +
        '<div class="t-label">Brecha mensual estimada</div>' +
        '<p class="t-read t-2" style="margin-top:var(--s3);max-width:52ch">' +
          'Ingresa los datos y calcula la brecha para ver el resultado.</p>' +
      '</div>';
    }

    var r = CALC;
    var pctP = r.pctCubierto;
    var pctB = 100 - pctP;

    var desac = dirty
      ? '<p class="aviso">Este resultado corresponde a los datos anteriores. ' +
        'Actualiza la brecha para reflejar los cambios.</p>'
      : '';

    var proporcion = B.ingresoActual > 0
      ? '<p class="t-small t-3" style="margin-top:var(--s4)">El ingreso deseado equivale al ' +
        Fmt.num((B.ingresoDeseado / B.ingresoActual) * 100, 0) + '% del ingreso actual ' +
        'ingresado. La herramienta no aplica ninguna tasa de reemplazo.</p>'
      : '';

    return '<div class="res-main' + (dirty ? ' is-stale' : '') + '">' +
      '<div class="t-label">Brecha mensual estimada</div>' +
      '<div class="res-big num">' + Fmt.clp(r.mensual) + '</div>' +
      '<div class="res-cap">Diferencia entre el ingreso deseado y la pensión estimada</div>' +

      '<div class="gap-bar">' +
        '<div class="gap-track" role="img" aria-label="Composición del ingreso deseado">' +
          '<div class="gap-fill" style="width:' + pctP + '%"></div>' +
          '<div class="gap-rest" style="width:' + pctB + '%"></div>' +
        '</div>' +
        '<div class="gap-labels">' +
          '<span><b>Pensión estimada</b> · ' + Fmt.clp(r.pension) + ' (' + Fmt.num(pctP, 0) + '%)</span>' +
          '<span><b>Brecha</b> · ' + Fmt.clp(r.mensual) + ' (' + Fmt.num(pctB, 0) + '%)</span>' +
        '</div>' +
        '<p class="t-small t-3" style="margin-top:var(--s3)">Pensión estimada + Brecha = ' +
          'Ingreso objetivo de ' + Fmt.clp(r.deseado) + ' mensuales.</p>' +
      '</div>' +

      '<div class="res-metrics">' +
        '<div><div class="ref-k">Años restantes</div>' +
          '<div class="res-m num">' + r.anios + '</div></div>' +
        '<div><div class="ref-k">Brecha total del período</div>' +
          '<div class="res-m num">' + Fmt.clp(r.totalNominal) + '</div>' +
          '<div class="t-small t-3">Suma nominal, sin rentabilidad ni inflación</div></div>' +
      '</div>' +

      proporcion + desac +
    '</div>';
  }

  function checkpointHTML() {
    if (CALC) {
      return RouteCheckpoint.html({
        items: [
          { k: 'Brecha mensual', v: Fmt.clp(CALC.mensual) },
          { k: 'Años restantes', v: String(CALC.anios) }
        ],
        mensaje: 'Brecha previsional calculada.',
        acciones: [
          { label: 'Simular ahorro APV →', href: '#/simulador', id: 'br-sim-cp', primary: true },
          { label: 'Ver beneficios tributarios', href: '#/tributario' }
        ]
      });
    }
    return RouteCheckpoint.html({
      items: [{ k: 'Brecha previsional', v: null }],
      mensaje: 'La brecha previsional aún no ha sido calculada.',
      acciones: [
        { label: 'Calcular brecha', id: 'cp-calcular' },
        { label: 'Continuar sin calcular →', href: '#/simulador' }
      ]
    });
  }

  function cierre() {
    var anios = CALC ? CALC.anios : B.anios;
    return '<p class="note">La herramienta no proyecta pensiones ni sustituye la información ' +
        'oficial del sistema previsional. Las cifras dependen de los datos ingresados.</p>' +
      '<div class="next">' +
        '<a href="#/simulador" id="br-sim">' +
          '<span class="next-k">Continuar</span>' +
          '<span class="next-t">Simular ahorro APV</span>' +
          '<span class="next-d">Con el horizonte de ' + anios + ' años heredado de esta pantalla</span>' +
        '</a>' +
        '<a href="#/tributario">' +
          '<span class="next-k">Revisar</span>' +
          '<span class="next-t">Beneficios tributarios del APV</span>' +
          '<span class="next-d">Régimen A, Régimen B y Depósito Convenido</span>' +
        '</a>' +
      '</div>';
  }

  /* ═══ Render ═══ */

  function render(outlet) {
    if (!B) init();

    outlet.innerHTML =
      '<div class="page">' +
        '<span class="t-eyebrow">Jubilación</span>' +
        '<h1 class="t-h1 head--wide">Brecha previsional estimada</h1>' +
        '<p class="t-read head-lead">Compara el ingreso deseado con la pensión que se estime ' +
          'recibir. Todos los valores son ingresados por ti.</p>' +
        configuracion() +
        barraAccion() +
        resultado() +
        checkpointHTML() +
        cierre() +
      '</div>';

    bind(outlet);
  }

  function bind(outlet) {
    var map = {
      'br-actual': 'ingresoActual',
      'br-deseado': 'ingresoDeseado',
      'br-pension': 'pensionEstimada',
      'br-apv': 'aporteApv'
    };

    Object.keys(map).forEach(function (id) {
      var el = outlet.querySelector('#' + id);
      if (!el) return;
      el.addEventListener('input', function () {
        var v = parseInt(String(el.value).replace(/\D/g, ''), 10) || 0;
        el.value = v ? v.toLocaleString('es-CL') : '';
        B[map[id]] = v;
      });
      el.addEventListener('change', function () {
        setTimeout(function () { marcarSucio(outlet); }, 0);
      });
    });

    var anios = outlet.querySelector('#br-anios');
    if (anios) {
      anios.addEventListener('input', function () {
        B.anios = parseInt(anios.value, 10);
        var lbl = outlet.querySelector('label[for="br-anios"] .num');
        if (lbl) lbl.textContent = B.anios;
      });
      anios.addEventListener('change', function () { marcarSucio(outlet); });
    }

    var btn = outlet.querySelector('#btn-calc');
    if (btn) {
      btn.addEventListener('click', function () {
        if (calculando) return;
        calculando = true;
        btn.textContent = CALC ? 'Actualizando…' : 'Calculando…';
        btn.disabled = true;
        setTimeout(function () {
          calculando = false;
          calcular(outlet);
        }, 240);
      });
    }

    var cpCalc = outlet.querySelector('#cp-calcular');
    if (cpCalc) {
      cpCalc.addEventListener('click', function () {
        var x = outlet.querySelector('#btn-calc');
        if (x) { x.scrollIntoView({ block: 'center' }); x.click(); }
      });
    }

    outlet.querySelectorAll('#br-sim, #br-sim-cp').forEach(function (sim) {
      sim.addEventListener('click', function () {
        var serie = AppState.get('serie');
        if (!serie || SERIES_CONFIG[serie].vehiculo !== 'apv') serie = 'APV';

        AppState.set({
          serie: serie,
          vehiculo: 'apv',
          objetivo: 'jubilacion',
          horizonte: 'largo'
        });
        /* Se traspasa la configuración, no un resultado: el simulador
           exige su propia acción explícita para generar. */
        if (window.ScreenSimulador && ScreenSimulador.seed) {
          ScreenSimulador.seed({
            capital: 0,
            aporte: B.aporteApv || SIMULATION_CONFIG.defaults.aporte,
            anios: B.anios
          });
        }
      });
    });
  }

  return { render: render, reset: reset };
})();


/* ═══════════════ modules/tributario.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Beneficios Tributarios
   ------------------------------------------------------------
   Seis tarjetas comparables y un único detalle abierto a la vez.
   ============================================================ */

var ScreenTributario = (function () {

  var abierto = 'art57';
  /* Registro de lo consultado en la sesión. La consulta tributaria
     no es una decisión: no se exige seleccionar ningún régimen. */
  var revisados = {};

  function cards(sel, vehiculoCtx) {
    return TAX_ORDER.map(function (id) {
      var t = TAX_CONFIG[id];
      var c = t.card;
      var rel = vehiculoCtx && t.vehiculos.indexOf(vehiculoCtx) !== -1;

      return '<button type="button" class="card-sel' + (id === sel ? ' is-active' : '') + '" ' +
               'data-tax="' + id + '" aria-pressed="' + (id === sel) + '">' +
               '<div class="card-k">' + Fmt.esc(c.k) +
                 (rel ? ' · en tu ruta' : '') + '</div>' +
               '<div class="card-t">' + Fmt.esc(c.t) + '</div>' +
               '<div class="card-n">' + Fmt.esc(c.n) +
                 '<small>' + Fmt.esc(c.s) + '</small></div>' +
             '</button>';
    }).join('');
  }

  function stats(t) {
    if (!t.stats) return '';
    return '<div class="stat-row">' + t.stats.map(function (s) {
      return '<div>' +
               '<div class="stat-k">' + Fmt.esc(s.k) + '</div>' +
               '<div class="stat-v">' + Fmt.esc(s.v) + '</div>' +
               '<div class="stat-s">' + Fmt.esc(s.s) + '</div>' +
             '</div>';
    }).join('') + '</div>';
  }

  function timeline(t) {
    if (!t.timeline) return '';
    return '<div class="detail-sec">' +
             '<div class="t-label">Tratamiento vigente</div>' +
             '<div class="tl2">' + t.timeline.map(function (s) {
               return '<div class="tl2-seg" style="border-top-color:' + s.color + '">' +
                        '<div class="tl2-y">' + Fmt.esc(s.y) + '</div>' +
                        '<div class="tl2-v" style="color:' + s.color + '">' +
                          Fmt.esc(s.v) + '</div>' +
                        '<div class="tl2-d">' + Fmt.esc(s.d) + '</div>' +
                      '</div>';
             }).join('') + '</div>' +
           '</div>';
  }

  function lista(t) {
    if (!t.lista) return '';
    return '<div class="detail-sec">' +
             '<div class="t-label">' + Fmt.esc(t.lista.t) + '</div>' +
             '<ul class="ul-clean' + (t.lista.numerada ? ' ul-num' : '') + '">' +
               t.lista.items.map(function (i) {
                 return '<li>' + Fmt.esc(i) + '</li>';
               }).join('') +
             '</ul>' +
           '</div>';
  }

  function ejemplo(t) {
    if (!t.ejemplo) return '';
    return '<div class="detail-sec">' +
             '<div class="t-label">' + Fmt.esc(t.ejemplo.t) + '</div>' +
             '<div class="edu-evidence">' + t.ejemplo.filas.map(function (f) {
               return '<div class="ev-row" style="grid-template-columns:minmax(0,1fr) auto">' +
                        '<span class="ev-row-k">' + Fmt.esc(f.k) + '</span>' +
                        '<span class="ev-row-v">' + Fmt.esc(f.v) + '</span>' +
                      '</div>';
             }).join('') + '</div>' +
             '<p class="t-small t-3" style="margin-top:var(--s3)">' +
               Fmt.esc(t.ejemplo.nota) + '</p>' +
           '</div>';
  }

  /* Los bloques llevan marcado (<b>) definido en TAX_CONFIG.
     Es contenido propio del proyecto, no entrada de usuario. */
  function bloques(t) {
    if (!t.bloques) return '';
    return '<dl class="dl">' + t.bloques.map(function (b) {
      return '<dt>' + Fmt.esc(b.t) + '</dt><dd>' + b.d + '</dd>';
    }).join('') + '</dl>';
  }

  function detalle(id) {
    var t = TAX_CONFIG[id];

    return '<div class="detail" id="tax-detail">' +
      '<div class="detail-grid">' +

        '<div>' +
          '<div class="card-k">' + Fmt.esc(t.card.k) + '</div>' +
          '<div class="detail-h">' + Fmt.esc(t.nombre) + '</div>' +
          '<div class="detail-sub">' + Fmt.esc(t.sub) + '</div>' +
          '<p class="t-read detail-lead">' + Fmt.esc(t.lead) + '</p>' +
          stats(t) +
          timeline(t) +
        '</div>' +

        '<div>' +
          bloques(t) +
          ejemplo(t) +
          lista(t) +
          '<div class="detail-sec">' +
            '<div class="t-label">Base legal</div>' +
            '<p class="t-small t-2" style="margin-top:var(--s2)">' +
              Fmt.esc(t.baseLegal) + '</p>' +
            '<p class="t-small t-3" style="margin-top:var(--s2)">Fuente: ' +
              Fmt.esc(t.fuente) + '</p>' +
            '<p class="t-small t-3" style="margin-top:var(--s2)">Producto asociado: ' +
              Fmt.esc(t.producto) + '</p>' +
          '</div>' +
        '</div>' +

      '</div>' +
    '</div>';
  }

  function checkpointHTML() {
    var lista = TAX_ORDER.filter(function (id) { return revisados[id]; })
      .map(function (id) { return TAX_CONFIG[id].nombre; });

    return RouteCheckpoint.html({
      items: lista.length
        ? [{ k: 'Contenido revisado durante esta sesión', v: lista.join(' · ') }]
        : [],
      mensaje: lista.length
        ? null
        : 'Puedes revisar cualquier instrumento antes de continuar.',
      acciones: [
        { label: 'Finalizar Ruta →', href: '#/ruta', primary: true },
        { label: 'Brecha Previsional', href: '#/brecha' }
      ]
    });
  }

  function render(outlet) {
    var vehiculo = AppState.get('vehiculo');
    revisados[abierto] = true;
