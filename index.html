/* ═══════════════ styles/tokens.css ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Design tokens
   Apple + institucional financiero + editorial + alto nivel
   Principio: menos cajas, más jerarquía
   ============================================================ */

:root {

  /* ---- Superficies ---- */
  --bg:            #FFFFFF;
  --bg-soft:       #F7F9FC;
  --surface:       #FFFFFF;
  --surface-hover: #FAFBFD;
  --border:        #ECEFF4;
  --border-strong: #D8E0EA;

  /* ---- Texto ---- */
  --text-1: #0D1B2E;
  --text-2: #56637A;
  --text-3: #9AA5B6;

  /* ---- Marca ---- */
  --navy:      #112240;
  --navy-soft: #F4F7FB;

  /* ---- Interacción ---- */
  --action:       #1D4ED8;
  --action-hover: #1739A8;

  /* ---- Semánticos ---- */
  --pos:     #15803D;
  --neg:     #C2372D;
  --pending: #9A6314;

  /* ---- Escala de volatilidad (barras y gráficos) ---- */
  --vol-1: #8A97AB;
  --vol-2: #5B9BC4;
  --vol-3: #2F5FA8;
  --vol-4: #3F8F68;
  --vol-5: #C0524A;

  /* ---- Espaciado ---- */
  /* V2 · escala comprimida ~30% en los tramos altos.
     Los tramos bajos (s1–s5) se mantienen: ahí el aire es legibilidad,
     no decoración. La reducción se concentra en s7–s11, que son los
     que generaban el scroll excesivo. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px;
  --s6:28px; --s7:36px; --s8:48px; --s9:64px; --s10:84px; --s11:104px;

  /* ---- Radios ---- */
  --r-control: 5px;
  --r-surface: 12px;
  --r-full:    9999px;

  /* ---- Sombras ---- */
  --sh-rest:  0 1px 2px rgba(13,27,46,.04);
  --sh-float: 0 6px 28px rgba(13,27,46,.10);

  /* ---- Layout ---- */
  --topbar-h:  56px;
  --ctx-h:     40px;
  --sidebar:   240px;
  --sidebar-c: 62px;
  --gutter:    var(--s8);
  --max-read:  680px;
  --max-wide:  1080px;

  /* ---- Tipografía ---- */
  --font: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  --fs-hero:    58px;
  --fs-display: 38px;
  --fs-h1:      32px;
  --fs-h2:      24px;
  --fs-h3:      17px;
  --fs-body:    15px;
  --fs-read:  17.5px;
  --fs-small:   13.5px;
  --fs-label:   11px;
  --fs-num:     16px;
  --fs-num-xl:  46px;
  --fs-num-lg:  30px;

  /* ---- Movimiento ---- */
  --t-fast: 150ms cubic-bezier(.2,.6,.3,1);
  --t-mid:  240ms cubic-bezier(.2,.6,.3,1);
}

@media (max-width: 1199px) { :root { --gutter: var(--s7); --fs-hero: 48px; } }
@media (max-width: 899px)  { :root { --gutter: var(--s5); --fs-hero: 38px; --fs-display: 30px; } }
@media (max-width: 599px)  {
  :root {
    --gutter: 22px;
    --fs-hero: 33px; --fs-display: 27px; --fs-h1: 25px; --fs-h2: 19px;
    --fs-num-xl: 34px; --fs-num-lg: 24px;
  }
}

@media (prefers-reduced-motion: reduce) {
  :root { --t-fast: 1ms; --t-mid: 1ms; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}


/* ═══════════════ styles/base.css ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Base
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.6;
  color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Jerarquía ---- */

h1,h2,h3 { font-weight: 600; letter-spacing:-.025em; line-height:1.15; }

.t-hero    { font-size:var(--fs-hero);    font-weight:700; letter-spacing:-.04em; line-height:1.02; }
.t-display { font-size:var(--fs-display); font-weight:700; letter-spacing:-.035em; line-height:1.08; }
.t-h1      { font-size:var(--fs-h1);      font-weight:700; letter-spacing:-.03em; line-height:1.1; }
.t-h2      { font-size:var(--fs-h2);      font-weight:600; letter-spacing:-.022em; }
.t-h3      { font-size:var(--fs-h3);      font-weight:600; letter-spacing:-.012em; }
.t-body    { font-size:var(--fs-body); }
.t-read    { font-size:var(--fs-read); line-height:1.7; }
.t-small   { font-size:var(--fs-small); }

.t-label {
  font-size:var(--fs-label); font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--text-3);
}
.t-eyebrow {
  display:block;
  font-size:var(--fs-label); font-weight:700;
  letter-spacing:.16em; text-transform:uppercase; color:var(--text-3);
  margin-bottom:var(--s4);
}

.t-2 { color:var(--text-2); }
.t-3 { color:var(--text-3); }
.t-navy { color:var(--navy); }

.num { font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }
.n-xl { font-size:var(--fs-num-xl); font-weight:700; letter-spacing:-.035em; color:var(--navy); }
.n-lg { font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em; color:var(--navy); }

.pos { color:var(--pos); }
.neg { color:var(--neg); }

a { color:var(--action); text-decoration:none; transition:color var(--t-fast); }
a:hover { color:var(--action-hover); }

:focus-visible { outline:2px solid var(--action); outline-offset:3px; border-radius:var(--r-control); }

button { font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, select { font-family:inherit; font-size:inherit; color:inherit; }

/* ---- Layout ---- */

#view { transition: opacity 100ms linear; }
#view.view-out { opacity: 0; }

.page {
  padding: var(--s7) var(--gutter) var(--s10);
  max-width: calc(var(--max-wide) + var(--gutter)*2);
  animation: enter 220ms cubic-bezier(.2,.6,.3,1) both;
}
.page--read { max-width: calc(var(--max-read) + var(--gutter)*2); }
.page--flush { padding-top: var(--s7); }

@keyframes enter {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:none; }
}

/* Cambio de detalle dentro de un módulo: más corto y sin desplazar
   la posición de scroll. */
@keyframes enter-detail {
  from { opacity:0; transform:translateY(5px); }
  to   { opacity:1; transform:none; }
}

/* Encabezado editorial de módulo */
.head { max-width: 30ch; }
.head--wide { max-width: 44ch; }
.head-lead { margin-top: var(--s4); max-width: 58ch; color: var(--text-2); }

.section { margin-top: var(--s7); }
.section--rule { padding-top: var(--s6); border-top: 1px solid var(--border-strong); }

.rule { height:1px; background:var(--border); border:0; }
.row { display:flex; align-items:center; gap:var(--s3); }
.wrap { flex-wrap:wrap; }
.hidden { display:none !important; }
/* El atributo `hidden` debe imponerse sobre el display que fije
   cualquier componente; si no, un elemento marcado como oculto
   sigue viéndose. */
[hidden] { display:none !important; }
.sr-only {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}


/* ═══════════════ styles/components.css ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Componentes
   ============================================================ */

/* ═══ LAYOUT CON SIDEBAR ═══ */

.shell { display:flex; min-height:100vh; }

.sb {
  position:fixed; top:0; left:0; bottom:0; z-index:120;
  width:var(--sidebar); flex:0 0 var(--sidebar);
  display:flex; flex-direction:column;
  background:var(--surface); border-right:1px solid var(--border);
  transition:width var(--t-mid), transform var(--t-mid);
}

.sb-brand { padding:var(--s5) var(--s4) var(--s4); }
.sb-brand a { display:flex; align-items:flex-start; gap:var(--s3); color:var(--navy); }
.iso { flex:0 0 auto; display:block; border-radius:7px; }
.sb-brand-tx { min-width:0; }
.sb-brand-t { display:block; font-size:12.5px; font-weight:800; letter-spacing:.04em; line-height:1.25; }
.sb-brand-s { display:block; font-size:9.5px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-3); margin-top:3px; line-height:1.45; }

.sb-nav { flex:1; overflow-y:auto; padding:var(--s2) 0 var(--s4); }
.sb-group { margin-bottom:var(--s4); }
.sb-gk {
  padding:0 var(--s5) var(--s2);
  font-size:9.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-3);
}
.sb-i {
  position:relative; display:flex; align-items:center; gap:var(--s3);
  width:calc(100% - var(--s3)); margin:1px var(--s2);
  padding:8px var(--s3); border-radius:7px;
  font-size:var(--fs-small); font-weight:500; color:var(--text-2);
  transition:background var(--t-fast), color var(--t-fast);
  white-space:nowrap; overflow:hidden;
}
.sb-i .ico { flex:0 0 18px; color:var(--text-3); transition:color var(--t-fast); }
.sb-i:hover { background:var(--bg-soft); color:var(--text-1); }
.sb-i:hover .ico { color:var(--text-2); }
.sb-i.is-active { background:var(--navy-soft); color:var(--navy); font-weight:700; }
.sb-i.is-active .ico { color:var(--navy); }
.sb-i.is-active::before {
  content:''; position:absolute; left:calc(var(--s3) * -1 + 2px); top:7px; bottom:7px;
  width:3px; border-radius:0 3px 3px 0; background:var(--navy);
}

.sb-foot { padding:var(--s3) var(--s4); border-top:1px solid var(--border); display:flex;
  align-items:center; justify-content:space-between; gap:var(--s2); }
.sb-reset { display:flex; align-items:center; gap:var(--s3); padding:6px var(--s2);
  border-radius:6px; font-size:var(--fs-small); color:var(--text-3);
  transition:color var(--t-fast), background var(--t-fast); }
.sb-reset .ico { flex:0 0 16px; }
.sb-reset:hover { color:var(--text-1); background:var(--bg-soft); }
.sb-collapse { color:var(--text-3); line-height:0; padding:var(--s2); border-radius:6px; }
.sb-collapse:hover { background:var(--bg-soft); color:var(--text-1); }
.sb-collapse svg { transition:transform var(--t-mid); }

/* Colapsado: sólo iconos, con title como etiqueta accesible */
body.sb-min .sb { width:var(--sidebar-c); }
body.sb-min .sb-brand-tx,
body.sb-min .sb-gk,
body.sb-min .sb-i span,
body.sb-min .sb-reset span,
body.sb-min .sb-prog { display:none; }
body.sb-min .sb-brand { padding:var(--s5) 0 var(--s4); }
body.sb-min .sb-brand a { justify-content:center; }
body.sb-min .sb-i { justify-content:center; gap:0; padding:9px 0; margin:1px var(--s2); width:auto; }
body.sb-min .sb-foot { justify-content:center; flex-direction:column; gap:var(--s1); }
body.sb-min .sb-reset { justify-content:center; }
body.sb-min .sb-collapse svg { transform:rotate(180deg); }
body.sb-min .main { margin-left:var(--sidebar-c); }

.main { flex:1; min-width:0; margin-left:var(--sidebar); transition:margin var(--t-mid); }

.topbar { display:none; }
.sb-scrim { display:none; }

@media (max-width:1023px){
  .sb { transform:translateX(-100%); box-shadow:var(--sh-float); }
  body.sb-open .sb { transform:none; }
  body.sb-min .sb { width:var(--sidebar); }
  .main, body.sb-min .main { margin-left:0; }

  .topbar {
    display:flex; align-items:center; gap:var(--s3);
    position:sticky; top:0; z-index:100; height:var(--topbar-h);
    padding:0 var(--gutter);
    background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--border);
  }
  .topbar .iso { border-radius:6px; }
  .topbar-t { font-size:12.5px; font-weight:800; letter-spacing:.04em; color:var(--navy); }
  .topbar button { color:var(--navy); line-height:0; padding:var(--s2); margin-left:-8px; }

  body.sb-open .sb-scrim {
    display:block; position:fixed; inset:0; z-index:110;
    background:rgba(13,27,46,.28); animation:enter var(--t-fast) both;
  }
  .sb-collapse { display:none; }
}

/* ═══ BARRA DE CONTEXTO ═══
   Solo valores, sin rótulos. Jerarquía por peso y color. */

.ctx {
  position:sticky; top:0; z-index:90; min-height:var(--ctx-h);
  display:flex; align-items:center; gap:var(--s4);
  padding:0 var(--gutter);
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid var(--border);
  font-size:var(--fs-small);
}
.ctx[hidden]{ display:none }
.ctx-items { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; min-width:0; }
.ctx-item { color:var(--text-2); font-weight:500; transition:color var(--t-fast); white-space:nowrap; }
.ctx-item:hover { color:var(--navy); }
.ctx-item:last-of-type { color:var(--navy); font-weight:700; }
.ctx-sep { color:var(--border-strong); }
.ctx-actions { margin-left:auto; display:flex; align-items:center; gap:var(--s4); white-space:nowrap; }
.ctx-actions button { font-size:var(--fs-small); font-weight:500; color:var(--action); transition:color var(--t-fast); }
.ctx-actions .ctx-reset { color:var(--text-3); }
.ctx-actions .ctx-reset:hover { color:var(--text-2); }

@media (max-width:1023px){ .ctx{ top:var(--topbar-h) } }
@media (max-width:1023px){
  /* Sólo se desplazan los valores. "Ver ruta" y "Nueva ruta" son
     acciones esenciales: deben quedar siempre alcanzables, no
     empujadas fuera del viewport por el scroll horizontal. */
  .ctx{ justify-content:flex-start; gap:var(--s3) }
  .ctx-items{
    flex:1 1 auto; min-width:0; flex-wrap:nowrap;
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none; -ms-overflow-style:none;
    -webkit-overflow-scrolling:touch;
  }
  .ctx-items::-webkit-scrollbar{ display:none }
  .ctx-actions{ flex:0 0 auto; margin-left:0 }
}

/* ═══ BOTONES Y ENLACES DE ACCIÓN ═══ */

.btn {
  display:inline-flex; align-items:center; gap:var(--s2);
  padding:14px 28px; border-radius:var(--r-control);
  font-size:var(--fs-body); font-weight:600;
  transition:background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.btn--primary { background:var(--navy); color:#fff; }
.btn--primary:hover { background:#0A1729; color:#fff; }
.btn--secondary { border:1px solid var(--border-strong); color:var(--navy); }
.btn--secondary:hover { border-color:var(--navy); color:var(--navy); }
.btn:active { transform:translateY(1px); }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

.link-arrow { font-weight:600; font-size:var(--fs-body); }
.link-arrow::after { content:' →'; transition:margin var(--t-fast); display:inline-block; }
.link-arrow:hover::after { margin-left:3px; }

.actions { display:flex; gap:var(--s5); flex-wrap:wrap; align-items:center; }

/* ═══ CONTROL SEGMENTADO ═══ */

.seg { display:inline-flex; align-items:center; gap:var(--s1); flex-wrap:wrap; }
.seg-label { font-size:var(--fs-label); font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); margin-right:var(--s3); }
.seg-btn {
  padding:8px 15px; border-radius:var(--r-control);
  font-size:var(--fs-small); font-weight:600; color:var(--text-2);
  transition:all var(--t-fast);
}
.seg-btn:hover { background:var(--bg-soft); color:var(--text-1); }
.seg-btn.is-active { background:var(--navy); color:#fff; }

/* ═══ CAMPOS ═══ */

.field { display:flex; flex-direction:column; gap:var(--s2); }
.field label { font-size:var(--fs-label); font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); }
.field input, .field select {
  width:100%; padding:12px 0; border:0; border-bottom:1px solid var(--border-strong);
  background:transparent; font-size:var(--fs-num-lg); font-weight:700;
  letter-spacing:-.02em; color:var(--navy);
  font-variant-numeric:tabular-nums; transition:border-color var(--t-fast);
}
.field select { font-size:var(--fs-h3); font-weight:600; letter-spacing:normal; }
.field input:focus, .field select:focus { outline:none; border-bottom-color:var(--navy); }
.field-hint { font-size:var(--fs-small); color:var(--text-3); }
.field-suffix { font-size:var(--fs-small); color:var(--text-3); }

.fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--s7) var(--s8); }

input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:2px; background:var(--border-strong); border:0; padding:0; margin:var(--s4) 0; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--navy); cursor:pointer; }
input[type=range]::-moz-range-thumb{ width:20px; height:20px; border:0; border-radius:50%; background:var(--navy); cursor:pointer; }

/* ═══ LISTA EDITORIAL SELECCIONABLE ═══ */

.choice-list { border-top:1px solid var(--border); }
.choice {
  display:flex; align-items:baseline; gap:var(--s5);
  width:100%; text-align:left;
  padding:var(--s5) var(--s3); border-bottom:1px solid var(--border);
  transition:background var(--t-fast), padding var(--t-fast);
}
.choice:hover { background:var(--bg-soft); padding-left:var(--s5); }
.choice.is-active { background:var(--navy-soft); }
.choice-mark { flex:0 0 14px; height:14px; border-radius:50%; border:1.5px solid var(--border-strong); align-self:center; transition:all var(--t-fast); }
.choice.is-active .choice-mark { border-color:var(--navy); background:var(--navy); box-shadow:inset 0 0 0 3px #fff; }
.choice-body { flex:1; min-width:0; }
.choice-t { font-size:var(--fs-h3); font-weight:600; letter-spacing:-.012em; }
.choice.is-active .choice-t { color:var(--navy); }
.choice-d { font-size:var(--fs-small); color:var(--text-2); margin-top:var(--s1); }
.choice-k { font-size:var(--fs-small); color:var(--text-3); white-space:nowrap; }

/* ═══ TABLAS ═══ */

.table-wrap { overflow-x:auto; }
table.tbl { width:100%; border-collapse:collapse; font-size:var(--fs-body); }
table.tbl th {
  font-size:var(--fs-label); font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-3); text-align:left; padding:var(--s3) var(--s3) var(--s3) 0;
  border-bottom:1px solid var(--border-strong); white-space:nowrap;
}
table.tbl td { padding:var(--s4) var(--s3) var(--s4) 0; border-bottom:1px solid var(--border); vertical-align:top; }
table.tbl tbody tr:last-child td { border-bottom:0; }
table.tbl th.n, table.tbl td.n { text-align:right; font-variant-numeric:tabular-nums; padding-right:0; }
table.tbl td.n { font-weight:600; font-size:var(--fs-num); white-space:nowrap; }

/* ═══ VOLATILIDAD ═══ */

.vol { display:inline-flex; align-items:center; gap:var(--s3); justify-content:flex-end; }
.vol-num { font-variant-numeric:tabular-nums; font-weight:600; font-size:var(--fs-num); }
.vol-bar { display:block; width:38px; height:3px; border-radius:var(--r-full); background:var(--border); overflow:hidden; flex:0 0 38px; }
.vol-fill { display:block; height:100%; border-radius:var(--r-full); }
.vol-mark { color:var(--pending); font-weight:700; cursor:help; }
.vol-headline { display:flex; align-items:baseline; gap:var(--s6); flex-wrap:wrap; margin-top:var(--s5); }

.anchors { margin-top:var(--s4); max-width:520px; }
.anchor { display:grid; grid-template-columns:minmax(0,1fr) 64px 110px; align-items:center; gap:var(--s5); padding:var(--s3) 0; border-bottom:1px solid var(--border); }
.anchor:last-child { border-bottom:0 }
.anchor-name { font-size:var(--fs-small); color:var(--text-2); }
.anchor-num { text-align:right; font-weight:600; font-size:var(--fs-small); }
.anchor-bar { height:3px; border-radius:var(--r-full); background:var(--border); overflow:hidden; }
.anchor-fill { display:block; height:100%; border-radius:var(--r-full); }
.anchor.is-current .anchor-name { color:var(--text-1); font-weight:700; }

/* ═══ NOTAS Y AVISOS ═══ */

.note {
  margin-top:var(--s8); padding-top:var(--s5); border-top:1px solid var(--border);
  font-size:var(--fs-small); line-height:1.65; color:var(--text-3); max-width:76ch;
}
.footnote, .ausencias {
  margin-top:var(--s6); padding-top:var(--s4); border-top:1px solid var(--border);
  font-size:var(--fs-small); line-height:1.65; color:var(--text-2); max-width:76ch;
}
.aviso {
  margin-top:var(--s5); padding-left:var(--s4); border-left:2px solid var(--pending);
  font-size:var(--fs-small); line-height:1.65; color:var(--text-2); max-width:70ch;
}
.pending-tag {
  font-size:var(--fs-label); font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--pending);
}
.data-stamp { display:flex; align-items:baseline; gap:var(--s4); flex-wrap:wrap; font-size:var(--fs-small); color:var(--text-3); }
.data-stamp b { color:var(--text-2); font-weight:600; }

/* ═══ CONTINUAR ═══ */

.next { margin-top:var(--s8); border-top:1px solid var(--border-strong); }
.next a { display:block; padding:var(--s5) 0; color:inherit; border-bottom:1px solid var(--border); transition:padding var(--t-fast); }
.next a:last-child { border-bottom:0 }
.next a:hover { padding-left:var(--s3); color:inherit; }
.next-k { display:block; font-size:var(--fs-label); font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); }
.next-t { display:block; font-size:var(--fs-h2); font-weight:600; letter-spacing:-.022em; color:var(--navy); margin-top:var(--s2); }
.next-d { display:block; font-size:var(--fs-small); color:var(--text-2); margin-top:var(--s1); }

/* ═══ BREADCRUMB ═══ */

.breadcrumb { display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; font-size:var(--fs-small); color:var(--text-3); margin-bottom:var(--s7); }
.breadcrumb a { color:var(--text-2) }
.breadcrumb [aria-current] { color:var(--text-1); font-weight:600 }

/* ═══ PASOS (stepper) ═══ */

.steps { display:flex; align-items:center; gap:var(--s5); flex-wrap:wrap; margin-bottom:var(--s7); }
.step-pill { display:flex; align-items:baseline; gap:var(--s2); font-size:var(--fs-small); color:var(--text-3); transition:color var(--t-fast); }
.step-pill b { font-variant-numeric:tabular-nums; font-weight:700; }
.step-pill.is-active { color:var(--navy); font-weight:700; }
.step-pill.is-done { color:var(--text-2); }
.step-sep { width:24px; height:1px; background:var(--border-strong); }

/* ═══ LÍNEA DE ETAPAS ═══ */

.phases { display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-top:var(--s6); border-top:1px solid var(--border-strong); }
.phase { padding:var(--s5) var(--s4) var(--s5) 0; border-top:2px solid transparent; margin-top:-1px; transition:all var(--t-fast); }
.phase.is-active { border-top-color:var(--navy); }
.phase-k { font-size:var(--fs-label); font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); }
.phase-n { font-size:var(--fs-h3); font-weight:600; margin-top:var(--s2); color:var(--text-3); letter-spacing:-.012em; }
.phase.is-active .phase-n { color:var(--navy); }
.phase.is-active .phase-k { color:var(--navy); }
.phase-d { font-size:var(--fs-small); color:var(--text-3); margin-top:var(--s1); }
.phase.is-active .phase-d { color:var(--text-2); }
@media (max-width:899px){ .phases{ grid-template-columns:repeat(2,1fr) } }
@media (max-width:520px){ .phases{ grid-template-columns:1fr } }


/* ═══ TARJETAS SELECCIONABLES (V2) ═══
   Apple Settings + private wealth management institucional. */

.cards {
  display:grid; gap:var(--s4);
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  margin-top:var(--s5);
}
.cards--2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.cards--4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
@media (max-width:1023px){ .cards--4 { grid-template-columns:repeat(2,minmax(0,1fr)) } }
@media (max-width:699px){ .cards, .cards--2, .cards--4 { grid-template-columns:1fr } }

.card-sel {
  position:relative; display:block; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:20px 22px;
  box-shadow:0 1px 2px rgba(13,27,46,.03);
  transition:border-color var(--t-fast), box-shadow var(--t-fast),
             transform var(--t-fast), background var(--t-fast);
  color:inherit;
}
.card-sel:hover {
  border-color:var(--border-strong);
  box-shadow:0 3px 14px rgba(13,27,46,.07);
  transform:translateY(-1px);
  color:inherit;
}
.card-sel.is-active {
  border-color:var(--navy); background:var(--navy-soft);
  box-shadow:0 1px 2px rgba(13,27,46,.04);
  transform:none;
}
.card-k {
  font-size:10px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--text-3);
}
.card-sel.is-active .card-k { color:var(--navy); }
.card-t {
  font-size:var(--fs-h3); font-weight:700; letter-spacing:-.018em;
  color:var(--navy); margin-top:var(--s2);
}
.card-t--big { font-size:var(--fs-h2); }
.card-s { font-size:var(--fs-small); color:var(--text-2); margin-top:var(--s1); }
.card-d { font-size:var(--fs-small); color:var(--text-3); margin-top:var(--s3); line-height:1.55; }
.card-n {
  font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em;
  color:var(--navy); margin-top:var(--s3); font-variant-numeric:tabular-nums;
}
.card-n small { display:block; font-size:var(--fs-small); font-weight:500;
  letter-spacing:normal; color:var(--text-2); margin-top:2px; }

/* Panel de detalle bajo la grilla */
.detail {
  margin-top:var(--s6); padding-top:var(--s6);
  border-top:1px solid var(--border-strong);
  animation:enter-detail 170ms cubic-bezier(.2,.6,.3,1) both;
}
.detail-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s8); }
@media (max-width:899px){ .detail-grid { grid-template-columns:1fr; gap:var(--s6) } }
.detail-h { font-size:var(--fs-display); font-weight:700; letter-spacing:-.035em;
  color:var(--navy); line-height:1.05; }
.detail-sub { font-size:var(--fs-h3); color:var(--text-2); margin-top:var(--s2); font-weight:500; }
.detail-lead { margin-top:var(--s4); max-width:60ch; color:var(--text-2); }
.detail-sec { margin-top:var(--s6); }
.detail-sec:first-child { margin-top:0; }
.dl { margin-top:var(--s3); }
.dl dt { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-3); margin-top:var(--s5); }
.dl dt:first-child { margin-top:0; }
.dl dd { font-size:var(--fs-body); color:var(--text-2); margin-top:var(--s2); max-width:66ch; }
.dl dd b { color:var(--text-1); font-weight:600; }
.ul-clean { margin-top:var(--s3); padding-left:0; list-style:none; }
.ul-clean li {
  position:relative; padding:var(--s2) 0 var(--s2) var(--s5);
  font-size:var(--fs-body); color:var(--text-2);
  border-bottom:1px solid var(--border);
}
.ul-clean li:last-child { border-bottom:0; }
.ul-clean li::before {
  content:''; position:absolute; left:0; top:calc(var(--s2) + 9px);
  width:5px; height:5px; border-radius:50%; background:var(--border-strong);
}
.ul-num { counter-reset:n; }
.ul-num li::before {
  counter-increment:n; content:counter(n); background:none;
  width:auto; height:auto; top:var(--s2);
  font-size:11px; font-weight:700; color:var(--text-3); font-variant-numeric:tabular-nums;
}

/* Cifra destacada dentro de un detalle */
.stat-row { display:flex; flex-wrap:wrap; gap:var(--s7); margin-top:var(--s4); }
.stat-k { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-3); }
.stat-v { font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em;
  color:var(--navy); margin-top:2px; font-variant-numeric:tabular-nums; }
.stat-s { font-size:var(--fs-small); color:var(--text-2); margin-top:2px; }

/* Línea temporal normativa (Art. 107) */
.tl2 { display:grid; grid-template-columns:repeat(2,1fr); gap:2px; margin-top:var(--s4); }
.tl2-seg { padding:var(--s4) var(--s4) var(--s4) 0; border-top:3px solid; }
.tl2-y { font-size:var(--fs-small); font-weight:700; letter-spacing:.1em; color:var(--text-3); }
.tl2-v { font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em; margin-top:var(--s1);
  font-variant-numeric:tabular-nums; }
.tl2-d { font-size:var(--fs-small); color:var(--text-2); margin-top:var(--s1); }

/* Fuentes normativas */
.sources { margin-top:var(--s8); padding-top:var(--s5); border-top:1px solid var(--border); }
.sources ul { list-style:none; margin-top:var(--s3);
  columns:2; column-gap:var(--s8); }
@media (max-width:699px){ .sources ul { columns:1 } }
.sources li { font-size:var(--fs-small); color:var(--text-2); padding:3px 0; break-inside:avoid; }


/* ═══════════════ styles/modules.css ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Estilos específicos de módulo
   ============================================================ */

/* ═══ INICIO ═══ */

.hero { padding-top:var(--s5); }
.hero-lead { margin-top:var(--s4); max-width:50ch; color:var(--text-2); }
.hero-actions { margin-top:var(--s6); display:flex; gap:var(--s5); flex-wrap:wrap; align-items:center; }

/* Línea de recorrido */
.journey { margin-top:var(--s8); }
.journey-track { display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--border-strong); margin-top:var(--s5); }
.journey-step { position:relative; padding:var(--s5) var(--s4) var(--s5) 0; color:inherit; transition:background var(--t-fast); }
.journey-step::before { content:''; position:absolute; top:-4px; left:0; width:7px; height:7px; border-radius:50%; background:var(--border-strong); transition:background var(--t-fast), transform var(--t-fast); }
.journey-step:hover { color:inherit; }
.journey-step:hover::before { background:var(--navy); transform:scale(1.35); }
.journey-i { font-size:var(--fs-label); font-weight:700; letter-spacing:.14em; color:var(--text-3); }
.journey-t { display:block; font-size:var(--fs-h3); font-weight:600; letter-spacing:-.012em; color:var(--navy); margin-top:var(--s3); }
.journey-q { display:block; font-size:var(--fs-small); color:var(--text-2); margin-top:var(--s1); }
@media (max-width:1099px){ .journey-track{ grid-template-columns:repeat(3,1fr) } }
@media (max-width:599px){ .journey-track{ grid-template-columns:repeat(2,1fr) } }

/* Explora directamente */
.explore { margin-top:var(--s8); }
.explore-list { border-top:1px solid var(--border-strong); margin-top:var(--s5); }
.explore-item {
  display:grid; grid-template-columns:minmax(0,22ch) minmax(0,1fr) auto;
  gap:var(--s6); align-items:baseline;
  padding:var(--s5) var(--s3) var(--s5) 0; border-bottom:1px solid var(--border);
  color:inherit; transition:padding var(--t-fast), background var(--t-fast);
}
.explore-item:hover { padding-left:var(--s4); background:var(--bg-soft); color:inherit; }
.explore-t { font-size:var(--fs-h2); font-weight:600; letter-spacing:-.022em; color:var(--navy); }
.explore-d { font-size:var(--fs-small); color:var(--text-2); }
.explore-a { font-size:var(--fs-small); color:var(--action); font-weight:600; }
@media (max-width:799px){
  .explore-item{ grid-template-columns:1fr; gap:var(--s2) }
  .explore-a{ display:none }
}

/* ═══ FONDOS ═══ */

.controls { display:flex; flex-wrap:wrap; gap:var(--s4) var(--s8); margin-top:var(--s5); padding-bottom:var(--s4); border-bottom:1px solid var(--border); }
.filtro-aviso { flex-basis:100%; margin-top:calc(var(--s3)*-1); color:var(--text-2); }

.cats { margin-top:var(--s7); }
.cat + .cat { margin-top:var(--s8); }
.cat-head { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s5); }
.cat-desc { margin-top:var(--s3); max-width:58ch; color:var(--text-2); }
.fund-list { margin-top:var(--s5); border-top:1px solid var(--border-strong); }

.fund-row {
  display:grid; grid-template-columns:minmax(0,1fr) 130px 100px 110px;
  align-items:baseline; gap:var(--s6);
  padding:var(--s4) var(--s3) var(--s4) 0; border-bottom:1px solid var(--border);
  color:inherit; transition:padding var(--t-fast), background var(--t-fast);
}
.fund-row:hover { background:var(--bg-soft); padding-left:var(--s4); color:inherit; }
.fund-name { font-size:var(--fs-h3); font-weight:600; letter-spacing:-.012em; color:var(--navy); }
.fund-meta { font-size:var(--fs-small); color:var(--text-3); }
.fund-ret, .fund-vol { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
.fund-ret-v { font-size:var(--fs-num); font-weight:600; font-variant-numeric:tabular-nums; }
.fund-ret-k { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); font-weight:600; }
@media (max-width:899px){
  .fund-row{ grid-template-columns:minmax(0,1fr) auto; grid-template-areas:'name ret' 'meta vol'; gap:var(--s2) var(--s5); }
  .fund-name{grid-area:name} .fund-meta{grid-area:meta} .fund-ret{grid-area:ret} .fund-vol{grid-area:vol}
}

/* Ficha */
.ficha-head { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s8); flex-wrap:wrap; }
.ficha-id { flex:1 1 340px; min-width:0 }
.ficha-serie { flex:0 0 auto }
.ficha-block { margin-top:var(--s7); padding-top:var(--s5); border-top:1px solid var(--border-strong); }
.ficha-lead { margin-top:var(--s3); max-width:58ch; color:var(--text-2) }
.ficha-tbl { margin-top:var(--s5); max-width:380px }
.pairs { display:flex; flex-wrap:wrap; gap:var(--s8); margin-top:var(--s4) }
.pair { display:flex; flex-direction:column; gap:var(--s1) }
.pair-v { font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em; color:var(--navy) }

.serie-compare { margin-top:var(--s5); max-width:440px }
.serie-row { display:grid; grid-template-columns:104px 84px minmax(0,1fr); align-items:baseline; gap:var(--s5); padding:var(--s4) var(--s3); border-bottom:1px solid var(--border) }
.serie-row:last-child{ border-bottom:0 }
.serie-row-k { font-size:var(--fs-small); color:var(--text-2) }
.serie-row-v { text-align:right; font-weight:600; font-size:var(--fs-num); font-variant-numeric:tabular-nums }
.serie-row-d { font-size:var(--fs-small); color:var(--text-2); font-variant-numeric:tabular-nums }
.serie-row.is-current { background:var(--navy-soft) }
.serie-row.is-current .serie-row-k { color:var(--text-1); font-weight:700 }
.serie-row.is-current .serie-row-v { color:var(--navy) }

/* ═══ SOLUCIONES ═══ */

.band-list { margin-top:var(--s3); border-top:1px solid var(--border) }
.band-list a, .band-list span { display:block; padding:var(--s3) 0;
  border-bottom:1px solid var(--border); font-size:var(--fs-body); color:var(--text-1);
  transition:padding var(--t-fast) }
.band-list a:hover { padding-left:var(--s3); color:var(--navy) }
.band-actions { margin-top:var(--s6); display:flex; gap:var(--s6); flex-wrap:wrap }

.timeline-track { display:grid; grid-template-columns:repeat(4,1fr); gap:2px }
.timeline-seg { padding:var(--s3) var(--s2) var(--s3) 0; border-top:3px solid }
.timeline-p { font-size:var(--fs-h3); font-weight:700; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums }
.timeline-d { font-size:var(--fs-small); color:var(--text-3); margin-top:var(--s1) }
@media (max-width:599px){ .timeline-track{ grid-template-columns:repeat(2,1fr) } }

.exception-flow { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
  margin-top:var(--s3); font-size:var(--fs-h3); font-weight:600; color:var(--navy) }
.exception-flow span.sep { color:var(--text-3); font-weight:400 }
.exception-flow em { font-style:normal; color:var(--text-3); font-size:10px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase }

/* ═══ EDUCACIÓN ═══ */

.edu-evidence { margin-top:var(--s3); border-top:1px solid var(--border) }
.ev-row { display:grid; grid-template-columns:minmax(0,1fr) 90px 120px; align-items:center;
  gap:var(--s5); padding:var(--s3) 0; border-bottom:1px solid var(--border) }
.ev-row-k { font-size:var(--fs-body); color:var(--text-1) }
.ev-row-v { text-align:right; font-weight:700; font-variant-numeric:tabular-nums;
  font-size:var(--fs-num); color:var(--navy) }
.ev-bar { height:3px; border-radius:var(--r-full); background:var(--border); overflow:hidden }
.ev-bar > span { display:block; height:100%; border-radius:var(--r-full) }
@media (max-width:599px){ .ev-row{ grid-template-columns:minmax(0,1fr) 80px; gap:var(--s3) } .ev-bar{ display:none } }

/* ═══ DIAGNÓSTICO ═══ */

.dg-block { margin-top:var(--s7); padding-top:var(--s5); border-top:1px solid var(--border-strong) }
.dg-num { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--navy) }
.dg-etapa-row { display:flex; align-items:flex-start; gap:var(--s8); flex-wrap:wrap;
  margin-top:var(--s5) }
.dg-etapa { flex:1 1 260px; min-width:0; padding-top:var(--s3) }
.phases { display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-top:var(--s5);
  border-top:1px solid var(--border) }
.phase { padding:var(--s4) var(--s4) var(--s4) 0; border-top:2px solid transparent;
  margin-top:-1px; transition:all var(--t-fast) }
.phase.is-active { border-top-color:var(--navy) }
.phase-k { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-3) }
.phase-n { font-size:var(--fs-body); font-weight:600; margin-top:var(--s1); color:var(--text-3) }
.phase.is-active .phase-n, .phase.is-active .phase-k { color:var(--navy) }
@media (max-width:699px){ .phases{ grid-template-columns:repeat(2,1fr) } }

/* ═══ SIMULADOR ═══ */

.sim-panels { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s8); margin-top:var(--s6) }
@media (max-width:899px){ .sim-panels{ grid-template-columns:1fr; gap:var(--s7) } }
.panel-ref { padding-top:var(--s5); border-top:2px solid var(--border-strong) }
.panel-sup { padding-top:var(--s5); border-top:2px solid var(--navy) }
.panel-k { font-size:var(--fs-label); font-weight:700; letter-spacing:.16em; text-transform:uppercase }
.panel-ref .panel-k { color:var(--text-3) }
.panel-sup .panel-k { color:var(--navy) }
.ref-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:var(--s5); margin-top:var(--s5) }
.ref-k { font-size:var(--fs-label); letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); font-weight:700 }
.ref-v { font-size:var(--fs-h3); font-weight:600; color:var(--text-2); margin-top:var(--s1) }
.ref-v.big { font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em; color:var(--navy) }

.scenarios { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s6); margin-top:var(--s5) }
@media (max-width:799px){ .scenarios{ grid-template-columns:1fr; gap:var(--s6) } }
.scen { padding-top:var(--s4); border-top:2px solid }
.scen-n { font-size:var(--fs-h3); font-weight:600; letter-spacing:-.012em }
.scen-in { display:flex; align-items:baseline; gap:var(--s2); margin-top:var(--s3) }
.scen-in input { width:72px; padding:6px 0; border:0; border-bottom:1px solid var(--border-strong); background:transparent; font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em; color:var(--navy); font-variant-numeric:tabular-nums; text-align:right }
.scen-in input:focus{ outline:none; border-bottom-color:var(--navy) }
.scen-in input:disabled{ color:var(--text-2); border-bottom-style:dashed }
.scen-in span { font-size:var(--fs-h3); font-weight:600; color:var(--text-3) }
.scen-res { margin-top:var(--s5); border-top:1px solid var(--border) }
.scen-line { display:flex; justify-content:space-between; align-items:baseline; gap:var(--s3); padding:var(--s3) 0; border-bottom:1px solid var(--border); font-size:var(--fs-small) }
.scen-line span:first-child { color:var(--text-2) }
.scen-line span:last-child { font-weight:600; font-variant-numeric:tabular-nums; color:var(--text-1) }
.scen-line.total { border-bottom:0; padding-top:var(--s4) }
.scen-line.total span:last-child { font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em; color:var(--navy) }

.chart-wrap { margin-top:var(--s6) }
.chart-legend { display:flex; gap:var(--s6); flex-wrap:wrap; margin-bottom:var(--s5); font-size:var(--fs-small); color:var(--text-2) }
.chart-legend i { display:inline-block; width:16px; height:3px; border-radius:2px; margin-right:var(--s2); vertical-align:middle }
.chart-svg {
  display:block; width:100%; height:auto; min-height:220px;
  overflow:visible;
}
.chart-fallback {
  display:block; padding:var(--s6) var(--s5);
  border:1px solid var(--border); border-radius:12px;
  font-size:var(--fs-small); color:var(--text-2); text-align:center;
}

/* ═══ BRECHA ═══ */

.gap-result { margin-top:var(--s7); padding-top:var(--s5); border-top:1px solid var(--border-strong) }
.gap-big { font-size:var(--fs-hero); font-weight:700; letter-spacing:-.04em; color:var(--navy); line-height:1; font-variant-numeric:tabular-nums; margin-top:var(--s4) }
.gap-bar { margin-top:var(--s6) }
.gap-track { display:flex; height:44px; border-radius:var(--r-control); overflow:hidden; background:var(--border) }
.gap-fill { background:var(--navy) }
.gap-rest { background:repeating-linear-gradient(45deg,#E4E9F0,#E4E9F0 5px,#F2F5F9 5px,#F2F5F9 10px) }
.gap-labels { display:flex; justify-content:space-between; gap:var(--s5); margin-top:var(--s3); font-size:var(--fs-small); color:var(--text-2); flex-wrap:wrap }
.gap-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:var(--s6); margin-top:var(--s6) }

/* ═══ TRIBUTARIO ═══ */

.tax-list { margin-top:var(--s7); border-top:1px solid var(--border-strong) }
.tax-item { border-bottom:1px solid var(--border) }
.tax-sum {
  display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) minmax(0,1fr) 130px 20px;
  gap:var(--s5); align-items:baseline; width:100%; text-align:left;
  padding:var(--s5) var(--s3) var(--s5) 0; transition:background var(--t-fast)
}
.tax-sum:hover { background:var(--bg-soft) }
.tax-n { font-size:var(--fs-h3); font-weight:600; letter-spacing:-.012em; color:var(--navy) }
.tax-c { font-size:var(--fs-small); color:var(--text-2) }
.tax-arrow { color:var(--text-3); transition:transform var(--t-fast); justify-self:end }
.tax-item.is-open .tax-arrow { transform:rotate(180deg) }
.tax-detail { padding:0 var(--s3) var(--s7) 0; max-width:70ch; animation:enter var(--t-fast) both }
.tax-detail dt { font-size:var(--fs-label); font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3); margin-top:var(--s5) }
.tax-detail dd { font-size:var(--fs-body); color:var(--text-2); margin-top:var(--s2) }
.tax-sum > * { min-width:0; overflow-wrap:anywhere }
@media (max-width:899px){
  /* El encabezado de columnas no tiene sentido en disposición apilada */
  .tax-head{ display:none }
  .tax-sum{ grid-template-columns:minmax(0,1fr) 20px; gap:var(--s2) }
  .tax-c{ grid-column:1 } .tax-arrow{ grid-row:1; grid-column:2 }
}

/* ═══ RESUMEN ═══ */

.sum-chain { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:0; margin-top:var(--s5); border-top:1px solid var(--border-strong) }
.sum-cell { padding:var(--s4) var(--s5) var(--s4) 0 }
.sum-k { font-size:var(--fs-label); font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3) }
.sum-v { font-size:var(--fs-h3); font-weight:600; letter-spacing:-.012em; color:var(--navy); margin-top:var(--s2) }
.sum-v.empty { color:var(--text-3); font-weight:400 }
.sum-q { font-size:var(--fs-small); color:var(--text-3); margin-top:var(--s1) }
.sum-block { margin-top:var(--s7); padding-top:var(--s5); border-top:1px solid var(--border-strong) }
.chips { display:flex; flex-wrap:wrap; gap:var(--s3) var(--s5); margin-top:var(--s4); font-size:var(--fs-body); color:var(--text-2) }

/* ═══ VACÍOS ═══ */

.empty { margin-top:var(--s7); padding-top:var(--s6); border-top:1px solid var(--border); max-width:56ch }
.empty p { color:var(--text-2) }
.empty .actions { margin-top:var(--s5) }


/* Grilla de 3 columnas para tributario */
.cards--3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
@media (max-width:1023px){ .cards--3 { grid-template-columns:repeat(2,minmax(0,1fr)) } }
@media (max-width:699px){ .cards--3 { grid-template-columns:1fr } }

/* ═══ V3 · PROGRESO EN SIDEBAR ═══ */

.sb-prog { padding:var(--s3) var(--s5) var(--s2); margin-top:var(--s2);
  border-top:1px solid var(--border) }
.sb-prog-k { font-size:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-3); margin-bottom:var(--s2) }
.sb-steps { display:flex; flex-direction:column }
.sb-step { display:flex; align-items:center; gap:var(--s3); padding:2.5px 0;
  font-size:12px; color:var(--text-3); transition:color var(--t-fast) }
.sb-step:hover { color:var(--text-2) }
.sb-step.is-done { color:var(--navy); font-weight:600 }
.sb-mark {
  flex:0 0 13px; height:13px; border-radius:50%;
  border:1px solid var(--border-strong); background:transparent;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:700; color:#fff; line-height:1;
}
.sb-step.is-done .sb-mark { background:var(--navy); border-color:var(--navy) }
body.sb-min .sb-prog { display:none }

/* ═══ V3 · ACCIÓN EXPLÍCITA Y RESULTADO ═══ */

.act-bar {
  display:flex; align-items:center; gap:var(--s5); flex-wrap:wrap;
  margin-top:var(--s7); padding-top:var(--s5);
  border-top:1px solid var(--border-strong);
}
.act-bar--dirty { border-top-color:var(--pending) }
.dirty-tag {
  font-size:var(--fs-small); font-weight:600; color:var(--pending);
}
.act-bar button:disabled { opacity:.65; cursor:default }

.empty-res {
  margin-top:var(--s6); padding:var(--s6) 0;
  border-bottom:1px solid var(--border);
}

.res-main {
  margin-top:var(--s6); padding-bottom:var(--s6);
  border-bottom:1px solid var(--border);
  animation:enter-detail 180ms both;
}
.res-main.is-stale { opacity:.62 }
.res-big {
  font-size:var(--fs-hero); font-weight:800; letter-spacing:-.045em;
  color:var(--navy); line-height:1.02; margin-top:var(--s3);
  font-variant-numeric:tabular-nums;
}
.res-cap { font-size:var(--fs-h3); color:var(--text-2); margin-top:var(--s2) }
.res-metrics {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:var(--s6); margin-top:var(--s6);
}
.res-m { font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em;
  color:var(--text-1); margin-top:var(--s1); font-variant-numeric:tabular-nums }

/* Sensibilidad: secundaria, nunca compite con el resultado */
.sens-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--s5);
  margin-top:var(--s5) }
@media (max-width:799px){ .sens-grid{ grid-template-columns:1fr } }
.sens { padding-top:var(--s3); border-top:2px solid }
.sens-n { font-size:var(--fs-small); font-weight:600; color:var(--text-2) }
.sens-v { font-size:var(--fs-h2); font-weight:700; letter-spacing:-.025em; color:var(--navy);
  margin-top:var(--s3); font-variant-numeric:tabular-nums }
.sens .scen-in input { width:64px; font-size:var(--fs-h3) }

/* ═══ V3 · TU RUTA FINANCIERA ═══ */

.rt-head { padding-bottom:var(--s5); border-bottom:1px solid var(--border-strong) }
.rt-fecha { margin-top:var(--s3) }

.rt-sec { margin-top:var(--s7); padding-top:var(--s5); border-top:1px solid var(--border) }
.rt-sec:first-of-type { border-top:0 }
.rt-sec--main { border-top:2px solid var(--navy); padding-top:var(--s6) }
.rt-sec--sec { opacity:.9 }
.rt-k { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--navy) }

.rt-start { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:var(--s6); margin-top:var(--s4) }
.rt-cell-v { font-size:var(--fs-h3); font-weight:600; letter-spacing:-.012em;
  color:var(--navy); margin-top:var(--s1) }
.rt-cell-v.empty { color:var(--text-3); font-weight:400 }

.rt-sol { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);
  gap:var(--s7); margin-top:var(--s4); align-items:start }
@media (max-width:699px){ .rt-sol{ grid-template-columns:1fr; gap:var(--s5) } }
.rt-h { font-size:var(--fs-display); font-weight:700; letter-spacing:-.035em;
  color:var(--navy); line-height:1.05 }
.rt-sub { font-size:var(--fs-h3); color:var(--text-2); margin-top:var(--s2) }
.rt-concepts { font-size:var(--fs-body); color:var(--text-2); margin-top:var(--s2);
  line-height:1.7 }
.rt-ctx { margin-top:var(--s5); max-width:72ch }

.rt-fund { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:var(--s5); margin-top:var(--s5) }
.rt-fv { font-size:var(--fs-h3); font-weight:600; color:var(--text-1); margin-top:var(--s1) }

.rt-empty { margin-top:var(--s4); display:flex; align-items:baseline; gap:var(--s6);
  flex-wrap:wrap }
.rt-empty .t-h3 { color:var(--text-3); font-weight:500 }
.rt-chart { margin-top:var(--s6) }

.rt-tax { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:var(--s6); margin-top:var(--s4) }
.rt-tax-v { font-size:var(--fs-num-lg); font-weight:700; letter-spacing:-.03em;
  color:var(--navy); margin-top:var(--s1); font-variant-numeric:tabular-nums }

.rt-actions { margin-top:var(--s8); padding-top:var(--s5);
  border-top:1px solid var(--border-strong);
  display:flex; gap:var(--s4); flex-wrap:wrap; align-items:center }
.rt-disc { margin-top:var(--s6) }

/* ═══ V4 · ESTRATEGIA ═══ */

.caps { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s5);
  margin-top:var(--s6) }
@media (max-width:799px){ .caps{ grid-template-columns:1fr } }

.cap {
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:22px 24px; display:flex; flex-direction:column;
  box-shadow:0 1px 2px rgba(13,27,46,.03);
  transition:border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
}
.cap:hover { border-color:var(--border-strong); box-shadow:0 3px 14px rgba(13,27,46,.06) }
.cap.is-on { border-color:var(--navy); background:var(--navy-soft) }

.cap-head { display:flex; align-items:center; justify-content:space-between; gap:var(--s3) }
.cap.is-on .card-k { color:var(--navy) }
.cap-check { display:flex; align-items:center; justify-content:center; width:20px; height:20px;
  border-radius:50%; background:var(--navy); color:#fff; flex:0 0 20px }
.cap-t { font-size:var(--fs-h2); font-weight:700; letter-spacing:-.022em; color:var(--navy);
  margin-top:var(--s3) }
.cap-veh { font-size:var(--fs-body); color:var(--text-2); margin-top:var(--s1); font-weight:500 }
.cap-meta { margin-top:var(--s5) }
.cap-hz { font-size:var(--fs-h3); font-weight:600; color:var(--text-1); margin-top:2px }
.cap-conc { font-size:var(--fs-small); color:var(--text-2); margin-top:var(--s4);
  padding-top:var(--s4); border-top:1px solid var(--border) }
.cap.is-on .cap-conc { border-top-color:var(--border-strong) }
.cap-desc { font-size:var(--fs-small); color:var(--text-3); margin-top:var(--s3);
  line-height:1.6; flex:1 }
.cap-nota { font-size:var(--fs-small); color:var(--text-2); margin-top:var(--s3);
  padding-left:var(--s3); border-left:2px solid var(--border-strong) }
.cap-btn {
  margin-top:var(--s5); padding:11px var(--s4); border-radius:8px;
  border:1px solid var(--border-strong); background:var(--surface);
  font-size:var(--fs-small); font-weight:600; color:var(--navy);
  transition:all var(--t-fast); text-align:center;
}
.cap-btn:hover { border-color:var(--navy) }
.cap-btn.is-on { background:var(--navy); border-color:var(--navy); color:#fff }

/* Panel Tu estrategia · estructura tipo roadmap, sin porcentajes */
.est-track { margin-top:var(--s6); border-left:1px solid var(--border-strong);
  padding-left:var(--s6) }
@media (max-width:699px){ .est-track{ padding-left:var(--s5) } }
.est-b { position:relative; padding:var(--s5) 0; border-bottom:1px solid var(--border) }
.est-b:last-child { border-bottom:0 }
.est-b::before {
  content:''; position:absolute; left:calc(var(--s6) * -1 - 4.5px); top:calc(var(--s5) + 6px);
  width:9px; height:9px; border-radius:50%; background:var(--navy);
  box-shadow:0 0 0 3px #fff;
}
@media (max-width:699px){ .est-b::before{ left:calc(var(--s5) * -1 - 4.5px) } }
.est-i { font-size:10px; font-weight:700; letter-spacing:.16em; color:var(--text-3);
  font-variant-numeric:tabular-nums }
.est-k { font-size:var(--fs-h3); font-weight:700; letter-spacing:-.015em; color:var(--navy);
  margin-top:var(--s1) }
.est-veh { font-size:var(--fs-body); color:var(--text-1); margin-top:var(--s1) }
.est-serie { font-size:var(--fs-small); color:var(--text-3); margin-top:2px }
.est-fondo { margin-top:var(--s4) }
.est-fv { font-size:var(--fs-body); font-weight:600; color:var(--text-1); margin-top:2px }
.est-acts { display:flex; gap:var(--s5); flex-wrap:wrap; margin-top:var(--s4);
  font-size:var(--fs-small) }
.est-acts .link-arrow { font-size:var(--fs-small) }
.est-quitar { font-size:var(--fs-small); color:var(--text-3); transition:color var(--t-fast) }
.est-quitar:hover { color:var(--neg) }

/* Asociar fondo a una capa desde la ficha */
.cap-assoc { margin-top:var(--s5); padding:var(--s4) var(--s5);
  border:1px solid var(--border-strong); border-radius:12px; background:var(--navy-soft);
  display:flex; align-items:center; justify-content:space-between; gap:var(--s5);
  flex-wrap:wrap }
.cap-assoc-t { font-size:var(--fs-body); color:var(--text-1) }
.cap-assoc-t b { color:var(--navy) }
.cap-assoc button { font-size:var(--fs-small); font-weight:600; color:var(--action) }
.cap-assoc button.is-on { color:var(--pos) }

/* Lectura rápida de la estrategia en el resumen */
.est-quick { display:flex; flex-wrap:wrap; gap:var(--s3) var(--s6); margin-top:var(--s4) }
.est-q { display:flex; align-items:center; gap:var(--s2); font-size:var(--fs-body);
  color:var(--text-3) }
.est-q.is-on { color:var(--navy); font-weight:600 }
.est-q-m { display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px; border-radius:50%; border:1px solid var(--border-strong);
  font-size:9px; font-weight:700; color:#fff }
.est-q.is-on .est-q-m { background:var(--navy); border-color:var(--navy) }

/* Complemento en Soluciones */
.combo { margin-top:var(--s8); padding-top:var(--s6);
  border-top:1px solid var(--border-strong) }
.combo-h { font-size:var(--fs-display); font-weight:700; letter-spacing:-.035em;
  color:var(--navy); margin-top:var(--s3); line-height:1.08 }
.combo-t { margin-top:var(--s4); max-width:62ch; color:var(--text-2) }
.combo-cta { margin-top:var(--s5) }


/* ═══ V4 · ESTRATEGIA EN EL RESUMEN ═══ */

.rt-estrategia { border-top:1px solid var(--border-strong) }
.rt-capas { margin-top:var(--s6) }
.rt-capa { padding:var(--s5) 0; border-top:1px solid var(--border) }
.rt-capa:first-child { border-top:0; padding-top:var(--s2) }
.rt-capa-k { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-3) }
.rt-capa-t { font-size:var(--fs-h2); font-weight:700; letter-spacing:-.022em;
  color:var(--navy); margin-top:var(--s2) }
.rt-capa-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:var(--s5); margin-top:var(--s4) }
.rt-capa-v { font-size:var(--fs-body); font-weight:600; color:var(--text-1); margin-top:2px }

/* ═══ V4 · REFERENCIA A ESTRATEGIA EN HOME ═══ */

.home-estrategia {
  margin-top:var(--s6); padding:var(--s4) var(--s5);
  border-left:2px solid var(--navy);
  display:flex; align-items:baseline; gap:var(--s5); flex-wrap:wrap;
}

/* ═══ CHECKPOINT DE RUTA ═══
   Sobrio: regla superior fina, gris y navy, sin colores de alerta. */

.cp {
  margin-top:var(--s8); padding-top:var(--s5);
  border-top:1px solid var(--border-strong);
}
.cp-t {
  font-size:10px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--text-3);
}
.cp-items {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:var(--s5); margin-top:var(--s4);
}
.cp-k { font-size:10px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-3) }
.cp-v { font-size:var(--fs-h3); font-weight:600; letter-spacing:-.012em;
  color:var(--navy); margin-top:2px }
.cp-v.is-empty { color:var(--text-3); font-weight:400 }
.cp-msg { font-size:var(--fs-small); color:var(--text-2); margin-top:var(--s4);
  max-width:66ch }
.cp-acts { display:flex; gap:var(--s4); flex-wrap:wrap; margin-top:var(--s5) }

/* ═══ FOCOS DE ETAPA ═══ */

.focos { display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 var(--s8); margin-top:var(--s4) }
.foco { padding:var(--s4) 0; border-top:1px solid var(--border) }
.foco-t { font-size:var(--fs-h3); font-weight:600; letter-spacing:-.012em;
  color:var(--navy) }
.foco-d { font-size:var(--fs-small); color:var(--text-2); margin-top:var(--s1);
  line-height:1.55 }
@media (max-width:767px){ .focos{ grid-template-columns:1fr; gap:0 } }

/* ═══ SUGERENCIA / VISTA (no persistida) ═══ */

.sugerido {
  display:inline-flex; align-items:baseline; gap:var(--s2);
  margin-top:var(--s4); font-size:var(--fs-small); color:var(--text-2);
}
.sugerido b { color:var(--navy); font-weight:600 }
.sugerido-k { font-size:10px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-3) }

.vista-nota { font-size:var(--fs-small); color:var(--text-3); margin-top:var(--s3) }
.vista-nota b { color:var(--text-2); font-weight:600 }

.empty-sel {
  margin-top:var(--s6); padding:var(--s6) 0;
  border-top:1px solid var(--border-strong);
  font-size:var(--fs-read); color:var(--text-2);
}

.dg-focos { margin-top:var(--s6); padding-top:var(--s5); border-top:1px solid var(--border) }
.dg-sug { margin-top:var(--s5); padding-left:var(--s4); border-left:2px solid var(--border-strong) }
.dg-sug .sugerido { margin-top:var(--s2); flex-wrap:wrap }


/* Procedencia de cada sección del resultado final */
.rt-origen {
  font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3); margin-top:var(--s2);
}
.rt-leyenda { margin-top:var(--s2); max-width:64ch }


/* La barra de contexto es sticky: el destino del scroll interno
   necesita margen para no quedar tapado. */
#explora { scroll-margin-top: calc(var(--ctx-h) + var(--s5)); }
@media (max-width:1023px){
  #explora { scroll-margin-top: calc(var(--topbar-h) + var(--ctx-h) + var(--s4)); }
}

/* ═══ AVISO DE VERSIÓN PUBLICADA ═══ */

.upd {
  position:fixed; z-index:400;
  right:var(--s5); bottom:calc(var(--s5) + env(safe-area-inset-bottom, 0px));
  display:flex; align-items:center; gap:var(--s4);
  padding:var(--s3) var(--s3) var(--s3) var(--s5);
  background:var(--navy); color:#fff;
  border-radius:12px; box-shadow:0 8px 30px rgba(13,27,46,.28);
  font-size:var(--fs-small); max-width:calc(100vw - var(--s6));
  animation:enter var(--t-mid) both;
}
.upd-t { color:#fff; opacity:.92 }
.upd-btn {
  padding:8px 14px; border-radius:8px; background:#fff; color:var(--navy);
  font-size:var(--fs-small); font-weight:700; white-space:nowrap;
  transition:opacity var(--t-fast);
}
.upd-btn:hover { opacity:.88 }
.upd-x { color:#fff; opacity:.6; font-size:18px; line-height:1; padding:0 var(--s2) }
.upd-x:hover { opacity:1 }
@media (max-width:479px){
  .upd { left:var(--s4); right:var(--s4); flex-wrap:wrap }
  .upd-btn { flex:1 }
}
@media print { .upd { display:none !important } }


/* ═══════════════ styles/mobile.css ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Móvil y tablet
   ------------------------------------------------------------
   La versión móvil no es una adaptación posterior: tiene la
   misma prioridad que la de escritorio.

   Referencias de ancho:
     Desktop        ≥1024
     Tablet          768–1023
     Mobile          480–767
     Mobile pequeño  320–479
   ============================================================ */

/* ═══════════════════════════════════════════
   SAFE AREAS · notch / Dynamic Island
   ═══════════════════════════════════════════ */

@supports (padding: max(0px)) {
  .topbar {
    padding-top: env(safe-area-inset-top);
    height: calc(var(--topbar-h) + env(safe-area-inset-top));
    padding-left: max(var(--gutter), env(safe-area-inset-left));
    padding-right: max(var(--gutter), env(safe-area-inset-right));
  }
  .ctx { top: calc(var(--topbar-h) + env(safe-area-inset-top)); }

  .sb {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
  }

  .page {
    padding-left: max(var(--gutter), env(safe-area-inset-left));
    padding-right: max(var(--gutter), env(safe-area-inset-right));
    padding-bottom: calc(var(--s10) + env(safe-area-inset-bottom));
  }
}

/* ═══════════════════════════════════════════
   ENTRADAS · evitar el zoom automático de iOS
   ═══════════════════════════════════════════ */

@media (max-width: 1023px) {
  /* iOS hace zoom al enfocar cualquier campo con tipografía
     menor a 16px. Ningún control puede bajar de ese umbral. */
  input, select, textarea,
  .field input, .field select,
  .scen-in input, .sens .scen-in input {
    font-size: max(16px, 1rem);
  }
}

/* ═══════════════════════════════════════════
   TÁCTIL · área mínima 44 × 44
   ═══════════════════════════════════════════ */

@media (max-width: 1023px) {
  .sb-i { min-height: 46px; padding: 11px var(--s3); }
  .sb-step { min-height: 34px; padding: 6px 0; }
  .sb-reset { min-height: 44px; }
  .topbar button { min-width: 44px; min-height: 44px; display: flex;
    align-items: center; justify-content: center; }

  .seg-btn { min-height: 44px; padding: 11px 16px; display: inline-flex;
    align-items: center; }
  .btn { min-height: 48px; }
  .choice { min-height: 56px; }
  .cap-btn { min-height: 48px; }
  .fund-row { min-height: 56px; }
  .tax-sum { min-height: 56px; }
  .ctx-item { min-height: 34px; display: inline-flex; align-items: center; }
  .ctx-actions button { min-height: 40px; display: inline-flex; align-items: center; }
  .link-arrow { display: inline-flex; align-items: center; min-height: 40px; }
  .est-acts .link-arrow, .est-quitar { min-height: 44px; }
  .journey-step, .explore-item { min-height: 56px; }
}

/* Sin dependencia de hover: el marcador de nota se hace tocable */
@media (hover: none) {
  .vol-mark { padding: 0 3px; }
  .card-sel:hover, .cap:hover, .fund-row:hover, .explore-item:hover {
    transform: none;
  }
}

/* ═══════════════════════════════════════════
   TABLET · 768–1023
   ═══════════════════════════════════════════ */

@media (max-width: 1023px) {
  /* El drawer bloquea el scroll del contenido de detrás */
  body.sb-open { overflow: hidden; }
  .sb { width: min(300px, 84vw); }

  .detail-grid { grid-template-columns: 1fr; gap: var(--s6); }
  .sim-panels { grid-template-columns: 1fr; }
}

/* ═══════════════════════════════════════════
   MÓVIL · ≤767
   ═══════════════════════════════════════════ */

@media (max-width: 767px) {

  /* ── Tipografía ── */
  :root {
    --fs-hero: 32px;
    --fs-display: 24px;
    --fs-h1: 26px;
    --fs-h2: 20px;
    --fs-h3: 16.5px;
    --fs-body: 15px;
    --fs-read: 16px;
    --fs-small: 13.5px;
    --fs-label: 11px;
    --fs-num-xl: 32px;
    --fs-num-lg: 24px;
  }
  .t-hero { line-height: 1.08; }
  .t-h1 { line-height: 1.18; }
  .head, .head--wide { max-width: none; }
  .head-lead { font-size: var(--fs-read); }

  /* ── Barra de contexto: una sola línea ── */
  .ctx { min-height: 42px; }
  .ctx-items { flex-wrap: nowrap; }
  .ctx-item { font-size: 13px; }

  /* ── Grillas a una columna ── */
  .cards, .cards--2, .cards--3, .cards--4,
  .caps, .fields, .sens-grid, .scenarios,
  .rt-start, .rt-capa-grid, .gap-stats, .res-metrics {
    grid-template-columns: 1fr !important;
  }
  .res-metrics { gap: var(--s5); }
  .pairs { gap: var(--s6); }

  /* ── Acciones a ancho completo ── */
  .btn { width: 100%; justify-content: center; }
  .actions, .rt-actions, .hero-actions { flex-direction: column; align-items: stretch; }
  .actions .link-arrow, .rt-actions .link-arrow, .hero-actions .link-arrow {
    justify-content: center; text-align: center;
  }
  .act-bar { flex-direction: column; align-items: stretch; gap: var(--s3); }
  .act-bar .btn { width: 100%; }
  .dirty-tag { text-align: center; }

  /* ── Inicio ── */
  .journey-track { grid-template-columns: 1fr; border-top: 0; }
  .journey-step { border-top: 1px solid var(--border); padding: var(--s4) 0; }
  .journey-step::before { top: -4px; }
  .explore-item { grid-template-columns: 1fr; gap: var(--s2); }
  .home-estrategia { flex-direction: column; gap: var(--s2); align-items: flex-start; }

  /* ── Diagnóstico ── */
  .dg-etapa-row { flex-direction: column; gap: var(--s5); }
  .dg-etapa-row .field { max-width: none !important; width: 100%; }
  .dg-etapa { padding-top: 0; }
  .phases { grid-template-columns: repeat(2, 1fr); }
  .phase { padding: var(--s3) var(--s3) var(--s3) 0; }

  /* ── Soluciones y Estrategia ── */
  .cap { padding: 18px 18px; }
  .cap-desc { display: none; }          /* el detalle vive en la ficha */
  .cap-conc { margin-top: var(--s3); padding-top: var(--s3); }
  .card-sel { padding: 16px 18px; }
  .detail { margin-top: var(--s5); padding-top: var(--s5); }
  .est-track { padding-left: var(--s5); }
  .est-acts { gap: var(--s4); }

  /* ── Fondos ── */
  .controls { gap: var(--s4); }
  .controls .seg { width: 100%; }
  .cat + .cat { margin-top: var(--s7); }
  .fund-row {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: 'name ret' 'meta vol';
    gap: var(--s2) var(--s4);
    padding: var(--s4) 0;
  }
  .fund-name { font-size: 16px; }
  .ficha-head { flex-direction: column; gap: var(--s5); }
  .ficha-serie { width: 100%; }
  .ficha-tbl { max-width: none; }
  .anchor { grid-template-columns: minmax(0, 1fr) 56px; }
  .anchor-bar { display: none; }
  .serie-row { grid-template-columns: 84px 76px minmax(0, 1fr); gap: var(--s3); }

  /* Indicación de desplazamiento en tablas que lo requieran */
  .scroll-hint {
    display: block;
    font-size: 12px;
    color: var(--text-3);
    margin-top: var(--s2);
  }

  /* ── Simulador ── */
  /* Orden en móvil: capital · aporte · horizonte · serie · fondo · supuesto */
  .sim-config { display: flex; flex-direction: column; gap: var(--s6); }
  .sim-config .fields { display: contents; }
  .f-cap    { order: 1; }
  .f-ap     { order: 2; }
  .f-anios  { order: 3; max-width: none !important; margin-top: 0 !important; }
  .f-serie  { order: 4; }
  .f-fondo  { order: 5; }

  .sim-panels { display: flex; flex-direction: column; gap: var(--s6); }
  .panel-sup { order: 1; }
  .panel-ref { order: 2; }
  .ref-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }

  .res-big { font-size: 34px; letter-spacing: -.035em; word-break: break-word; }
  .sens .scen-in input { width: 76px; }

  .chart-svg { min-height: 180px; }

  /* ── Brecha ── */
  .gap-track { height: 38px; }
  .gap-labels { flex-direction: column; gap: var(--s2); }

  /* ── Tributario: tarjetas, nunca tabla horizontal ── */
  .tax-head { display: none; }
  .tl2 { grid-template-columns: 1fr; gap: var(--s4); }
  .tl2-seg { padding: var(--s3) 0; }
  .sources ul { columns: 1; }

  /* ── Tu Ruta Financiera: cadena vertical ── */
  .rt-start { gap: 0; }
  .rt-cell {
    padding: var(--s4) 0;
    border-bottom: 1px solid var(--border);
  }
  .rt-cell:last-child { border-bottom: 0; }
  .rt-sol { grid-template-columns: 1fr; gap: var(--s4); }
  .rt-fund { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
  .rt-capa-t { font-size: var(--fs-h3); }
  .est-quick { gap: var(--s2) var(--s5); }
  .rt-chart { margin-top: var(--s5); }

  /* ── Notas y disclaimers: presentes, secundarios ── */
  .note, .footnote, .ausencias { font-size: 12.5px; }
}

/* ═══════════════════════════════════════════
   MÓVIL PEQUEÑO · ≤479
   ═══════════════════════════════════════════ */

@media (max-width: 479px) {
  /* "Nueva ruta" sigue disponible en el pie del drawer */
  .ctx-actions .ctx-reset { display: none; }

  :root {
    --gutter: 16px;
    --fs-hero: 30px;
    --fs-h1: 24px;
    --fs-h2: 19px;
    --fs-num-lg: 22px;
  }
  .phases { grid-template-columns: 1fr; }
  .ref-grid { grid-template-columns: 1fr; }
  .rt-fund { grid-template-columns: 1fr; }
  .res-big { font-size: 30px; }
  .sb-brand-s { display: none; }
  .cap { padding: 16px; }
  .serie-row { grid-template-columns: 76px 70px minmax(0, 1fr); }
}

/* ═══════════════════════════════════════════
   LANDSCAPE en móvil
   ═══════════════════════════════════════════ */

@media (max-width: 1023px) and (orientation: landscape) and (max-height: 500px) {
  .page { padding-top: var(--s5); padding-bottom: var(--s8); }
  .hero { padding-top: var(--s3); }
  .sb-nav { padding-bottom: var(--s6); }
  .res-big { font-size: 28px; }
}


/* ═══════════════ styles/print.css ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Impresión
   ------------------------------------------------------------
   El objetivo no es imprimir la interfaz, sino producir un
   informe compacto. La pantalla de resultado (#/ruta) tiene su
   propio tratamiento para caber en 1–2 páginas.
   ============================================================ */

@media print {

  @page { margin: 14mm 14mm 16mm; }

  /* Cromo de la aplicación: fuera */
  .sb, .sb-scrim, .topbar, .ctx-actions, .next, .nav-toggle,
  .controls, .actions, .btn, .band-actions, .act-bar,
  .rt-actions, .link-arrow, .seg, .cards, .field, input, select,
  .sb-prog, .caps, .cap-btn, .est-acts, .est-quitar,
  .cap-assoc, .combo { display: none !important; }

  html, body { background: #fff; }
  body { font-size: 9.5pt; line-height: 1.45; color: #000; }
  .shell { display: block; }
  .main { margin-left: 0 !important; }
  .page { padding: 0; max-width: none; animation: none; }
  #view { opacity: 1 !important; }

  a { color: #000; text-decoration: none; }
  .note, .footnote, .aviso, .t-3, .rt-fecha { color: #444; }

  /* ── Encabezado del informe ── */
  body[data-screen="ruta"] .rt-head::before {
    content: 'RUTA FINANCIERA · Herramienta de Educación y Planificación Financiera';
    display: block;
    font-size: 8pt; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    padding-bottom: 4mm; margin-bottom: 5mm; border-bottom: .6pt solid #000;
  }
  body[data-screen="ruta"] .rt-head { border-bottom: 0; padding-bottom: 3mm; }
  body[data-screen="ruta"] .t-eyebrow { display: none; }
  body[data-screen="ruta"] h1.t-h1 { font-size: 20pt; letter-spacing: -.02em; }
  body[data-screen="ruta"] .head-lead { font-size: 10pt; margin-top: 1mm; }

  /* ── Secciones compactas ── */
  body[data-screen="ruta"] .rt-sec {
    margin-top: 5mm; padding-top: 3mm;
    border-top: .4pt solid #BBB;
    page-break-inside: avoid;
  }
  body[data-screen="ruta"] .rt-sec--main { border-top: 1pt solid #000; }
  body[data-screen="ruta"] .rt-k { font-size: 7.5pt; letter-spacing: .12em; }
  body[data-screen="ruta"] .rt-h { font-size: 15pt; }
  body[data-screen="ruta"] .rt-sub,
  body[data-screen="ruta"] .rt-cell-v,
  body[data-screen="ruta"] .rt-fv { font-size: 10.5pt; }
  body[data-screen="ruta"] .res-big { font-size: 24pt; margin-top: 2mm; }
  body[data-screen="ruta"] .res-cap { font-size: 10pt; }
  body[data-screen="ruta"] .res-m,
  body[data-screen="ruta"] .rt-tax-v { font-size: 12pt; }
  body[data-screen="ruta"] .res-metrics,
  body[data-screen="ruta"] .rt-start,
  body[data-screen="ruta"] .rt-fund,
  body[data-screen="ruta"] .rt-tax { gap: 4mm; margin-top: 3mm; }
  body[data-screen="ruta"] .rt-ctx { margin-top: 3mm; font-size: 9.5pt; }

  /* El gráfico se conserva, acotado */
  body[data-screen="ruta"] .rt-chart { margin-top: 4mm; max-height: 55mm; }
  body[data-screen="ruta"] .chart-svg { max-height: 55mm; }

  /* Otras alternativas: secundarias. No deben provocar una
     tercera página; se omiten del informe. */
  body[data-screen="ruta"] .rt-sec--sec { display: none; }

  /* Estrategia: sólo las capas activas, compactas */
  body[data-screen="ruta"] .est-quick { gap: 3mm 6mm; margin-top: 2mm; }
  body[data-screen="ruta"] .est-q { font-size: 9pt; }
  body[data-screen="ruta"] .rt-capas { margin-top: 3mm; }
  body[data-screen="ruta"] .rt-capa { padding: 2.5mm 0; page-break-inside: avoid; }
  body[data-screen="ruta"] .rt-capa-t { font-size: 12pt; margin-top: 1mm; }
  body[data-screen="ruta"] .rt-capa-grid { gap: 3mm; margin-top: 2mm; }
  body[data-screen="ruta"] .rt-capa-v { font-size: 9.5pt; }

  body[data-screen="ruta"] .rt-disc {
    margin-top: 5mm; padding-top: 3mm;
    border-top: .4pt solid #BBB;
    font-size: 7.5pt; line-height: 1.4; color: #333;
    page-break-inside: avoid;
  }

  /* ── Resto de pantallas ── */
  .ctx { position: static; border-bottom: .6pt solid #999; padding: 0 0 3mm;
    margin-bottom: 5mm; background: none; }
  table.tbl { page-break-inside: auto; }
  table.tbl tr { page-break-inside: avoid; }
  table.tbl thead { display: table-header-group; }
  .fund-row, .serie-row, .ev-row, .anchor, .sum-block, .ficha-block { page-break-inside: avoid; }
}

<div class="shell">

<script>

/* ═══════════════ data/meta.js ═══════════════ */
/* ============================================================
   RUTA FINANCIERA · Metadatos de la fuente de datos
   ------------------------------------------------------------
   ACTUALIZACIÓN MENSUAL:
   Para cargar un reporte nuevo basta con reemplazar este archivo
   y data/returns.js. Nada más del proyecto debe modificarse.
   ============================================================ */

/* Versión de la publicación. La reescribe build-standalone.js en cada
   compilación y se compara contra version.json para detectar que hay
   una versión más reciente en línea. NO es la fecha de los datos. */
var APP_VERSION = '2026-08-18-0128';

var DATA_META = {

  /* Fecha de corte de las rentabilidades */
  date: '16/08/2026',
  dateISO: '2026-08-16',

  /* Documento fuente */
  source: 'Reporte de Rentabilidad al 16/08/2026',
  sourceFile: 'RentFondosMutuos_16082026',

  /* Rótulo que debe acompañar toda tabla de rentabilidad */
  stamp: 'Rentabilidades nominales al 16/08/2026',

  /* Advertencia obligatoria — texto literal del reporte oficial */
  disclaimer: 'Las rentabilidades pasadas no garantizan rentabilidades futuras. ' +
              'Los valores de las cuotas de los fondos mutuos son variables.',

  /* Encuadre general de la herramienta */
  scope: 'Herramienta de educación y planificación financiera. No constituye ' +
         'recomendación de inversión, perfilamiento formal, ni asesoría financiera, ' +
         'previsional o tributaria.'
};

/* Definición de cada período de rentabilidad conservado.
   Se mantienen como métricas SEPARADAS por decisión de proyecto.
   `acumAno` y `volatilidad` son columnas distintas del reporte
   y no deben fusionarse. */

var AGE_MIN = 18;
var AGE_MAX = 110;

/* Resuelve la etapa a partir de la edad.
   Devuelve el id de etapa o null si la edad no es válida. */
function resolveStage(edad) {
  var e = parseInt(edad, 10);
  if (isNaN(e) || e < AGE_MIN || e > AGE_MAX) return null;
  if (e < 35) return 'acumulacion';
  if (e < 50) return 'consolidacion';
  if (e < 62) return 'preretiro';
  return 'distribucion';
}
